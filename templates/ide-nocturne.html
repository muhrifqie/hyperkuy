<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&family=JetBrains+Mono:ital,wght@0,500;0,700;0,800;1,500&display=block" rel="stylesheet" />
<!--DATA-->
<style>
  /* Editor Kode (dark-20 #18) as a 9:16 hook: VS Code-like editor, title as the selected heading, items as an object literal. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #1e1e1e; }
  body { position: relative; color: #d4d4d4; font-family: "JetBrains Mono", monospace; }
  .tabs { position: absolute; left: 0; right: 0; top: 280px; height: 84px; background: #252526; display: flex; }
  .tabs span { padding: 0 34px; display: flex; align-items: center; gap: 14px; font-size: 30px; color: #8b8b8b; border-right: 2px solid #1e1e1e; }
  .tabs .on { background: #1e1e1e; color: #fff; border-top: 4px solid #a8b1ff; }
  .tabs .ts { font: 800 24px "JetBrains Mono", monospace; color: #3178c6; background: #13283f; padding: 2px 8px; border-radius: 6px; }
  .crumb { position: absolute; left: 50px; top: 380px; font-size: 26px; color: #8b8b8b; }
  .ed { position: absolute; left: 0; right: 0; top: 440px; bottom: 410px; display: flex; flex-direction: column; justify-content: center; }
  .ln { display: flex; align-items: baseline; font-size: 42px; line-height: 1.62; white-space: pre-wrap; }
  .n { flex: none; width: 130px; padding-right: 30px; text-align: right; color: #6e7681; font-size: 34px; }
  .ln.cur .n { color: #c6c6c6; }
  .cd { flex: 1; min-width: 0; padding-right: 150px; padding-left: 2ch; text-indent: -2ch; } /* code stays left of x 900; wrapped lines hang */
  .kw { color: #569cd6; } .s { color: #ce9178; } .num { color: #b5cea8; } .pr { color: #9cdcfe; } .pu { color: #d4d4d4; }
  .cm { color: #8b949e; font-style: italic; }
  .head { display: flex; margin: 14px 0 20px; }
  .head .n { display: flex; flex-direction: column; }
  .title { flex: 1; padding-right: 150px; padding-left: 4px; font-family: "Inter Tight", sans-serif; font-weight: 800; font-size: 100px; line-height: 1.06; letter-spacing: -0.035em; color: #fff; white-space: normal; }
  .title .hl { background: #264f78; box-shadow: 0 0 0 6px #264f78; border-radius: 4px; color: #fff; }
  .title .caret { display: inline-block; width: 6px; height: 0.9em; background: #a8b1ff; vertical-align: -0.08em; margin-left: 4px; }
  .curline { background: rgba(255,255,255,0.04); box-shadow: inset 0 0 0 2px rgba(255,255,255,0.06); }
  .mini { position: absolute; right: 26px; top: 460px; width: 70px; display: flex; flex-direction: column; gap: 9px; opacity: 0.5; }
  .mini i { display: block; height: 6px; border-radius: 2px; }
  .mini .vp { position: absolute; left: -6px; right: -6px; top: -10px; height: 300px; background: rgba(121,121,121,0.18); }
  .status { position: absolute; left: 0; right: 0; bottom: 300px; min-height: 66px; background: #0078d4; color: #fff; display: flex; justify-content: space-between; align-items: center; gap: 30px; padding: 12px 40px; font-size: 27px; line-height: 1.35; }
  .status span:last-child { white-space: nowrap; }
</style>
</head>
<body>
<div class="tabs"><span class="on"><b class="ts">TS</b><span id="file" style="padding:0;border:0;color:#fff"></span></span><span>README.md</span></div>
<div class="crumb" id="crumb"></div>
<div class="ed" id="ed"></div>
<div class="mini" id="mini"><b class="vp"></b></div>
<div class="status"><span id="st1"></span><span id="st2"></span></div>
<script>
  // Fallback sample so the file also opens standalone in a browser.
  const D = window.D || { seri: "cara-kerja-ai", series: "Cara kerja AI", ep: "#01", title: "AI nggak baca kata. Dia baca token.", hl: "token",
    sub: "Makanya AI kadang salah hitung huruf di kata \"strawberry\".",
    items: [{ label: "Ken·apa", value: "2 token" }, { label: "AI", value: "1 token" }, { label: "bisa", value: "1 token" }, { label: "ng·arang", value: "2 token" }],
    source: "ilustrasi — jumlah token beda tiap model", date: "per 14 Okt 2026" };
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const hlWrap = (t, h) => { const i = h ? t.toLowerCase().indexOf(h.toLowerCase()) : -1;
    return i < 0 ? esc(t) + `<span class="caret"></span>` : esc(t.slice(0, i)) + `<span class="hl">${esc(t.slice(i, i + h.length))}</span><span class="caret"></span>` + esc(t.slice(i + h.length)); };
  const slug = D.series_id || D.seri || String(D.series || "hook").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  const camel = slug.replace(/-([a-z0-9])/g, (_, c) => c.toUpperCase()).replace(/^[^a-z_]+/i, "") || "data";
  const items = (D.items || []).slice(0, 5);
  const key = (k) => /^[A-Za-z_$][\w$]*$/.test(k) ? `<span class="pr">${esc(k)}</span>` : `<span class="s">"${esc(k)}"</span>`;
  const val = (v) => /^\d[\d_]*(\.\d+)?$/.test(String(v)) ? `<span class="num">${esc(v)}</span>` : `<span class="s">"${esc(v)}"</span>`;
  // Wrap the sub line into short comment lines (mono, ~32 chars per line).
  const wrap = (s, n) => String(s || "").split(/\s+/).reduce((a, w) => { const l = a[a.length - 1]; (l && (l + " " + w).length <= n) ? a[a.length - 1] = l + " " + w : a.push(w); return a; }, []);

  document.getElementById("file").textContent = `${slug}.ts`;
  document.getElementById("crumb").textContent = `src › ${slug}.ts › ${camel}`;
  document.getElementById("st1").textContent = `⎇ main ✓  ·  ${D.source ? "sumber: " + D.source : "TypeScript"}`;
  document.getElementById("st2").textContent = D.date || "";

  const render = (codeFs) => {
    let no = 1; const L = (html, cls = "") => `<div class="ln ${cls}"><span class="n">${no++}</span><span class="cd">${html}</span></div>`;
    let h = L(`<span class="cm">// ${esc(D.series || "")} ${esc(D.ep || "")}</span>`);
    h += `<div class="head curline"><span class="n" id="tn"></span><div class="title" id="title">${hlWrap(D.title || "", D.hl)}</div></div>`;
    const titleNo = no;
    h += L(`<span class="kw">const</span> <span class="pr">${esc(camel)}</span> <span class="pu">= {</span>`);
    items.forEach((it) => { h += L(`  ${key(it.label)}: ${val(it.value)},`); });
    h += L(`<span class="pu">};</span>`) + L("");
    wrap(D.sub, 28).forEach((l) => { h += L(`<span class="cm">// ${esc(l)}</span>`); });
    const ed = document.getElementById("ed"); ed.innerHTML = h;
    ed.querySelectorAll(".ln").forEach((e) => (e.style.fontSize = codeFs + "px"));
    return titleNo;
  };
  // Number each visual title line and renumber the following code lines.
  const numberTitle = (startNo) => {
    const t = document.getElementById("title"), lh = parseFloat(getComputedStyle(t).lineHeight);
    const lines = Math.max(1, Math.round(t.offsetHeight / lh));
    const tn = document.getElementById("tn"); tn.style.fontSize = "34px";
    tn.innerHTML = Array.from({ length: lines }, (_, i) => `<span style="height:${lh}px;line-height:${lh}px;color:#c6c6c6">${startNo + i}</span>`).join("");
    let n = startNo + lines; document.querySelectorAll(".head ~ .ln .n").forEach((e) => (e.textContent = n++));
  };
  const fit = () => {
    let codeFs = 42, fs = 100; const startNo = render(codeFs);
    const ed = document.getElementById("ed"), t = () => document.getElementById("title");
    t().style.fontSize = fs + "px";
    while ((ed.scrollHeight > ed.clientHeight || t().offsetHeight > 400) && fs > 64) { fs -= 4; t().style.fontSize = fs + "px"; }
    const wraps = () => [...ed.querySelectorAll(".ln .cd")].some((c) => c.offsetHeight > parseFloat(getComputedStyle(c).lineHeight) * 1.4);
    while ((ed.scrollHeight > ed.clientHeight || wraps()) && codeFs > 40) { codeFs -= 1; ed.querySelectorAll(".ln").forEach((e) => (e.style.fontSize = codeFs + "px")); }
    numberTitle(startNo);
    // Minimap mirrors line lengths.
    const cols = ["#569cd6", "#9cdcfe", "#ce9178", "#8b949e", "#d4d4d4"];
    document.getElementById("mini").innerHTML = `<b class="vp"></b>` + Array.from({ length: 34 }, (_, i) => `<i style="width:${20 + ((i * 37) % 50)}px;background:${cols[i % cols.length]}"></i>`).join("");
  };
  fit(); (document.fonts ? document.fonts.ready : Promise.resolve()).then(fit);
</script>
</body>
</html>

<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>Sundial</title>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=IBM+Plex+Mono:wght@500;600&display=block" rel="stylesheet" />
<!--DATA-->
<style>
  /*
    Sundial (sundial): a limestone garden sundial on a column, seen from the south at ~42 deg.
    Metaphor: knowledge cutoff. A pale real sun hangs top-left, so today's shadow should
    fall right (the dashed peach "ghost" wedge), yet the bronze gnomon's navy shadow is
    frozen on the FIRST engraved mark (the day the training data stopped).
    Every item is an engraved hour line + inscription on the dial, read left to right like
    time; the dotted rim arc from the frozen mark to the last mark = the time the model
    never saw. The caption is the dial's engraved motto (near half); its active word sits in
    the same navy as the shadow. Date + source sit on a bronze plaque below the motto.
    Geometry: a small perspective projection P(x,y,z) + its inverse on the dial plane.
    Fully deterministic (no randomness, no time).
  */
  :root { --sand: #E9DCCB; --stone: #E8E4D8; --bronze: #8C6A3E; --bronze-ink: #6B4F2C; --ink: #2C3B5A; --sun: #E5B8A0; --cream: #F6F1E6; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--sand); }
  body { position: relative; color: var(--ink); font-family: "IBM Plex Mono", monospace; }
  #scene { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }

  .kick { position: absolute; left: 90px; right: 90px; top: 300px; display: flex; justify-content: space-between; align-items: baseline; gap: 30px;
          font: 500 28px "IBM Plex Mono", monospace; letter-spacing: 0.12em; text-transform: uppercase; color: #3E4862; white-space: nowrap; }
  .kick b { font-weight: 600; color: var(--ink); }
  .title { position: absolute; left: 90px; width: 900px; top: 352px; font-family: "Marcellus", serif; font-weight: 400;
           line-height: 1.1; letter-spacing: -0.012em; color: var(--ink); }
  .title .hl { position: relative; color: var(--bronze-ink); white-space: nowrap; }
  .title .hl::after { content: ""; position: absolute; left: -0.02em; right: -0.08em; bottom: -0.02em; height: 0.11em; background: var(--ink);
                      clip-path: polygon(0 42%, 100% 0, 100% 100%, 0 58%); }

  .mark { position: absolute; text-align: center; padding: 6px 14px 8px; }
  .mark .lb { font: 400 30px "Marcellus", serif; letter-spacing: 0.045em; text-transform: uppercase; line-height: 1.08; color: var(--ink);
              text-shadow: 0 1.5px 0 rgba(255,255,255,0.7); }
  .mark .vl { font-family: "IBM Plex Mono", monospace; font-weight: 600; line-height: 1.12; color: var(--bronze-ink); letter-spacing: -0.02em;
              text-shadow: 0 1.5px 0 rgba(255,255,255,0.6); }
  .mark.read { background: var(--ink); border-radius: 6px; box-shadow: 0 6px 0 -2px rgba(44,59,90,0.25); }
  .mark.read .lb, .mark.read .vl { color: var(--cream); text-shadow: none; }

  .cap { position: absolute; text-align: center; font-family: "Marcellus", serif; font-weight: 400; line-height: 1.3; text-wrap: pretty;
         letter-spacing: 0.005em; color: #26324D; }
  .cap .w { padding: 0 0.02em; }
  .cap .w.on { background: var(--ink); color: var(--cream); border-radius: 6px; padding: 0 0.22em 0.04em; box-decoration-break: clone; -webkit-box-decoration-break: clone; }

  .plate { position: absolute; text-align: center; color: var(--cream); }
  .plate .dt { font: 600 30px "IBM Plex Mono", monospace; letter-spacing: 0.06em; text-transform: uppercase; line-height: 1.25; }
  .plate .src { font: 500 26px "IBM Plex Mono", monospace; line-height: 1.3; letter-spacing: -0.01em; }
</style>
</head>
<body>
<svg id="scene" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" data-layout-allow-overflow></svg>
<div class="kick"><span id="kick"></span><span id="ep"></span></div>
<div class="title" id="title"></div>
<div id="marks"></div>
<div class="cap" id="cap" data-slot="caption"></div>
<div class="plate" id="plate"><div class="dt" id="dt"></div><div class="src" id="src"></div></div>
<script>
  // Fallback sample so the file also opens standalone in a browser.
  const D = window.D || { series: "Cara kerja AI", ep: "#01", kicker: "Cara kerja AI · #01",
    title: "AI nggak baca kata. Dia baca token.", hl: "token",
    sub: "Makanya AI kadang salah hitung huruf di kata \"strawberry\".",
    items: [{ label: "Ken·apa", value: "2 token" }, { label: "AI", value: "1 token" }, { label: "bisa", value: "1 token" }, { label: "ng·arang", value: "2 token" }],
    source: "ilustrasi — jumlah token beda tiap model", date: "per 14 Okt 2026" };

  Promise.all(['400 100px "Marcellus"', '400 30px "Marcellus"', '500 28px "IBM Plex Mono"', '600 40px "IBM Plex Mono"'].map(f => document.fonts.load(f)))
    .catch(() => {}).then(() => document.fonts.ready).then(render);

  function render() {
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const $ = id => document.getElementById(id);
  const items = (D.items || []).slice(0, 5);
  const n = items.length;

  // ---------- header + title ----------
  $("kick").textContent = D.series || D.kicker || "";
  $("ep").innerHTML = "<b>" + esc(D.ep || "") + "</b>";
  const t = D.title || "", hl = D.hl || "";
  const at = hl ? t.toLowerCase().indexOf(hl.toLowerCase()) : -1;
  const titleEl = $("title");
  titleEl.innerHTML = at < 0 ? esc(t) : esc(t.slice(0, at)) + '<span class="hl">' + esc(t.slice(at, at + hl.length)) + "</span>" + esc(t.slice(at + hl.length));
  for (let fs = 122; fs >= 72; fs -= 2) { titleEl.style.fontSize = fs + "px"; if (titleEl.offsetHeight <= 280) break; }
  const titleBottom = titleEl.offsetTop + titleEl.offsetHeight;

  // ---------- projection (world: x right, y up, z away from viewer; dial top at y = 0) ----------
  // The dial (R) is wider than the frame: a close, immersive crop. Its far rim sits just under the title.
  const R = 600, PR = 540, E = 50 * Math.PI / 180, CAM = 3000, X0 = 540;
  const cE = Math.cos(E), sE = Math.sin(E);
  const FAR = R * sE * CAM / (CAM + R * cE);
  const Y0 = Math.round(Math.max(1010, Math.min(1085, titleBottom + 44 + FAR)));
  const P = (x, y, z) => { const cy = y * cE + z * sE, cz = CAM + z * cE - y * sE, s = CAM / cz; return [X0 + x * s, Y0 - cy * s]; };
  const inv = (sx, sy) => { const q = Y0 - sy, z = q * CAM / (sE * CAM - q * cE), s = CAM / (CAM + z * cE); return [(sx - X0) / s, z]; };
  const pol = (r, th, y = 0) => P(r * Math.cos(th), y, r * Math.sin(th));
  const f1 = v => v.toFixed(1);
  const pts = a => a.map(p => f1(p[0]) + "," + f1(p[1])).join(" ");
  const ring = (r, y = 0, a0 = 0, a1 = Math.PI * 2, k = 160) => { const o = []; for (let i = 0; i <= k; i++) o.push(pol(r, a0 + (a1 - a0) * i / k, y)); return o; };
  const dPath = a => "M" + a.map(p => f1(p[0]) + "," + f1(p[1])).join("L");
  const deg = d => d * Math.PI / 180;

  // ---------- gnomon (bronze fin pointing to the near-right: its triangle reads in profile and the far half stays free for the calendar) ----------
  const TH_N = -26, GN_L = 0.33 * R, GN_H = 0.3 * R, GN_T = 9;
  const U = [Math.cos(deg(TH_N)), Math.sin(deg(TH_N))], NRM = [Math.sin(deg(TH_N)), -Math.cos(deg(TH_N))];
  const gw = (a, h, side) => P(U[0] * a + NRM[0] * GN_T * side, h, U[1] * a + NRM[1] * GN_T * side);  // a = along, h = height
  // profile: root -> base -> concave back edge up to the tip
  const prof = [[0, 0], [GN_L, 0]];
  for (let k = 1; k <= 16; k++) { const u = k / 16; prof.push([GN_L - 0.12 * GN_L * Math.sin(Math.PI * u), GN_H * u]); }
  const gnFace = prof.map(p => gw(p[0], p[1], 1));
  const gnAll = prof.map(p => gw(p[0], p[1], 1)).concat(prof.map(p => gw(p[0], p[1], -1)));
  const GNB = (() => { const xs = gnAll.map(p => p[0]), ys = gnAll.map(p => p[1]); return { x: Math.min(...xs) - 18, y: Math.min(...ys) - 18, w: Math.max(...xs) - Math.min(...xs) + 36, h: Math.max(...ys) - Math.min(...ys) + 36 }; })();
  const BOSS = { x: X0 - 50, y: Y0 - 44, w: 100, h: 88 };

  // ---------- item inscriptions: measure, then fan them left -> right over the far half ----------
  const marks = $("marks");
  const els = items.map((it, i) => {
    const el = document.createElement("div");
    el.className = "mark" + (i === 0 ? " read" : "");
    el.innerHTML = `<div class="lb">${esc(it.label)}</div><div class="vl">${esc(it.value)}</div>`;
    marks.appendChild(el);
    return el;
  });
  const RIM_IN = 0.872 * R;
  const inRing = b => [[b.x, b.y], [b.x + b.w, b.y], [b.x, b.y + b.h], [b.x + b.w, b.y + b.h]].every(([x, y]) => { const w = inv(x, y); return Math.hypot(w[0], w[1]) <= RIM_IN; });
  const hit = (a, b, g) => a.x < b.x + b.w + g && b.x < a.x + a.w + g && a.y < b.y + b.h + g && b.y < a.y + a.h + g;
  const boxFor = (th, w, h) => {
    let b = null;
    for (let k = 0.86; k >= 0.4; k -= 0.01) {
      const p = pol(R * k, deg(th));
      let x = Math.max(96, Math.min(p[0] - w / 2, 984 - w)); const y = p[1] - h / 2;
      if (y + h > 895) x = Math.min(x, 896 - w);
      b = { x, y, w, h, k, th };
      if (inRing(b)) return b;
    }
    return b;
  };
  const TH0 = 177, TH_END = 12;
  const boxAt = (th, k, w, h) => {
    const p = pol(R * k, deg(th));
    let x = Math.max(96, Math.min(p[0] - w / 2, 984 - w)); const y = p[1] - h / 2;
    if (y + h > 895) x = Math.min(x, 896 - w);
    return { x, y, w, h, k, th };
  };
  // does the engraved hour line at angle th (from the boss out to radius kEnd) run through any box?
  const lineHits = (th, kEnd, boxes) => {
    for (let k = 0.1; k <= kEnd; k += 0.01) {
      const p = pol(R * k, deg(th));
      if (boxes.some(b => p[0] > b.x - 6 && p[0] < b.x + b.w + 6 && p[1] > b.y - 6 && p[1] < b.y + b.h + 6)) return true;
    }
    return false;
  };
  const free = (b, prev) => inRing(b) && !prev.some(p => hit(b, p, 14)) && !hit(b, GNB, 0) && !hit(b, BOSS, 0) && b.y + b.h < Y0 + 40 &&
    !lineHits(b.th, b.k - 0.04, prev) && !prev.some(p => lineHits(p.th, p.k - 0.04, [b]));
  // how far clockwise a box reaches (min world angle of its corners): smaller reach = tighter packing
  const reach = b => Math.min(...[[b.x, b.y], [b.x + b.w, b.y], [b.x, b.y + b.h], [b.x + b.w, b.y + b.h]].map(([x, y]) => {
    const w = inv(x, y); let a = Math.atan2(w[1], w[0]) * 180 / Math.PI; if (a < -90) a += 360; return a; }));
  // greedy: each mark at least minStep degrees clockwise of the previous one, hugging the rim as tightly as possible
  const greedy = (sz, minStep) => {
    const out = [];
    for (let i = 0; i < sz.length; i++) {
      let best = null, bestR = -1e9;
      const aTop = i ? out[i - 1].th - minStep : TH0, aLow = i ? TH_END : TH0;
      for (let a = aTop; a >= aLow; a -= 1)
        for (let k = 0.86; k >= 0.4; k -= 0.02) {
          const c = boxAt(a, k, ...sz[i]), r = reach(c);
          if (r <= bestR + 0.01) continue;
          if (free(c, out)) { best = c; bestR = r; }
        }
      if (!best) return null;
      out.push(best);
    }
    return out;
  };
  let placed = null;
  for (const cfg of [{ mw: 300, vf: 40 }, { mw: 250, vf: 38 }, { mw: 210, vf: 36 }]) {
    els.forEach(el => { el.style.maxWidth = cfg.mw + "px"; el.querySelector(".vl").style.fontSize = cfg.vf + "px"; });
    const sz = els.map(el => [el.offsetWidth, el.offsetHeight]);
    if (!n) { placed = []; break; }
    // widest even spread that still fits
    for (let step = n > 1 ? Math.floor((TH0 - 30) / (n - 1)) : 0; step >= 2 && !placed; step -= 1) placed = greedy(sz, step);
    if (n === 1) placed = greedy(sz, 0);
    if (placed) break;
  }
  if (!placed) { const sz = els.map(el => [el.offsetWidth, el.offsetHeight]); placed = sz.map((s, i) => boxFor(TH0 - i * (TH0 - 60) / Math.max(1, n - 1), ...s)); }
  placed.forEach((b, i) => { els[i].style.left = f1(b.x) + "px"; els[i].style.top = f1(b.y) + "px"; });
  const angles = placed.map(b => b.th);

  // hour line from the boss to the inscription, stopping 12 px before its box
  const lineEnd = (th, b) => {
    const g = { x: b.x - 12, y: b.y - 12, w: b.w + 24, h: b.h + 24 };
    let last = 0.1;
    for (let k = 0.1; k <= b.k + 0.001; k += 0.005) { const p = pol(R * k, deg(th)); if (p[0] > g.x && p[0] < g.x + g.w && p[1] > g.y && p[1] < g.y + g.h) break; last = k; }
    return last;
  };
  const ends = placed.map((b, i) => lineEnd(angles[i], b));

  // ---------- scene ----------
  const S = [];
  S.push(`<defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EFE5D8"/><stop offset="0.5" stop-color="#E9DCCB"/><stop offset="1" stop-color="#E1D1BC"/></linearGradient>
    <radialGradient id="sunG" cx="0.58" cy="0.42" r="0.7"><stop offset="0" stop-color="#F4DDCF"/><stop offset="0.72" stop-color="#E9C1AA"/><stop offset="1" stop-color="#E2B095"/></radialGradient>
    <radialGradient id="dialG" cx="0.24" cy="0.16" r="1.05"><stop offset="0" stop-color="#F7F5EF"/><stop offset="0.55" stop-color="#ECE8DE"/><stop offset="1" stop-color="#D8D1C1"/></radialGradient>
    <linearGradient id="sideG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C9C2B0"/><stop offset="0.2" stop-color="#DAD4C5"/><stop offset="0.62" stop-color="#B3AA95"/><stop offset="1" stop-color="#8E856F"/></linearGradient>
    <linearGradient id="colG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#CFC9B9"/><stop offset="0.22" stop-color="#E2DDD0"/><stop offset="0.66" stop-color="#B2A994"/><stop offset="1" stop-color="#958C77"/></linearGradient>
    <linearGradient id="finG" x1="0" y1="1" x2="0.3" y2="0"><stop offset="0" stop-color="#6A4D29"/><stop offset="0.6" stop-color="#8F6A3D"/><stop offset="1" stop-color="#A9804B"/></linearGradient>
    <linearGradient id="finTopG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E6C48E"/><stop offset="1" stop-color="#C79B60"/></linearGradient>
    <linearGradient id="plateG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7A5A33"/><stop offset="1" stop-color="#5C4224"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.4"/></filter>
    <filter id="crisp" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="1.3"/></filter>
    <filter id="softer" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="11" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.36  0 0 0 0 0.33  0 0 0 0 0.28  0 0 0 -1.6 1.02"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>`);
  S.push(`<rect width="1080" height="1920" fill="url(#bg)"/>`);

  // pale REAL sun, top-left: today's shadow should fall to the right
  { const cx = 176, cy = 118;
    S.push(`<circle cx="${cx}" cy="${cy}" r="126" fill="none" stroke="#E0B49C" stroke-width="2" opacity="0.75"/>`);
    S.push(`<circle cx="${cx}" cy="${cy}" r="104" fill="url(#sunG)"/>`);
    S.push(`<circle cx="${cx}" cy="${cy}" r="150" fill="none" stroke="#E4BDA6" stroke-width="1.5" opacity="0.55"/>`); }

  // pedestal heights (world units, dial top = 0)
  const SLAB = 50, Y_SH_TOP = -112, Y_SH_BOT = -1010, Y_GROUND = -1190, PL = 0.36 * PR;

  // ground: paving rings + the column's REAL cast shadow toward lower-right (sun top-left)
  [0.62, 0.86, 1.12, 1.4].forEach((k, i) => S.push(`<path d="${dPath(ring(PR * k, Y_GROUND))}Z" fill="none" stroke="#D2C1AA" stroke-width="${i ? 3 : 4}" opacity="0.9"/>`));
  { const g = Y_GROUND, a = PL, L = 1150;
    const sh = [P(-a, g, a), P(a, g, a), P(a + L * 0.7, g, a - L * 0.7), P(a + L * 0.7 - 2 * a, g, -a - L * 0.7), P(-a, g, -a)];
    S.push(`<polygon points="${pts(sh)}" fill="#2C3B5A" opacity="0.12" filter="url(#softer)"/>`); }

  // plinth (square box): front face + top
  { const g = Y_GROUND, h = 150, a = PL;
    const top = [P(-a, g + h, a), P(a, g + h, a), P(a, g + h, -a), P(-a, g + h, -a)];
    const front = [P(-a, g + h, -a), P(a, g + h, -a), P(a, g, -a), P(-a, g, -a)];
    S.push(`<polygon points="${pts(front)}" fill="url(#colG)"/>`);
    S.push(`<polygon points="${pts(top)}" fill="#E0DACC"/>`);
    S.push(`<polyline points="${pts([front[0], front[1]])}" stroke="#F2EEE5" stroke-width="2" fill="none"/>`); }
  // cylinder helper: visible side band + optional top ellipse
  const cyl = (r, yT, yB, fill, topFill) => {
    const k = 64, top = [], bot = [];
    for (let i = 0; i <= k; i++) { const th = Math.PI + Math.PI * i / k; top.push(pol(r, th, yT)); bot.push(pol(r, th, yB)); }
    S.push(`<path d="${dPath(top)}L${bot.reverse().map(p => f1(p[0]) + "," + f1(p[1])).join("L")}Z" fill="${fill}"/>`);
    if (topFill) S.push(`<path d="${dPath(ring(r, yT))}Z" fill="${topFill}"/>`);
  };
  cyl(0.30 * PR, Y_SH_BOT, Y_GROUND + 150, "url(#colG)", "#DCD6C8");    // base drum
  cyl(0.20 * PR, Y_SH_TOP, Y_SH_BOT, "url(#colG)", null);                // shaft
  // shaft flutes (fine vertical grooves)
  [-0.75, -0.45, -0.15, 0.15, 0.45, 0.75].forEach(u => { const x = 0.2 * PR * u, z = -0.2 * PR * Math.sqrt(1 - u * u);
    S.push(`<path d="${dPath([P(x, Y_SH_TOP - 30, z), P(x, Y_SH_BOT + 30, z)])}" stroke="#8E856F" stroke-width="2" opacity="${0.22 + 0.2 * Math.max(0, u)}" fill="none"/>`); });
  cyl(0.27 * PR, -80, Y_SH_TOP, "url(#colG)", null);                     // echinus
  cyl(0.36 * PR, -SLAB, -80, "url(#colG)", null);                        // capital

  // dial slab: side band (near half) + top face
  { const k = 120, top = [], bot = [];
    for (let i = 0; i <= k; i++) { const th = Math.PI + Math.PI * i / k; top.push(pol(R, th, 0)); bot.push(pol(R, th, -SLAB)); }
    S.push(`<path d="${dPath(top)}L${bot.reverse().map(p => f1(p[0]) + "," + f1(p[1])).join("L")}Z" fill="url(#sideG)"/>`); }
  const face = dPath(ring(R, 0)) + "Z";
  S.push(`<path d="${face}" fill="url(#dialG)"/>`);
  S.push(`<path d="${face}" fill="#000" filter="url(#grain)" opacity="0.2"/>`);
  S.push(`<path d="${face}" fill="none" stroke="#FAF8F3" stroke-width="3"/>`);
  const engrave = (d, w = 3, o = 1) => S.push(`<path d="${d}" fill="none" stroke="#FFFFFF" stroke-width="${w}" opacity="${0.75 * o}" transform="translate(0,1.6)"/><path d="${d}" fill="none" stroke="#7E7562" stroke-width="${w}" opacity="${o}" stroke-linecap="round"/>`);
  engrave(dPath(ring(R * 0.965, 0)) + "Z", 2.2);
  engrave(dPath(ring(R * 0.925, 0, deg(-4), deg(184))), 2.2);
  // fine ticks along the far half (the calendar band)
  for (let a = 0; a <= 180; a += 6) engrave(dPath([pol(R * 0.925, deg(a)), pol(R * (a % 30 === 0 ? 0.965 : 0.95), deg(a))]), a % 30 === 0 ? 2.6 : 1.8, a % 30 === 0 ? 0.9 : 0.7);
  // engraved hour lines for the items + a bold rim tick each
  angles.forEach((a, i) => {
    engrave(dPath([pol(R * 0.09, deg(a)), pol(R * ends[i], deg(a))]), i === 0 ? 4 : 3);
    engrave(dPath([pol(R * 0.915, deg(a)), pol(R * 0.965, deg(a))]), 5);
  });
  // near half: motto band ring
  engrave(dPath(ring(R * 0.925, 0, deg(196), deg(344))), 2.2);

  // dotted arc on the rim: the time the model never saw (frozen mark -> last mark), arrow = direction of time
  if (n > 1) {
    const a0 = angles[0], a1 = angles[n - 1], arc = [];
    for (let k = 0; k <= 100; k++) arc.push(pol(R * 0.895, deg(a0 + (a1 - a0) * k / 100)));
    S.push(`<path d="${dPath(arc)}" fill="none" stroke="#8C6A3E" stroke-width="5.5" stroke-dasharray="0.1 15" stroke-linecap="round"/>`);
    const e1 = pol(R * 0.895, deg(a1 - 2.2)), e0 = pol(R * 0.895, deg(a1 + 3));
    const dx = e1[0] - e0[0], dy = e1[1] - e0[1], L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L;
    const tip = [e1[0] + ux * 8, e1[1] + uy * 8], b1 = [e1[0] - ux * 14 - uy * 11, e1[1] - uy * 14 + ux * 11], b2 = [e1[0] - ux * 14 + uy * 11, e1[1] - uy * 14 - ux * 11];
    S.push(`<polygon points="${pts([tip, b1, b2])}" fill="#8C6A3E"/>`);
    // a pale-sun dot where today's reading would be
    const sd = pol(R * 0.895, deg(a1));
    S.push(`<circle cx="${f1(sd[0])}" cy="${f1(sd[1])}" r="11" fill="#E5B8A0" stroke="#B9825F" stroke-width="2.5"/>`);
  }

  // shadow wedges share one shape: apex at the boss, a sharp reading edge on the hour line, a soft far edge
  const RS = P(0, 0, 0);
  const wedge = (th, kEnd, spread) => [RS, pol(R * kEnd, deg(th)), pol(R * kEnd * 0.93, deg(th - spread)), pol(R * 0.12, deg(th - spread * 0.6))];
  // ghost wedge: where TODAY's sun (top-left) would put the shadow -> the last mark
  if (n > 1) {
    const g = wedge(angles[n - 1], ends[n - 1], -7);
    S.push(`<polygon points="${pts(g)}" fill="#E5B8A0" opacity="0.32"/>`);
    S.push(`<polygon points="${pts(g)}" fill="none" stroke="#C48A68" stroke-width="3" stroke-dasharray="12 9" stroke-linejoin="round"/>`);
  }
  // the FROZEN shadow: the gnomon's navy wedge still lying on the first mark
  if (n) {
    const f = wedge(angles[0], ends[0], 10);
    S.push(`<polygon points="${pts(f)}" fill="#2C3B5A" opacity="0.6" filter="url(#crisp)"/>`);
    S.push(`<path d="${dPath([RS, pol(R * ends[0], deg(angles[0]))])}" stroke="#2C3B5A" stroke-width="4.5" opacity="0.9" fill="none" stroke-linecap="round"/>`);
  }

  // gnomon: lit sloped top strip, then the visible side face, then the boss
  { const st0 = gw(0, 0, -1), st1 = gw(prof[prof.length - 1][0], GN_H, -1), st2 = gw(prof[prof.length - 1][0], GN_H, 1), st3 = gw(0, 0, 1);
    S.push(`<polygon points="${pts(gnFace)}" fill="#2C3B5A" opacity="0.18" transform="translate(-6,4)" filter="url(#soft)"/>`);
    S.push(`<polygon points="${pts([st0, st1, st2, st3])}" fill="url(#finTopG)"/>`);
    S.push(`<polygon points="${pts(gnFace)}" fill="url(#finG)"/>`);
    S.push(`<polyline points="${pts([st3, st2])}" fill="none" stroke="#F1D7A6" stroke-width="2.5"/>`);
    S.push(`<polyline points="${pts([gw(0, 0, 1), gw(GN_L, 0, 1)])}" fill="none" stroke="#3E2D17" stroke-width="3" opacity="0.55" stroke-linecap="round"/>`);
    // engraved decorative ring on the fin
    const c = gw(GN_L * 0.55, GN_H * 0.3, 1.05), c2 = gw(GN_L * 0.55 + 18, GN_H * 0.3, 1.05);
    S.push(`<circle cx="${f1(c[0])}" cy="${f1(c[1])}" r="${f1(Math.hypot(c2[0] - c[0], c2[1] - c[1]))}" fill="none" stroke="#5E4425" stroke-width="3" opacity="0.8"/>`);
    S.push(`<path d="${dPath(ring(R * 0.055, 1))}Z" fill="#8C6A3E" stroke="#5E4425" stroke-width="2"/>`);
    S.push(`<path d="${dPath(ring(R * 0.03, 2))}Z" fill="#B48A55"/>`); }

  // ---------- caption = the dial's motto (karaoke) ----------
  const capText = D.caption || D.sub || "";
  const words = capText.split(/\s+/).filter(Boolean);
  const norm = w => w.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, "");
  let on = words.length ? [0] : [];
  if (hl) {
    const hw = hl.split(/\s+/).map(norm).filter(Boolean);
    for (let i = 0; hw.length && i + hw.length <= words.length; i++) {
      if (hw.every((h, j) => norm(words[i + j]) === h)) { on = hw.map((_, j) => i + j); break; }
    }
  }
  const capEl = $("cap");
  const html = []; let wi = 0;
  while (wi < words.length) {
    if (on.includes(wi)) { const grp = []; while (wi < words.length && on.includes(wi)) grp.push(esc(words[wi++])); html.push('<span class="w on">' + grp.join(" ") + "</span>"); }
    else html.push('<span class="w">' + esc(words[wi++]) + "</span>");
  }
  // widow control: tie the last two words together so the motto never ends on a lone word
  capEl.innerHTML = html.length > 3 ? html.slice(0, -1).join(" ") + "&nbsp;" + html[html.length - 1] : html.join(" ");
  let fit = false;
  for (const cw of [740, 810]) {
    capEl.style.width = cw + "px"; capEl.style.left = (cw === 810 ? 90 : 900 - cw) + "px";
    for (let fs = 48; fs >= 40; fs -= 1) { capEl.style.fontSize = fs + "px"; if (capEl.offsetHeight <= fs * 1.3 * 2 + 4) { fit = true; break; } }
    if (fit) break;
  }
  const capTop = Math.round(Math.max(Y0 + 78, GNB.y + GNB.h + 8));
  capEl.style.top = capTop + "px";

  // ---------- bronze plaque: today's date + source ----------
  const plate = $("plate");
  $("dt").textContent = D.date || "";
  $("src").textContent = D.source || "";
  const pTop = capTop + capEl.offsetHeight + 46, padX = 34, padY = 18, PCX = 520;
  let pw = 0, ph = 0;
  for (let mw = 620, k = 0; k < 4; k++) {
    plate.style.maxWidth = mw + "px";
    pw = plate.offsetWidth; ph = plate.offsetHeight;
    // the plaque must sit on the dial face: compare with the chord at its bottom edge
    const w = inv(PCX, pTop + ph + padY), half = Math.sqrt(Math.max(0, (0.93 * R) ** 2 - w[1] ** 2)) * (CAM / (CAM + w[1] * cE));
    if (pw / 2 + padX <= half || mw <= 420) break;
    mw = Math.max(420, Math.floor(2 * (half - padX)) - 4);
  }
  plate.style.left = f1(PCX - pw / 2) + "px"; plate.style.top = pTop + "px";
  { const x0 = PCX - pw / 2 - padX, x1 = PCX + pw / 2 + padX, y0 = pTop - padY, y1 = pTop + ph + padY, ins = 10;
    const poly = [[x0 + ins, y0], [x1 - ins, y0], [x1, y1], [x0, y1]];
    S.push(`<polygon points="${pts(poly.map(p => [p[0] + 5, p[1] + 7]))}" fill="#2C3B5A" opacity="0.2" filter="url(#soft)"/>` +
      `<polygon points="${pts(poly)}" fill="url(#plateG)" stroke="#A88150" stroke-width="3"/>` +
      [[x0 + ins + 16, y0 + 14], [x1 - ins - 16, y0 + 14], [x1 - 18, y1 - 14], [x0 + 18, y1 - 14]].map(c => `<circle cx="${f1(c[0])}" cy="${f1(c[1])}" r="5" fill="#C9A26B"/>`).join("")); }

  $("scene").innerHTML = S.join("");
  }
</script>

<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;700&family=Onest:wght@400;500;600;700&display=block" rel="stylesheet" />
<!--DATA-->
<style>
  /*
    Well Plate (well-plate): microplate 96-sumbat tiga-perempat, disuapi
    pipet 8-kanal — metafora GPU: satu gerakan mengisi satu kolom penuh.
    Item = kelompok kolom berwarna (koral, amber, periwinkle) dengan chip
    "1/3" di rim + chip data di kiri. Sumbat highlight = kolom di bawah
    pipet. Strip printout plate-reader memuat sumber + tanggal.
    Deterministik: grid murni CSS, tanpa random.
  */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #E8EEF2; }
  body { position: relative; font-family: "Onest", sans-serif; color: #1C2A3A; }

  .kick { position: absolute; left: 90px; top: 296px; width: 880px; white-space: nowrap; font: 500 26px "Geist Mono"; letter-spacing: .06em; color: #44546B; max-width: 600px; overflow: hidden; }
  .kick b { color: #1C2A3A; font-weight: 700; }
  .title { position: absolute; left: 90px; top: 352px; width: 620px;
    font-family: "Geist Mono", monospace; font-weight: 700; line-height: 1.16; letter-spacing: -.02em; }
  .title .hl { background: #1C2A3A; color: #E8EEF2; padding: 0 .12em; }

  .print { position: absolute; right: 84px; top: 300px; width: 300px; background: #F7FAFC;
    border: 2px solid #1C2A3A; padding: 12px 16px; transform: rotate(2.4deg);
    box-shadow: 7px 8px 0 rgba(28,42,58,.16); font: 500 26px/1.35 "Geist Mono"; color: #44546B; z-index: 5; }
  .print b { color: #1C2A3A; }
  .print .perf { border-top: 3px dashed #B9C6D4; margin: 8px -16px 6px; }

  .chips { position: absolute; left: 90px; top: 0; width: 250px; z-index: 4; }
  .chip { background: #F7FAFC; border: 3px solid #1C2A3A; border-radius: 10px; padding: 14px 18px; margin-bottom: 18px;
    box-shadow: 6px 7px 0 rgba(28,42,58,.14); }
  .chip .no { font: 700 28px "Geist Mono"; letter-spacing: .06em; }
  .chip .lb { font: 600 30px/1.14 "Onest"; margin-top: 3px; }
  .chip .vl { font: 700 40px/1.1 "Onest"; margin-top: 3px; white-space: nowrap; }
  .chip .sw { display: inline-block; width: 26px; height: 26px; border-radius: 50%; border: 3px solid #1C2A3A; margin-right: 10px; vertical-align: -3px; }

  .bench { position: absolute; left: 290px; top: 0; width: 600px; height: 900px; z-index: 2; perspective: 1400px; }
  .plate { position: absolute; left: 0; top: 60px; width: 600px; height: 640px;
    background: linear-gradient(160deg, #F4F8FB, #DCE6EE); border: 3px solid #1C2A3A; border-radius: 36px;
    transform: rotateX(34deg); transform-style: preserve-3d;
    box-shadow: 0 40px 0 -6px #C7D4DF, 0 60px 50px rgba(28,42,58,.25); padding: 34px; }
  .grid { display: grid; grid-template-columns: repeat(12, 1fr); grid-template-rows: repeat(8, 1fr); width: 100%; height: 100%; }
  .well { border-radius: 50%; background: #D5DFE8; box-shadow: inset 0 5px 8px rgba(28,42,58,.35); margin: 5px; }
  .well.f-c { background: radial-gradient(circle at 38% 32%, #F0917F, #E86F5A 70%); box-shadow: inset 0 4px 7px rgba(120,30,20,.45); }
  .well.f-a { background: radial-gradient(circle at 38% 32%, #F6D189, #F2C46D 70%); box-shadow: inset 0 4px 7px rgba(140,95,15,.4); }
  .well.f-p { background: radial-gradient(circle at 38% 32%, #93A3C6, #7C8FB7 70%); box-shadow: inset 0 4px 7px rgba(40,55,95,.45); }
  .rimlab { position: absolute; transform: translateX(-50%); background: #1C2A3A; color: #E8EEF2;
    font: 700 30px "Geist Mono"; padding: 2px 14px; border-radius: 8px; white-space: nowrap; z-index: 3; }
  .plateframe { position: absolute; left: 0; top: 60px; width: 600px; height: 640px; transform: rotateX(34deg); z-index: 3; }

  .pipsvg { position: absolute; z-index: 6; }

  .tape { position: absolute; left: 90px; width: 900px; z-index: 6; background: #F7FAFC;
    border: 3px solid #1C2A3A; border-left: 16px solid #E86F5A; padding: 16px 26px; border-radius: 6px;
    box-shadow: 8px 9px 0 rgba(28,42,58,.16); font: 600 42px/1.3 "Onest"; }
  .tape .w { color: #44546B; }
  .tape .w.on { color: #E8EEF2; background: #1C2A3A; padding: 0 10px; }
</style>
</head>
<body>
<div class="kick" id="kick"></div>
<div class="title" id="title"></div>
<div class="print" id="print"><div id="src"></div><div class="perf"></div><div id="date"></div></div>
<div class="chips" id="chips"></div>
<div class="bench" id="bench"></div>
<div class="tape" id="cap" data-slot="caption"></div>
<script>
  // Fallback sample shaped like data/sample-tokens.json (GPU/parallelism metaphor).
  const D = window.D || { series_id: "ai-in-numbers", series: "AI dalam angka", ep: "#01", kicker: "AI dalam angka · #01",
    title: "3 alasan AI butuh GPU.", hl: "GPU",
    sub: "CPU menuang satu sumbat sekali gerak; GPU mengisi ribuan sekaligus.",
    items: [{ label: "Operasi kecil identik", value: "jutaan" }, { label: "Sumbat per gerakan", value: " ribuan" }, { label: "Waktu per gerakan", value: "milidetik" }],
    source: "ilustrasi — paralelisme GPU", date: "per 14 Okt 2026" };

  Promise.all(['700 80px "Geist Mono"', '500 28px "Geist Mono"', '700 40px Onest', '600 42px Onest'].map(f => document.fonts.load(f))).catch(() => {}).then(render);
  function render() {
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const items = (D.items || []).slice(0, 5), n = items.length;
  const hl = (D.hl || "").trim();
  const FILLS = ["f-c", "f-a", "f-p"];

  $("kick").innerHTML = "<b>" + esc(String(D.ep || "#01")) + "</b> · " + esc(D.series || D.kicker || "");
  $("src").innerHTML = "sumber: <b>" + esc(D.source || "") + "</b>";
  $("date").textContent = D.date || "";

  // title
  const t = String(D.title || "");
  const at = hl ? t.toLowerCase().indexOf(hl.toLowerCase()) : -1;
  const tl = $("title");
  tl.innerHTML = at < 0 ? esc(t)
    : esc(t.slice(0, at)) + '<span class="hl">' + esc(t.slice(at, at + hl.length)) + "</span>" + esc(t.slice(at + hl.length));
  for (let fs = 78; fs >= 64; fs -= 2) { tl.style.fontSize = fs + "px"; if (tl.offsetHeight <= fs * 1.2 * 3 + 6) break; }
  const titleBottom = tl.offsetTop + tl.offsetHeight;

  // column groups: 12 columns split across n items; hl group sits under the pipette
  let hlGroup = -1;
  items.forEach((it, i) => {
    if (hl && (norm(it.label).includes(norm(hl)) || norm(it.value).includes(norm(hl)))) hlGroup = i;
  });
  if (hlGroup < 0) hlGroup = Math.min(1, n - 1);
  const bounds = [];
  { const per = Math.floor(12 / n); let extra = 12 - per * n, c0 = 1;
    for (let i = 0; i < n; i++) { const w = per + (i < extra ? 1 : 0); bounds.push([c0, c0 + w - 1]); c0 += w; } }

  // data chips (left column)
  let ch = "";
  items.forEach((it, i) => {
    ch += '<div class="chip"><div class="no" style="color:' + (i === hlGroup ? "#C05540" : "#44546B") + '">' + (i + 1) + "/" + n + "</div>"
      + '<div class="lb">' + esc(it.label) + '</div><div class="vl" id="vl' + i + '"><span class="sw" style="background:' + swFill(i) + '"></span>' + esc(it.value) + "</div></div>";
  });
  $("chips").innerHTML = ch;
  $("chips").style.top = Math.max(560, titleBottom + 40) + "px";
  items.forEach((it, i) => { const vl = $("vl" + i); let fs = 40; for (; fs >= 32; fs -= 2) { vl.style.fontSize = fs + "px"; if (vl.scrollWidth <= 210) break; } });

  // plate grid + group fills
  const bench = $("bench");
  bench.style.top = Math.max(630, titleBottom + 46) + "px";
  let cells = "";
  for (let r = 0; r < 8; r++) for (let c = 1; c <= 12; c++) {
    const gi = bounds.findIndex(b => c >= b[0] && c <= b[1]);
    cells += '<div class="well' + (gi >= 0 ? " " + FILLS[gi % 3] : "") + '"></div>';
  }
  bench.innerHTML = '<div class="plate"><div class="grid">' + cells + "</div></div>";

  { // rim labels under the plate, analytic positions inside the bench (no 3D measurement drift)
    let labs = "";
    bounds.forEach((bd, i) => {
      const x = 42 + (bd[0] + bd[1]) / 2 / 12 * (600 - 84);
      labs += '<div class="rimlab" style="left:' + x.toFixed(0) + 'px;top:' + (60 + 700) + 'px;' + (i === hlGroup ? "background:#C05540;" : "") + '">' + (i + 1) + "/" + n + "</div>";
    });
    bench.insertAdjacentHTML("beforeend", labs);
  }

  // 8-channel pipette over the hl group
  const [h0, h1] = bounds[hlGroup];
  const hcx = (h0 + h1) / 2 / 12 * 600;
  bench.insertAdjacentHTML("beforeend",
    '<svg class="pipsvg" width="220" height="330" viewBox="0 0 220 330" style="left:' + (hcx - 110) + 'px;top:' + (330) + 'px">' +
    '<g transform="rotate(9 110 60)">' +
    '<rect x="76" y="8" width="68" height="150" rx="14" fill="#1C2A3A"/>' +
    '<rect x="88" y="158" width="44" height="46" fill="#44546B"/>' +
    '<rect x="60" y="196" width="100" height="16" rx="8" fill="#1C2A3A"/>' +
    [0, 1, 2, 3, 4, 5, 6, 7].map(k => '<rect x="' + (66 + k * 11.5) + '" y="212" width="5" height="86" fill="#9FB0C4"/>').join("") +
    [0, 1, 2, 3, 4, 5, 6, 7].map(k => '<path d="M' + (68.5 + k * 11.5) + ' 296 l2.5 22 2.5 -22 Z" fill="#E86F5A"/>').join("") +
    "</g></svg>");

  // caption tape (karaoke)
  capRender();

  function norm(w) { return String(w).toLowerCase().replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu, ""); }
  function swFill(i) { return ["#E86F5A", "#F2C46D", "#7C8FB7"][i % 3]; }

  function capRender() {
    const capEl = $("cap");
    const cap = String(D.caption || D.sub || "").trim();
    const words = cap.split(/\s+/).filter(Boolean);
    const nrm = w => w.toLowerCase().replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu, "");
    const hws = hl ? hl.split(/\s+/).map(nrm).filter(Boolean) : [];
    let a0 = -1, a1 = -1;
    if (hws.length) {
      for (let i = 0; i + hws.length <= words.length && a0 < 0; i++) if (hws.every((h2, k) => nrm(words[i + k]) === h2)) { a0 = i; a1 = i + hws.length - 1; }
      if (a0 < 0 && hws.length === 1) { const j = words.findIndex(w => nrm(w).includes(hws[0])); if (j >= 0) a0 = a1 = j; }
    }
    if (a0 < 0) a0 = a1 = 0;
    const parts = [];
    for (let i = 0; i < words.length; i++) {
      if (i === a0) { parts.push('<span class="w on">' + esc(words.slice(a0, a1 + 1).join(" ")) + "</span>"); i = a1; }
      else parts.push('<span class="w">' + esc(words[i]) + "</span>");
    }
    capEl.innerHTML = parts.join(" ");
    let cfs = 46; for (; cfs >= 40; cfs -= 2) { capEl.style.fontSize = cfs + "px"; if (capEl.offsetHeight <= cfs * 1.34 * 2 + 4) break; }
    capEl.style.top = (1614 - capEl.offsetHeight) + "px";
    return capEl;
  }
  }
</script>
</body>
</html>

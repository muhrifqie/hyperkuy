<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>Lettering Scriber</title>
<link href="https://fonts.googleapis.com/css2?family=B612+Mono:wght@400;700&family=Public+Sans:wght@500;600;800&family=Caveat:wght@600&display=block" rel="stylesheet" />
<!--DATA-->
<style>
  /*
    Lettering Scriber: a draughtsman's lettering set on drafting film.
    Everything the scriber writes (title, fields, the FORMAT RUSAK mark) is drawn with ONE
    single-stroke glyph set (monoline, round ends) - the same glyphs that are engraved as
    grooves in the orange template. The fields are lettered on a tracing overlay hinged under
    the tape, one per template step: faint ghost edges show where the template sat for each
    earlier field. The steel scriber is parked with its tracer pin in the "}" groove and the
    pen nib right after the lettered "}" directly above it.
    Metaphor: structured output / constrained decoding (the pen can only follow the grooves).
    Everything renders from window.D; irregular shapes are hard-coded.
  */
  :root { --film: #EEF1F4; --ink: #1B2330; --orange: #E25A2C; --orange-ink: #B1411A; --steel: #8A96A6; --blue: #2E5BBA; --ink-soft: #46505F; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--film); }
  body { position: relative; color: var(--ink); font-family: "Public Sans", sans-serif; }

  #sheet { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }

  .meta { position: absolute; left: 90px; right: 90px; top: 292px; display: flex; justify-content: space-between; align-items: baseline;
          font: 700 28px "B612 Mono", monospace; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft); }
  .meta b { color: var(--ink); font-weight: 700; }
  .meta .date { font-weight: 400; letter-spacing: 0.02em; text-transform: none; }

  .free { position: absolute; left: 96px; font: 600 50px "Caveat", cursive; line-height: 1.2; color: var(--ink); white-space: nowrap; transform-origin: 0 50%; transform: rotate(-1.2deg); }
  .free span { position: relative; display: inline-block; margin-right: 0.22em; }
  #strike { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; pointer-events: none; }

  .cap { position: absolute; left: 90px; width: 810px; text-wrap: balance; font: 600 46px "Public Sans", sans-serif; line-height: 1.24; color: var(--ink-soft); }
  .cap .w { display: inline; }
  .cap.clamp { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  /* active karaoke word: lettered in template orange, standing on a short blue guideline with an orange start tick */
  .cap .on { position: relative; color: var(--orange-ink); font-weight: 800; }
  .cap .on::after { content: ""; position: absolute; left: -6px; right: -6px; bottom: -1px; height: 4px; border-radius: 2px; background: var(--blue); }
  .cap .on::before { content: ""; position: absolute; left: -6px; bottom: -1px; width: 4px; height: 18px; border-radius: 2px; background: var(--orange-ink); }

  .foot { position: absolute; left: 90px; width: 810px; font: 500 26px "Public Sans", sans-serif; color: var(--ink-soft); line-height: 1.3; text-wrap: pretty; }
  .foot b { font: 700 26px "B612 Mono", monospace; color: var(--ink); letter-spacing: 0.04em; margin-right: 10px; }
</style>
</head>
<body>
<svg id="sheet" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg" role="img" data-layout-allow-overlap data-layout-allow-overflow></svg>
<div class="meta"><span id="kick"></span><span class="date" id="date"></span></div>
<div class="free" id="free" data-layout-allow-overlap></div>
<svg id="strike" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg" data-layout-allow-overlap></svg>
<div class="cap" id="cap" data-slot="caption"></div>
<div class="foot" id="foot"></div>
<script>
  // Fallback sample so the file also opens standalone in a browser.
  const D = window.D || { series: "Cara kerja AI", ep: "#01", kicker: "Cara kerja AI · #01",
    title: "AI nggak baca kata. Dia baca token.", hl: "token",
    sub: "Makanya AI kadang salah hitung huruf di kata \"strawberry\".",
    items: [{ label: "Ken·apa", value: "2 token" }, { label: "AI", value: "1 token" }, { label: "bisa", value: "1 token" }, { label: "ng·arang", value: "2 token" }],
    source: "ilustrasi — jumlah token beda tiap model", date: "per 14 Okt 2026" };

  const FONTS = ['700 28px "B612 Mono"', '400 28px "B612 Mono"', '600 46px "Public Sans"', '800 46px "Public Sans"', '500 26px "Public Sans"', '600 50px Caveat'];
  Promise.all(FONTS.map(f => document.fonts.load(f))).catch(() => {}).then(() => document.fonts.ready).then(render);

  // ---- single-stroke lettering glyphs (cap height 64, baseline y=64; width, centre-line path) ----
  // The same set is engraved in the template and drawn by the pen: the title, the fields and the mark.
  const O_ = "M20,0 C7,0 0,13 0,32 C0,51 7,64 20,64 C33,64 40,51 40,32 C40,13 33,0 20,0 Z";
  const S_ = "M32,10 C29,3 23,0 16,0 C8,0 2,5 2,15 C2,25 10,28 17,31 C26,34 33,38 33,48 C33,58 26,64 16,64 C8,64 3,60 0,53";
  const GL = {
    "A": [40, "M0,64 L20,0 L40,64 M7,42 L33,42"],
    "B": [34, "M0,64 L0,0 L19,0 C28,0 32,6 32,15 C32,24 27,30 19,30 L0,30 M19,30 C29,30 34,37 34,47 C34,57 28,64 19,64 L0,64"],
    "C": [36, "M36,12 C33,4 27,0 19,0 C7,0 0,13 0,32 C0,51 7,64 19,64 C27,64 33,60 36,52"],
    "D": [36, "M0,0 L0,64 L14,64 C29,64 36,52 36,32 C36,12 29,0 14,0 Z"],
    "E": [31, "M31,0 L0,0 L0,64 L31,64 M0,31 L24,31"],
    "F": [30, "M30,0 L0,0 L0,64 M0,31 L23,31"],
    "G": [38, "M37,12 C34,4 28,0 20,0 C7,0 0,13 0,32 C0,51 7,64 20,64 C30,64 38,58 38,46 L38,36 L22,36"],
    "H": [35, "M0,0 L0,64 M35,0 L35,64 M0,31 L35,31"],
    "I": [0, "M0,0 L0,64"],
    "J": [28, "M28,0 L28,47 C28,58 22,64 14,64 C6,64 1,59 0,51"],
    "K": [34, "M0,0 L0,64 M33,0 L0,39 M11,26 L34,64"],
    "L": [29, "M0,0 L0,64 L29,64"],
    "M": [44, "M0,64 L0,0 L22,42 L44,0 L44,64"],
    "N": [36, "M0,64 L0,0 L36,64 L36,0"],
    "O": [40, O_],
    "P": [33, "M0,64 L0,0 L19,0 C28,0 33,7 33,17 C33,27 28,34 19,34 L0,34"],
    "Q": [41, O_ + " M24,46 L41,67"],
    "R": [34, "M0,64 L0,0 L19,0 C28,0 33,7 33,16 C33,26 27,32 18,32 L0,32 M16,32 L34,64"],
    "S": [33, S_],
    "T": [36, "M0,0 L36,0 M18,0 L18,64"],
    "U": [35, "M0,0 L0,44 C0,57 7,64 17.5,64 C28,64 35,57 35,44 L35,0"],
    "V": [40, "M0,0 L20,64 L40,0"],
    "W": [52, "M0,0 L12,64 L26,12 L40,64 L52,0"],
    "X": [36, "M0,0 L36,64 M36,0 L0,64"],
    "Y": [38, "M0,0 L19,34 L38,0 M19,34 L19,64"],
    "Z": [34, "M1,0 L34,0 L0,64 L34,64"],
    "0": [33, "M16.5,0 C5,0 0,13 0,32 C0,51 5,64 16.5,64 C28,64 33,51 33,32 C33,13 28,0 16.5,0 Z"],
    "1": [14, "M0,12 L14,0 L14,64"],
    "2": [33, "M1,13 C3,5 9,0 16,0 C25,0 31,6 31,15 C31,25 24,33 0,64 L33,64"],
    "3": [33, "M2,7 C6,2 11,0 16,0 C25,0 31,6 31,15 C31,24 25,30 14,30 C26,30 33,37 33,47 C33,57 26,64 16,64 C10,64 4,61 0,56"],
    "4": [34, "M25,64 L25,0 L0,44 L34,44"],
    "5": [33, "M31,0 L6,0 L3,28 C7,25 12,24 17,24 C27,24 33,31 33,43 C33,56 26,64 16,64 C10,64 4,61 0,56"],
    "6": [33, "M30,7 C27,2 22,0 17,0 C6,0 0,13 0,34 C0,54 6,64 17,64 C27,64 33,56 33,45 C33,34 27,27 17,27 C9,27 3,31 0,38"],
    "7": [33, "M0,0 L33,0 L11,64"],
    "8": [33, "M16.5,30 C8,30 3,24 3,15 C3,6 9,0 16.5,0 C24,0 30,6 30,15 C30,24 25,30 16.5,30 C7,30 0,37 0,47 C0,57 7,64 16.5,64 C26,64 33,57 33,47 C33,37 26,30 16.5,30 Z"],
    "9": [33, "M3,57 C6,62 11,64 16,64 C27,64 33,51 33,30 C33,10 27,0 16,0 C6,0 0,8 0,19 C0,30 6,37 16,37 C24,37 30,33 33,26"],
    ".": [0, "M0,64 L0,64.1"],
    ",": [4, "M2,60 L2,63 C2,68 1,72 -2,77"],
    ":": [0, "M0,24 L0,24.1 M0,64 L0,64.1"],
    ";": [4, "M2,24 L2,24.1 M2,60 L2,63 C2,68 1,72 -2,77"],
    "!": [0, "M0,0 L0,44 M0,64 L0,64.1"],
    "?": [30, "M0,13 C2,5 8,0 15,0 C24,0 30,6 30,15 C30,24 24,28 18,32 C15,34 15,38 15,45 M15,64 L15,64.1"],
    "\"": [12, "M0,0 L0,16 M12,0 L12,16"],
    "'": [0, "M0,0 L0,16"],
    "-": [22, "M0,36 L22,36"],
    "–": [32, "M0,36 L32,36"],
    "—": [44, "M0,36 L44,36"],
    "+": [32, "M0,36 L32,36 M16,20 L16,52"],
    "=": [32, "M0,27 L32,27 M0,45 L32,45"],
    "±": [32, "M0,28 L32,28 M16,12 L16,44 M0,60 L32,60"],
    "×": [28, "M0,22 L28,50 M28,22 L0,50"],
    "%": [38, "M2,64 L36,0 M8,0 C3,0 0,5 0,12 C0,19 3,24 8,24 C13,24 16,19 16,12 C16,5 13,0 8,0 Z M30,40 C25,40 22,45 22,52 C22,59 25,64 30,64 C35,64 38,59 38,52 C38,45 35,40 30,40 Z"],
    "/": [26, "M0,70 L26,-6"],
    "(": [14, "M14,-4 C4,10 0,22 0,32 C0,42 4,54 14,68"],
    ")": [14, "M0,-4 C10,10 14,22 14,32 C14,42 10,54 0,68"],
    "[": [12, "M12,-4 L0,-4 L0,68 L12,68"],
    "]": [12, "M0,-4 L12,-4 L12,68 L0,68"],
    "{": [18, "M18,-4 C10,-4 8,0 8,10 L8,22 C8,29 5,32 0,32 C5,32 8,35 8,42 L8,54 C8,64 10,68 18,68"],
    "}": [18, "M0,-4 C8,-4 10,0 10,10 L10,22 C10,29 13,32 18,32 C13,32 10,35 10,42 L10,54 C10,64 8,68 0,68"],
    "·": [0, "M0,34 L0,34.1"],
    "&": [36, "M36,64 L9,24 C5,17 5,0 17,0 C27,0 29,12 23,19 L6,39 C0,47 1,64 16,64 C25,64 31,58 34,48"],
    "#": [34, "M12,2 L8,62 M28,2 L24,62 M0,22 L34,22 M0,42 L34,42"],
    "@": [44, "M31,22 L28,44 C27,51 34,52 37,46 C42,36 40,8 22,8 C9,8 0,20 0,36 C0,53 11,64 25,64 C31,64 36,62 40,59 M30,30 C28,25 25,22 21,22 C14,22 10,30 10,37 C10,43 13,46 18,46 C24,46 28,40 29,33"],
    "*": [26, "M13,4 L13,30 M2,10 L24,24 M24,10 L2,24"],
    "<": [28, "M28,16 L0,36 L28,56"],
    ">": [28, "M0,16 L28,36 L0,56"],
    "$": [33, S_ + " M16,-6 L16,70"],
    "_": [32, "M0,72 L32,72"],
    "…": [28, "M0,64 L0,64.1 M14,64 L14,64.1 M28,64 L28,64.1"],
    "→": [38, "M0,36 L38,36 M26,24 L38,36 L26,48"],
    "✗": [38, "M0,-2 L38,66 M38,-2 L0,66"],
    "✓": [36, "M0,36 L12,58 L36,4"],
    "°": [14, "M7,0 C3,0 0,3 0,7 C0,11 3,14 7,14 C11,14 14,11 14,7 C14,3 11,0 7,0 Z"],
    "^": [26, "M0,24 L13,0 L26,24"],
    "~": [32, "M0,38 C6,28 12,28 16,34 C20,40 26,40 32,30"],
    "|": [0, "M0,-6 L0,70"]
  };
  const SPACE_U = 24;
  const CHMAP = { "“": "\"", "”": "\"", "„": "\"", "«": "\"", "»": "\"", "‘": "'", "’": "'", "`": "'", "•": "·", "‧": "·", "∙": "·",
    "−": "-", "‐": "-", "‑": "-", " ": " ", "≈": "~", "✕": "✗", "✘": "✗", "✔": "✓", "→": "→" };
  const normCh = c => [...c.normalize("NFD").replace(/[̀-ͯ]/g, "")].map(x => CHMAP[x] || x).join("").toUpperCase();
  // [{ch, k}] from a string, uppercase, every char tagged with class k
  const chars = (s, k) => [...String(s == null ? "" : s)].flatMap(c => [...normCh(c)].map(ch => ({ ch, k })));
  // move a glyph's centre-line coordinates to the page (strokes stay monoline: widths are set in px)
  const tp = (d, ox, oy, sx, sy) => d.replace(/(-?\d*\.?\d+),(-?\d*\.?\d+)/g, (m, a, b) => (ox + a * sx).toFixed(1) + "," + (oy + b * sy).toFixed(1));
  // lay a run of chars out at cap height C: condensed glyphs (cond), gap in glyph units
  function setRun(cs, C, cond, gapU) {
    const s = C / 64; let x = 0; const g = [];
    for (const c of cs) {
      const e = GL[c.ch];
      if (c.ch === " " || !e) { x += SPACE_U * s; continue; }
      g.push({ ch: c.ch, k: c.k, x, w: e[0] * cond * s }); x += (e[0] * cond + gapU) * s;
    }
    const last = g[g.length - 1];
    return { g, width: last ? last.x + last.w : 0 };
  }
  // run → { k: pathData } at page position (ox = left, oy = cap line)
  function inkRun(run, ox, oy, C, cond) {
    const s = C / 64, out = {};
    for (const q of run.g) out[q.k] = (out[q.k] || "") + tp(GL[q.ch][1], ox + q.x, oy, s * cond, s) + " ";
    return out;
  }

  function render() {
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const $ = id => document.getElementById(id);
  const INK = "#1B2330", FILM = "#EEF1F4", OR = "#E25A2C", ORI = "#B1411A", BLUE = "#2E5BBA", STEEL = "#A9B3C0", STEEL_D = "#8A96A6", STEEL_L = "#DCE1E8";
  const items = (D.items || []).slice(0, 5);
  const n = Math.max(1, items.length);
  const f1 = v => v.toFixed(1);
  const sheet = $("sheet");
  sheet.setAttribute("aria-label", String(D.title || ""));
  const strokeP = (d, col, w, extra) => d ? '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="' + w + '" stroke-linecap="round" stroke-linejoin="round"' + (extra || "") + "/>" : "";

  // ---- meta -----------------------------------------------------------------
  const ep = String(D.ep || "").replace(/^#/, "");
  $("kick").innerHTML = D.series ? esc(D.series) + (ep ? " · <b>No. " + esc(ep) + "</b>" : "") : esc(D.kicker || "");
  $("date").textContent = D.date || "";

  // ---- title: lettered by the scriber, uppercase single-stroke, on blue guidelines ----
  const t = String(D.title || ""), hl = String(D.hl || "");
  const at = hl ? t.toLowerCase().indexOf(hl.toLowerCase()) : -1;
  const tc = [...t].flatMap((c, i) => [...normCh(c)].map(ch => ({ ch, k: (at >= 0 && i >= at && i < at + hl.length) ? "hl" : "ink" })));
  // words; a highlighted phrase is one unbreakable unit
  let words = []; { let cur = []; for (const c of tc) { if (c.ch === " ") { if (cur.length) words.push(cur); cur = []; } else cur.push(c); } if (cur.length) words.push(cur); }
  for (let i = 0; i < words.length - 1; i++) {
    const a = words[i], b = words[i + 1];
    if (a[a.length - 1].k === "hl" && b[0].k === "hl") { words.splice(i, 2, a.concat([{ ch: " ", k: "hl" }], b)); i--; }
  }
  const T_COND = 0.9, T_MAXW = 900;
  const wrapAt = C => {
    const gapU = 12 + Math.max(4.5, C * 0.1) / (C / 64), sp = (SPACE_U + gapU) * C / 64;   // a space also carries the glyph gap before it
    const lines = []; let cur = [], cw = 0;
    for (const w of words) {
      const ww = setRun(w, C, T_COND, gapU).width;
      if (ww > T_MAXW) return null;
      if (cur.length && cw + sp + ww > T_MAXW) { lines.push(cur); cur = []; cw = 0; }
      cw += (cur.length ? sp : 0) + ww; cur.push(w);
    }
    if (cur.length) lines.push(cur);
    return lines;
  };
  const best = {};
  for (let C = 86; C >= 40; C -= 1) { const L = wrapAt(C); if (!L) continue; const k = L.length; if (k <= 3 && !best[k]) best[k] = { C, L }; }
  const CAPL = { 1: 84, 2: 74, 3: 64 };
  // biggest letters win, but each extra line costs 5 px of cap height (keeps the title compact)
  let pick = null, score = -1;
  for (const k of [1, 2, 3]) {
    if (!best[k]) continue;
    const C = Math.min(best[k].C, CAPL[k]), sc = C - 5 * (k - 1);
    if (sc > score) { score = sc; pick = { C, L: wrapAt(C) }; }
  }
  if (!pick) pick = { C: 40, L: wrapAt(40) || [words] };
  const Ct = pick.C, tLines = pick.L, TLP = Math.round(Ct * 1.44), TSW = Math.max(4.5, Ct * 0.1);
  const T0 = 366;                                               // cap line of the first title line
  const titleBase = T0 + (tLines.length - 1) * TLP + Ct;

  // ---- caption (measured first: it pins the bottom of the object) ---------
  const capText = String(D.caption || D.sub || "");
  const capEl = $("cap");
  {
    const ws = capText.split(/\s+/).filter(Boolean);
    let pos = 0; const ranges = ws.map(w => { const s = capText.indexOf(w, pos); pos = s + w.length; return [s, pos]; });
    const hs = hl ? capText.toLowerCase().indexOf(hl.toLowerCase()) : -1;
    let act = hs < 0 ? [0] : ranges.map((r, i) => (r[0] < hs + hl.length && r[1] > hs) ? i : -1).filter(i => i >= 0);
    if (!act.length) act = [0];
    let html = "", i = 0;
    while (i < ws.length) {
      if (act.includes(i)) { const grp = []; while (i < ws.length && act.includes(i)) grp.push(ws[i++]); html += '<span class="w on">' + esc(grp.join(" ")) + "</span> "; }
      else html += '<span class="w">' + esc(ws[i++]) + "</span> ";
    }
    capEl.innerHTML = html.trim();
    let fit = false;
    for (let fs = 46; fs >= 40; fs -= 2) { capEl.style.fontSize = fs + "px"; if (capEl.offsetHeight <= fs * 1.24 * 2 + 4) { fit = true; break; } }
    if (!fit) {
      // a karaoke line shows one 2-line chunk at a time: start the chunk early enough that the active word is in it
      const two = 40 * 1.24 * 2 + 4, a0 = act[0];
      for (let s = 0; s <= a0; s++) {
        let h = s ? "… " : "";
        for (let j = s; j < ws.length; j++) h += act.includes(j) ? (j === a0 ? '<span class="w on">' + esc(act.map(k => ws[k]).join(" ")) + "</span> " : "") : '<span class="w">' + esc(ws[j]) + "</span> ";
        capEl.innerHTML = h.trim();
        const on = capEl.querySelector(".on");
        if (!on || on.offsetTop + on.offsetHeight <= two) break;
      }
      capEl.classList.add("clamp");
    }
  }
  const capH = capEl.offsetHeight;

  // ---- fields: structure from the template (orange), content in ink --------
  // row i: [indent or "{ "] "LABEL": "VALUE",   last row: "}" alone (the active row above the template)
  const rowCs = items.map((it, i) => {
    const last = i === items.length - 1;
    return chars(i === 0 ? "{ " : "", "p").concat(chars("\"", "p"), chars(it.label, "ink"), chars("\":", "p"), chars(" ", "p"), chars("\"", "p"), chars(it.value, "ink"), chars(last ? "\"" : "\",", "p"));
  });
  const R_X0 = 100, R_MAXW = 780;
  let Cr = 46, rCond = 0.86, rGap = 0, indent = 0, runs = [];
  const fitRows = () => {
    rGap = 10 + Math.max(3.4, Cr * 0.115) / (Cr / 64);
    runs = rowCs.map(cs => setRun(cs, Cr, rCond, rGap));
    // rows 2..n are indented to line up under the first quote
    const first = setRun(chars("{ ", "p").concat(chars("\"", "p")), Cr, rCond, rGap);
    indent = first.g[first.g.length - 1].x;
    return Math.max(...runs.map((r, i) => r.width + (i ? indent : 0)));
  };
  while (Cr > 29 && fitRows() > R_MAXW) Cr -= 1;
  while (rCond > 0.7 && fitRows() > R_MAXW) rCond -= 0.02;
  fitRows();
  const R = n + 1;                                              // n fields + the closing "}" row

  // ---- freehand attempt: the same fields written loose, with the format broken ----
  const freeEl = $("free");
  const lo = s => String(s == null ? "" : s).replace(/·/g, "").toLowerCase();
  const parts = [];
  if (items[0]) parts.push("{ " + lo(items[0].label) + lo(items[0].value) + ",");          // no quotes, label runs into value
  if (items[1]) parts.push("\"" + lo(items[1].value) + "\": " + lo(items[1].label) + ",,");                       // value in the key slot

  const fr = freeEl.getBoundingClientRect();
  const x0 = fr.left - 8, x1 = fr.right + 8, ym = fr.top + fr.height * 0.56;
  const wob = [0, -4, 3, -3, 5, -3, 2, -4, 3];
  const seg = 8;
  let d1 = "M" + f1(x0) + " " + f1(ym + 6);
  for (let i = 1; i <= seg; i++) { const x = x0 + (x1 - x0) * i / seg, y = ym + 6 - (10 * i / seg) + wob[i]; d1 += " Q" + f1(x - (x1 - x0) / seg / 2) + " " + f1(y + wob[i - 1]) + " " + f1(x) + " " + f1(y); }
  let st = '<path d="' + d1 + '" fill="none" stroke="' + OR + '" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.9"/>';
  const mark = setRun(chars("✗", "x").concat(chars(" FORMAT RUSAK", "m")), MARK_C, 0.9, 12 + MARK_SW / (MARK_C / 64));
  const mx = Math.max(96, Math.min(990, fr.right) - mark.width), my = freeTop + FREE_H + 8;
  const mp = inkRun(mark, mx, my, MARK_C, 0.9);
  st += strokeP(mp.x, ORI, 5.5) + strokeP(mp.m, ORI, MARK_SW);
  $("strike").innerHTML = st;
  }
</script>

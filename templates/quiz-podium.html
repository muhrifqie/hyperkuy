<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;700&display=block" rel="stylesheet" />
<!--DATA-->
<style>
  /*
    Quiz Podium: a 1950s TV quiz set. Under a hard spotlight sits a flip-card
    scoreboard; each D.items row is one benchmark with its score on flip cards
    and a red "soal bocor?" flag on the highest score (benchmark contamination:
    the perfect score proves memory, not skill). The stagehand's answer card
    leans into frame from the right wing — the hero detail the scoreboard
    can't explain. Deterministic: no randomness, no clock.
    Video: rows flip in one by one (flip-clock), the flag stamps on the top
    score, then the spotlight edge widens to catch the answer card in the wings.
  */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #101318; }
  body { position: relative; color: #E9E3D6; font-family: "Familjen Grotesk", sans-serif; }

  #stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }

  .kick { position: absolute; left: 90px; right: 90px; top: 288px; display: flex; justify-content: space-between;
          font: 500 27px "IBM Plex Mono", monospace; letter-spacing: 0.16em; text-transform: uppercase; color: #D9A441; }
  .kick .dim { color: #8E8A7E; }
  .title { position: absolute; left: 90px; width: 900px; top: 338px;
           font-weight: 700; line-height: 1.1; letter-spacing: -0.01em; color: #E9E3D6; }
  .title .hl { color: #D9A441; box-shadow: inset 0 -0.14em 0 0 #101318, inset 0 -0.18em 0 0 #D9A441; }

  /* scoreboard */
  #board { position: absolute; left: 90px; top: 614px; width: 756px; height: 826px;
           background: #171B22; border: 3px solid #3A4150; border-radius: 14px;
           box-shadow: 0 30px 60px rgba(0,0,0,.55), inset 0 2px 0 rgba(233,227,214,.06);
           padding: 26px 30px 24px; }
  #bhead { display: flex; justify-content: space-between; align-items: baseline;
           border-bottom: 2px solid #3A4150; padding-bottom: 14px; }
  #bhead .t { font: 700 30px "IBM Plex Mono", monospace; letter-spacing: 0.22em; color: #E9E3D6; }
  #bhead .q { font: 500 27px "IBM Plex Mono", monospace; letter-spacing: 0.12em; color: #D9A441; }
  #rows { display: flex; flex-direction: column; height: calc(100% - 96px); margin-top: 8px; }
  .row { flex: 1; display: flex; align-items: center; gap: 22px; border-bottom: 2px solid #262C38; min-height: 0; }
  .row:last-child { border-bottom: 0; }
  .row .no { flex: none; font: 500 30px "IBM Plex Mono", monospace; color: #98A0B0; }
  .row .lb { flex: 1; min-width: 0; font: 600 31px/1.15 "Familjen Grotesk", sans-serif; color: #C9C3B4;
             overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .row .vl { flex: none; display: flex; align-items: center; gap: 18px; }
  .row .score { font: 700 44px/1 "IBM Plex Mono", monospace; letter-spacing: -0.02em; color: #E9E3D6;
                background: #0D1015; border: 2px solid #3A4150; border-radius: 8px; padding: 10px 18px 12px; }
  .row .ask { flex: none; width: 52px; height: 52px; border: 2px solid #3F6DB5; border-radius: 8px;
              display: flex; align-items: center; justify-content: center;
              font: 700 34px "IBM Plex Mono", monospace; color: #6E97D8; }
  .row.leak .score { color: #171B22; background: #C2392E; border-color: #C2392E; }
  .row.leak .flag { flex: none; max-width: 200px; font: 700 28px/1.1 "IBM Plex Mono", monospace;
                    letter-spacing: 0.06em; text-transform: uppercase; color: #E05A50; text-align: right; }
  .row.leak .ask { border-color: #6E7686; color: #98A0B0; }

  /* the stagehand's answer card leaning in from the right wing */
  #card { position: absolute; left: 864px; top: 614px; width: 340px; transform: rotate(-5deg);
          background: #E9E3D6; color: #171B22; border-radius: 10px; padding: 24px 26px 26px;
          box-shadow: -22px 26px 50px rgba(0,0,0,.6); }
  #card .k { font: 500 26px "IBM Plex Mono", monospace; letter-spacing: 0.2em; color: #57503F; }
  #card .a { font: 700 96px/1 "Familjen Grotesk", sans-serif; margin-top: 6px; }
  #card .u { margin-top: 10px; height: 8px; width: 150px; background: #C2392E; }

  #cap { position: absolute; left: 90px; width: 820px; top: 1466px;
         font: 500 44px/1.2 "Familjen Grotesk", sans-serif; color: #E9E3D6; }
  #cap .w.on { font-weight: 700; color: #171B22; background: #D9A441; padding: 0 0.16em; margin: 0 -0.04em; border-radius: 4px; }
  .foot { position: absolute; left: 90px; right: 90px; top: 1586px; display: flex; justify-content: space-between; gap: 40px;
          font: 400 27px "IBM Plex Mono", monospace; color: #8E8A7E; }
  .foot span:last-child { white-space: nowrap; }
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" data-layout-allow-overlap></svg>
<div class="kick"><span id="kickL"></span><span class="dim" id="kickR"></span></div>
<div class="title" id="title"></div>
<div id="board">
  <div id="bhead"><span class="t">PAPAN SKOR</span><span class="q">SOAL BOCOR?</span></div>
  <div id="rows"></div>
</div>
<div id="card" data-layout-allow-overlap><div class="k">KARTU JAWABAN</div><div class="a" id="cardA">B</div><div class="u"></div></div>
<div id="cap" data-slot="caption"></div>
<div class="foot"><span id="src"></span><span id="date"></span></div>
<script>
const D = window.D || {
  series_id: "ai-news",
  series: "Berita AI",
  ep: "#01",
  kicker: "Berita AI · #01",
  title: "Skor 100 sempurna. Atau bocor?",
  hl: "bocor",
  sub: "Kalau soal uji bocor ke data latih, skor tinggi cuma bukti hafalan.",
  items: [
    { label: "Tes hafalan umum", value: "100" },
    { label: "Tes soal baru", value: "64" },
    { label: "Tes nalar segar", value: "58" },
    { label: "Tes gambar", value: "71" }
  ],
  source: "ilustrasi — pola kontaminasi benchmark",
  date: "per 14 Okt 2026",
  caption: "Skor 100 bisa jadi hafalan, bukan kepintaran."
};

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* spotlight cone + floor line, hard-coded geometry */
$("stage").innerHTML =
  '<defs><linearGradient id="sp" x1="0" y1="0" x2="0" y2="1">' +
  '<stop offset="0" stop-color="#E9E3D6" stop-opacity="0.14"/>' +
  '<stop offset="1" stop-color="#E9E3D6" stop-opacity="0"/></linearGradient></defs>' +
  '<polygon points="300,0 780,0 1040,1500 40,1500" fill="url(#sp)"/>' +
  '<ellipse cx="540" cy="1520" rx="470" ry="46" fill="#E9E3D6" opacity="0.05"/>' +
  '<rect x="0" y="1508" width="1080" height="412" fill="#0B0D11"/>';

$("kickL").textContent = (D.kicker || (D.series + " · " + D.ep)).toUpperCase();
$("kickR").textContent = "REKAMAN STUDIO";

/* title with highlighted span, auto-fit 96 -> 64px */
(function () {
  const t = String(D.title || "");
  const hl = D.hl ? String(D.hl) : "";
  let html = esc(t);
  if (hl) {
    const i = t.indexOf(hl) >= 0 ? t.indexOf(hl) : t.toLowerCase().indexOf(hl.toLowerCase());
    if (i >= 0) html = esc(t.slice(0, i)) + '<span class="hl">' + esc(t.slice(i, i + hl.length)) + "</span>" + esc(t.slice(i + hl.length));
  }
  const el = $("title");
  el.innerHTML = html;
  let s = 96;
  el.style.fontSize = s + "px";
  while (el.offsetHeight > 266 && s > 64) { s -= 4; el.style.fontSize = s + "px"; }
})();

/* rows: highest numeric score gets the red leak flag */
(function () {
  const num = v => { const m = String(v).replace(",", ".").match(/-?\d+(\.\d+)?/); return m ? parseFloat(m[0]) : NaN; };
  let best = 0, bi = 0;
  D.items.forEach((it, i) => { const n = num(it.value); if (!isNaN(n) && n > best) { best = n; bi = i; } });
  const letters = "ABCDEF";
  $("cardA").textContent = letters[bi % letters.length];
  $("rows").innerHTML = D.items.map((it, i) =>
    '<div class="row' + (i === bi ? " leak" : "") + '">' +
    '<span class="no">' + String(i + 1).padStart(2, "0") + '</span>' +
    '<span class="lb">' + esc(it.label) + '</span>' +
    '<span class="vl">' +
    (i === bi ? '<span class="flag">soal<br/>bocor?</span>' : "") +
    '<span class="score">' + esc(it.value) + '</span>' +
    '<span class="ask">?</span>' +
    "</span></div>").join("");
})();

/* karaoke caption: active word = D.hl if present, else first word */
(function () {
  const txt = String(D.caption || D.sub || "");
  const norm = w => w.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, "");
  const hl = norm(D.hl || "");
  const words = txt.split(/\s+/).filter(Boolean);
  let ai = 0;
  if (hl) { const i = words.findIndex(w => norm(w) === hl); if (i >= 0) ai = i; }
  $("cap").innerHTML = words.map((w, i) => '<span class="w' + (i === ai ? " on" : "") + '">' + esc(w) + "</span>").join(" ");
})();

$("src").textContent = D.source || "";
$("date").textContent = D.date || "";

if (document.fonts && document.fonts.ready) {
  const title = $("title"), size = title.style.fontSize;
  document.fonts.ready.then(() => { title.style.fontSize = "96px"; let s = 96; while (title.offsetHeight > 266 && s > 64) { s -= 4; title.style.fontSize = s + "px"; } });
}
</script>
</body>
</html>

<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@700;800&family=Barlow+Semi+Condensed:wght@400;500;700&family=Barlow+Condensed:wght@500;700&family=Spline+Sans+Mono:wght@500;600&family=Caveat+Brush&display=block" rel="stylesheet" />
<!--DATA-->
<style>
  /*
    Multiplane Stack: the cover IS what the lens of a multiplane animation camera sees.
    Top half: the camera's ground-glass viewfinder (field-guide crop marks, 12 FLD chart,
    centre cross). Inside it, the composite: the title card painted on the front glass in
    cel lettering, and below it every item label as it lands in the lens, front plate
    (item 0) largest and sharpest, deeper plates smaller and softer.
    Bottom half: the stand itself, seen from the side: camera with two film reels on top,
    a lens, one clear acetate/glass plate per item between two racked columns, and a lit
    light table at the bottom (the only lit object). Each plate carries its own item: a
    cel-paint patch on the glass exactly where it shows up in the lens (inside the dashed
    camera cone), a lettered cel strip on its front edge (label) and a grease-pencil value.
    Metaphor: what the AI reads is many layers seen at once as one picture.
    Deterministic: no randomness, no time.
  */
  :root { --ink: #0B0B0D; --paper: #F3F0E8; --yel: #F5C518; --ver: #F25C3B; --cob: #6F9CFF; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0B0B0D; }
  body { position: relative; color: var(--paper); font-family: "Rubik", sans-serif; }
  #scene { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }

  .vfm { position: absolute; left: 176px; right: 176px; top: 338px; display: flex; justify-content: space-between; gap: 24px;
         font: 500 26px "Spline Sans Mono", monospace; letter-spacing: 0.06em; text-transform: uppercase; color: #ABA79F; line-height: 1.2; white-space: nowrap; }
  .vfm b { color: var(--yel); font-weight: 600; }

  .title { position: absolute; left: 130px; width: 820px; text-align: center; font-family: "Rubik", sans-serif; font-weight: 800;
           letter-spacing: -0.018em; line-height: 1.07; color: var(--paper); text-wrap: balance; }
  .title .sn { display: inline-block; text-wrap: balance; }
  .title .nw { white-space: nowrap; }
  .title .hl { color: var(--yel); }

  .comp { position: absolute; left: 150px; width: 780px; text-align: center; font-family: "Rubik", sans-serif; font-weight: 700; line-height: 1.14; }
  .comp .cl { display: inline-block; white-space: nowrap; margin: 0 0.16em; letter-spacing: -0.01em; }

  .strip { position: absolute; left: 168px; display: flex; align-items: center; gap: 14px; padding: 0 18px 0 0; border-radius: 3px;
           color: var(--ink); font-family: "Rubik", sans-serif; font-weight: 700; line-height: 1; white-space: nowrap; }
  .strip .no { align-self: stretch; display: flex; align-items: center; padding: 0 10px; background: var(--ink); border-radius: 3px 0 0 3px;
               font: 600 30px "Spline Sans Mono", monospace; letter-spacing: 0.02em; }
  .strip.on { box-shadow: 0 0 0 3px var(--paper); }
  .val { position: absolute; font-family: "Caveat Brush", cursive; color: var(--paper); line-height: 1; white-space: nowrap; }

  .caption { position: absolute; left: 90px; width: 810px; top: 1474px; font: 500 44px/1.22 "Barlow Semi Condensed", sans-serif; color: var(--paper); }
  .caption.cn { font-family: "Barlow Condensed", sans-serif; }
  .caption .cue { font: 600 30px "Spline Sans Mono", monospace; color: var(--yel); letter-spacing: 0.02em; margin-right: 0.3em; white-space: nowrap; }
  .caption .w { white-space: nowrap; }
  .caption .on { display: inline-block; line-height: 1.06; padding: 0.02em 0.14em 0.04em; border-radius: 3px; background: var(--yel); color: var(--ink); font-weight: 700;
                 box-shadow: inset 0 3px 0 rgba(255, 255, 255, 0.55); }
  .foot { position: absolute; left: 90px; width: 900px; top: 1592px; display: flex; justify-content: space-between; gap: 36px; align-items: baseline;
          font: 400 27px "Barlow Semi Condensed", sans-serif; color: #A29E96; line-height: 1.2; }
  .foot #date { font: 500 26px "Spline Sans Mono", monospace; white-space: nowrap; }
</style>
</head>
<body>
<svg id="scene" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg" data-layout-allow-overlap></svg>
<div class="vfm"><span id="kick"></span><span id="fld"></span></div>
<div class="title" id="title"></div>
<div class="comp" id="comp"></div>
<div id="strips"></div>
<div class="caption" id="caption" data-slot="caption"></div>
<div class="foot"><span id="src"></span><span id="date"></span></div>
<script>
  // Fallback sample so the file also opens standalone in a browser.
  const D = window.D || { series: "Cara kerja AI", ep: "#01", kicker: "Cara kerja AI · #01",
    title: "AI nggak baca kata. Dia baca token.", hl: "token",
    sub: "Makanya AI kadang salah hitung huruf di kata \"strawberry\".",
    items: [{ label: "Ken·apa", value: "2 token" }, { label: "AI", value: "1 token" }, { label: "bisa", value: "1 token" }, { label: "ng·arang", value: "2 token" }],
    source: "ilustrasi — jumlah token beda tiap model", date: "per 14 Okt 2026" };

  const FONTS = ['800 100px "Rubik"', '700 60px "Rubik"', '500 44px "Barlow Semi Condensed"', '700 44px "Barlow Semi Condensed"', '400 27px "Barlow Semi Condensed"', '500 44px "Barlow Condensed"', '700 44px "Barlow Condensed"', '500 26px "Spline Sans Mono"', '600 30px "Spline Sans Mono"', '400 40px "Caveat Brush"'];
  Promise.all(FONTS.map(f => document.fonts.load(f))).catch(() => {}).then(() => document.fonts.ready).then(render, render);

  function render() {
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const f1 = v => (+v).toFixed(1);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const INK = "#0B0B0D", PAPER = "#F3F0E8", YEL = "#F5C518", VER = "#F25C3B", COB = "#6F9CFF", ROSE = "#F49AC1";
  // opaque cel-paint colours, one per plate (front -> back)
  const CEL = [YEL, VER, COB, ROSE, PAPER];

  const items = (Array.isArray(D.items) ? D.items : []).slice(0, 5);
  const n = Math.max(1, items.length);
  while (items.length < n) items.push({ label: "", value: "" });
  const hl = String(D.hl || "").trim();
  const hlL = hl.toLowerCase();

  // active plate: the one whose label contains hl, else the front plate
  let act = hlL ? items.findIndex(it => String(it.label || "").toLowerCase().includes(hlL)) : -1;
  if (act < 0) act = 0;

  // ---------- viewfinder meta ----------
  $("kick").textContent = D.kicker || [D.series, D.ep].filter(Boolean).join(" · ");
  $("fld").innerHTML = "<b>12</b> FLD";

  // ---------- title card (front glass) ----------
  const t = String(D.title || "").trim();
  const at = hlL ? t.toLowerCase().indexOf(hlL) : -1;
  const titleEl = $("title");
  // highlight with punctuation glued to it, inside one sentence
  const markup = s => {
    const k = hlL ? s.toLowerCase().indexOf(hlL) : -1;
    if (k < 0) return esc(s);
    const pre = s.slice(0, k), post = s.slice(k + hl.length);
    const lead = (pre.match(/\S*$/) || [""])[0], trail = (post.match(/^\S*/) || [""])[0];
    return esc(pre.slice(0, pre.length - lead.length)) + '<span class="nw">' + esc(lead) + '<span class="hl">' + esc(s.slice(k, k + hl.length)) + "</span>" + esc(trail) + "</span>" + esc(post.slice(trail.length));
  };
  // each sentence is its own lettered block, so a line never breaks across a full stop
  const sents = t.split(/(?<=[.!?])\s+(?=\S)/);
  const split = sents.length > 1 && (at < 0 || sents.some(s => s.toLowerCase().includes(hlL)));
  titleEl.innerHTML = split ? sents.map(s => `<span class="sn">${markup(s)}</span>`).join(" ") : markup(t);
  const LH = 1.07;
  const tLines = fs => { titleEl.style.fontSize = fs + "px"; return Math.round(titleEl.offsetHeight / (fs * LH)); };

  // ---------- composite: every plate's label as the lens sees it ----------
  const compEl = $("comp");
  compEl.innerHTML = items.map((it, i) => `<span class="cl" style="color:${CEL[i % CEL.length]}">${esc(it.label)}</span>`).join(" ");
  const spans = [...compEl.children];
  const setComp = base => spans.forEach((s, i) => {
    s.style.fontSize = Math.max(30, Math.round(base * (1 - 0.11 * i))) + "px";
    s.style.filter = i ? `blur(${f1(Math.min(0.6, 0.18 * i))}px)` : "";
  });

  // fit: title as large as possible (2 lines preferred), composite <= 2 lines, viewfinder bottom <= VMAX
  const VT = 300, CT = 398, VMIN = 860, VMAX = 904 - Math.max(0, n - 3) * 18, GAP = 92, PADB = 54;
  let tfs = 116;
  while (tfs > 92 && tLines(tfs) > 2) tfs -= 2;
  if (tLines(tfs) > 2) { tfs = 104; while (tfs > 66 && tLines(tfs) > 3) tfs -= 2; }
  let cb = 66;
  for (let guard = 0; guard < 60; guard++) {
    tLines(tfs); setComp(cb);
    const ch = compEl.offsetHeight, th = titleEl.offsetHeight;
    const twoLines = ch <= Math.ceil(2 * cb * 1.14) + 4;
    if (twoLines && CT + th + GAP + ch + PADB <= VMAX) break;
    if (!twoLines && cb > 40) cb -= 2;
    else if (cb > 52) cb -= 2;
    else if (tfs > 66) tfs -= 2;
    else if (cb > 34) cb -= 2;
    else break;
  }
  const th = titleEl.offsetHeight, ch = compEl.offsetHeight;
  const spare = Math.max(0, VMIN - (CT + th + GAP + ch + PADB));
  const titleTop = Math.round(CT + spare / 2);
  titleEl.style.top = titleTop + "px";
  const crossY = titleTop + th + GAP / 2;
  const compTop = Math.round(titleTop + th + GAP);
  compEl.style.top = compTop + "px";
  const VB = Math.round(Math.max(VMIN, compTop + ch + PADB));
  const compRects = spans.map(s => { const r = s.getBoundingClientRect(); return [r.left, r.right]; });

  // ---------- the stand (side view, light oblique) ----------
  const cx = 490;
  const reelY = VB + 44, reelR = 34;
  const bodyT = VB + 66, bodyB = bodyT + 70, bodyHW = 130;
  const lensB = bodyB + 30, hoodB = lensB + 12;
  const BASE_T = 1404, BASE_F = 1428, BASE_B = 1446;
  const plateTop = hoodB + 24;
  const unit = (BASE_T - 10 - plateTop) / n;
  const faceH = clamp(Math.min(unit * 0.34, unit - 48), 14, 36);
  const stripH = Math.round(clamp(unit - faceH - 8, 40, 60));
  const lbFs = Math.round(clamp(stripH * 0.64, 30, 38));
  const FX0 = 150, FX1 = 830, BX0 = 172, BX1 = 808;       // plate front / back edge x
  const coneHalf = y => 48 + (330 - 48) * (y - hoodB) / (BASE_T + 12 - hoodB);
  const sAt = tt => 0.935 + 0.065 * tt;                  // perspective: back edge narrower than front

  const o = [];
  // light table glow (the only lit object) lights the stand from below
  o.push(`<ellipse cx="${cx}" cy="${BASE_T + 6}" rx="430" ry="92" fill="#FFF3D6" opacity="0.30" filter="url(#bloom)"/>`);
  // columns + rack
  const colTop = VB + 78;
  for (const [x0, x1, inner] of [[108, 132, 132], [848, 872, 848]]) {
    o.push(`<rect x="${x0}" y="${colTop}" width="${x1 - x0}" height="${BASE_B - colTop}" fill="url(#col)"/>`);
    let rack = "";
    for (let y = colTop + 30; y < BASE_T - 6; y += 13) rack += `M${inner === 132 ? x1 - 7 : x0},${y}h7`;
    o.push(`<path d="${rack}" stroke="#5A5A62" stroke-width="2"/>`);
    o.push(`<rect x="${x0 - 4}" y="${colTop - 8}" width="${x1 - x0 + 8}" height="10" rx="2" fill="#3A3A41"/>`);
  }
  // top beam carrying the camera
  o.push(`<rect x="104" y="${VB + 86}" width="772" height="16" rx="3" fill="#222227"/><path d="M104,${VB + 87}H876" stroke="#4E4E56" stroke-width="2"/>`);

  // camera cone (field of view): lens hood -> field on the light table
  const cone = [[cx - 48, hoodB], [cx + 48, hoodB], [cx + 330, BASE_T + 12], [cx - 330, BASE_T + 12]];
  o.push(`<path d="M${cone.map(p => p.join(",")).join("L")}Z" fill="#FFFFFF" opacity="0.035"/>`);

  // light table
  o.push(`<path d="M168,${BASE_T}L812,${BASE_T}L832,${BASE_F}L148,${BASE_F}Z" fill="url(#lit)"/>`);
  o.push(`<path d="M148,${BASE_F}L832,${BASE_F}L832,${BASE_B}L148,${BASE_B}Z" fill="#1D1D21"/><path d="M148,${BASE_F + 1}H832" stroke="#6C6C74" stroke-width="2"/>`);
  { const y0 = BASE_T + 5, y1 = BASE_F - 5, a = coneHalf(BASE_T + 12) * 0.98, b = coneHalf(BASE_T + 12) * 1.02;
    o.push(`<path d="M${cx - a},${y0}L${cx + a},${y0}L${cx + b},${y1}L${cx - b},${y1}Z" fill="none" stroke="#0B0B0D" stroke-opacity="0.38" stroke-width="2" stroke-dasharray="8 6"/>`); }

  // plates, back (bottom) to front (top)
  const plates = [];
  for (let i = n - 1; i >= 0; i--) {
    const yb = plateTop + i * unit, yf = yb + faceH, on = i === act, col = CEL[i % CEL.length];
    plates[i] = { yb, yf };
    // clamps on the columns
    o.push(`<rect x="132" y="${f1(yb - 3)}" width="22" height="${f1(faceH + 9)}" fill="#2C2C32"/><rect x="826" y="${f1(yb - 3)}" width="22" height="${f1(faceH + 9)}" fill="#2C2C32"/>`);
    // glass top face
    o.push(`<path d="M${BX0},${f1(yb)}L${BX1},${f1(yb)}L${FX1},${f1(yf)}L${FX0},${f1(yf)}Z" fill="${on ? col : "url(#glass)"}" fill-opacity="${on ? 0.24 : 1}" stroke="#DCE6FF" stroke-opacity="0.45" stroke-width="1.5"/>`);
    // two glints across the glass
    for (const [g0, g1] of [[0.10, 0.16], [0.19, 0.21]]) { const X = (g, tt) => f1(cx + (BX0 - cx + (FX0 - BX0) * tt) * (1 - 2 * g)); o.push(`<path d="M${X(g0, 0)},${f1(yb)}L${X(g1, 0)},${f1(yb)}L${X(g1 - 0.05, 1)},${f1(yf)}L${X(g0 - 0.05, 1)},${f1(yf)}Z" fill="#FFFFFF" opacity="0.16"/>`); }
    // cel paint on the glass: where this plate's label lands in the lens
    const ym = (yb + yf) / 2, fh = coneHalf(ym);
    const [l, r] = compRects[i] || [530, 550];
    const u0 = clamp((l - 540) / 410, -1, 1), u1 = clamp((r - 540) / 410, -1, 1);
    const P = (u, tt) => [cx + u * fh * sAt(tt) / sAt(1), yb + tt * faceH];
    const pts = [P(u0, 0.16), P(u1, 0.16), P(u1, 0.84), P(u0, 0.84)];
    o.push(`<path d="M${pts.map(p => f1(p[0]) + "," + f1(p[1])).join("L")}Z" fill="${col}" opacity="0.95"/>`);
    // front edge of the glass
    o.push(`<path d="M${FX0},${f1(yf + 2)}H${FX1}" stroke="${on ? col : "#CFE0FF"}" stroke-opacity="${on ? 1 : 0.7}" stroke-width="5"/>`);
    // field ticks where the cone passes the front edge
    const fe = coneHalf(yf);
    o.push(`<path d="M${f1(cx - fe)},${f1(yf - 9)}v12M${f1(cx + fe)},${f1(yf - 9)}v12" stroke="${PAPER}" stroke-width="2.5"/>`);
  }
  // cone edges (drawn over the glass, under the strips)
  o.push(`<path d="M${cx - 48},${hoodB}L${cx - 330},${BASE_T + 12}M${cx + 48},${hoodB}L${cx + 330},${BASE_T + 12}" stroke="${PAPER}" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="9 8"/>`);

  // camera: viewfinder neck, film reels, body, lens
  o.push(`<rect x="${cx - 13}" y="${VB - 4}" width="26" height="${bodyT - VB + 6}" fill="#1A1A1E"/>`);
  o.push(`<rect x="${cx - 60}" y="${reelY - 18}" width="120" height="36" rx="16" fill="#18181C"/>`);
  for (const rx of [cx - 60, cx + 60]) {
    o.push(`<circle cx="${rx}" cy="${reelY}" r="${reelR}" fill="#1E1E23" stroke="#7A7A84" stroke-width="3"/><circle cx="${rx}" cy="${reelY}" r="${reelR - 7}" fill="none" stroke="#34343B" stroke-width="2"/><circle cx="${rx}" cy="${reelY}" r="8" fill="#4C4C54"/>`);
    for (let h = 0; h < 3; h++) { const a = -Math.PI / 2 + h * 2 * Math.PI / 3 + (rx < cx ? 0.3 : 0.9); o.push(`<circle cx="${f1(rx + Math.cos(a) * 19)}" cy="${f1(reelY + Math.sin(a) * 19)}" r="7" fill="#0B0B0D"/>`); }
  }
  o.push(`<rect x="${cx - bodyHW}" y="${bodyT}" width="${bodyHW * 2}" height="${bodyB - bodyT}" rx="8" fill="url(#body)"/>`);
  o.push(`<path d="M${cx - bodyHW + 8},${bodyT + 2}H${cx + bodyHW - 8}" stroke="#7A7A84" stroke-width="2"/>`);
  o.push(`<path d="M${cx - 40},${bodyT + 12}V${bodyB - 10}M${cx + 40},${bodyT + 12}V${bodyB - 10}" stroke="#141417" stroke-width="2"/>`);
  o.push(`<circle cx="${cx - 82}" cy="${bodyT + 33}" r="13" fill="#141417" stroke="#5E5E66" stroke-width="2"/><circle cx="${cx + 80}" cy="${bodyT + 24}" r="7" fill="${VER}"/>`);
  o.push(`<rect x="${cx + 62}" y="${bodyT + 40}" width="36" height="14" rx="2" fill="#141417"/>`);
  o.push(`<rect x="${cx - 34}" y="${bodyB}" width="68" height="${lensB - bodyB}" fill="#1B1B1F"/><path d="M${cx - 34},${bodyB + 10}h68M${cx - 34},${bodyB + 20}h68" stroke="#3E3E46" stroke-width="2"/>`);
  o.push(`<path d="M${cx - 34},${lensB}L${cx + 34},${lensB}L${cx + 48},${hoodB}L${cx - 48},${hoodB}Z" fill="#121215"/><path d="M${cx - 48},${hoodB}H${cx + 48}" stroke="${YEL}" stroke-width="3"/>`);

  // ---------- viewfinder (ground glass) ----------
  const v = [];
  v.push(`<rect x="90" y="${VT}" width="900" height="${VB - VT}" rx="24" fill="#060607" stroke="#2C2C31" stroke-width="3"/>`);
  v.push(`<rect x="104" y="${VT + 14}" width="872" height="${VB - VT - 28}" rx="15" fill="url(#gg)"/>`);
  v.push(`<rect x="104" y="${VT + 14}" width="872" height="${VB - VT - 28}" rx="15" fill="url(#grain)"/>`);
  // field guide: 12 FLD corner marks, 10 FLD dashed corners, edge centre ticks, centre cross
  const corners = (x0, y0, x1, y1, L, attrs) => {
    let d = "";
    for (const [x, y, sx, sy] of [[x0, y0, 1, 1], [x1, y0, -1, 1], [x1, y1, -1, -1], [x0, y1, 1, -1]]) d += `M${x + sx * L},${y}L${x},${y}L${x},${y + sy * L}`;
    return `<path d="${d}" fill="none" ${attrs}/>`;
  };
  v.push(corners(124, VT + 34, 956, VB - 34, 44, `stroke="${PAPER}" stroke-width="3.5"`));
  // field-guide scale along the bottom edge of the glass (12 fields, centre longer)
  { let d = ""; for (let s = -6; s <= 6; s++) { const x = 540 + s * 52, L = s === 0 ? 16 : s % 2 ? 6 : 10; d += `M${x},${VB - 22}v${-L}`; }
    v.push(`<path d="${d}" stroke="${PAPER}" stroke-opacity="0.55" stroke-width="2"/>`); }
  v.push(`<path d="M${540 - 26},${f1(crossY)}h52M540,${f1(crossY - 26)}v52" stroke="${PAPER}" stroke-width="2.5"/><circle cx="540" cy="${f1(crossY)}" r="10" fill="none" stroke="${PAPER}" stroke-width="2"/>`);

  // ---------- assemble ----------
  $("scene").innerHTML = `
    <defs>
      <radialGradient id="pool" cx="${cx}" cy="${BASE_T}" r="720" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#2A2620"/><stop offset="0.5" stop-color="#16151A"/><stop offset="1" stop-color="#0B0B0D"/>
      </radialGradient>
      <radialGradient id="gg" cx="540" cy="${(VT + VB) / 2}" r="560" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#1D1C20"/><stop offset="0.7" stop-color="#121215"/><stop offset="1" stop-color="#08080A"/>
      </radialGradient>
      <pattern id="grain" width="9" height="9" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="3" r="0.9" fill="#FFFFFF" opacity="0.05"/><circle cx="6.5" cy="7" r="0.8" fill="#FFFFFF" opacity="0.04"/>
      </pattern>
      <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#DCE6FF" stop-opacity="0.07"/><stop offset="1" stop-color="#DCE6FF" stop-opacity="0.24"/>
      </linearGradient>
      <linearGradient id="lit" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E2E8F1"/>
      </linearGradient>
      <linearGradient id="col" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#1D1D22"/><stop offset="0.45" stop-color="#3B3B43"/><stop offset="1" stop-color="#1A1A1E"/>
      </linearGradient>
      <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#3A3A42"/><stop offset="1" stop-color="#232328"/>
      </linearGradient>
      <filter id="bloom" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="34"/></filter>
    </defs>
    <rect x="0" y="0" width="1080" height="1920" fill="url(#pool)"/>
    ${o.join("")}
    ${v.join("")}`;

  // ---------- lettered cel strips + grease-pencil values (one per plate) ----------
  const stEl = $("strips");
  stEl.innerHTML = items.map((it, i) => `<div class="strip${i === act ? " on" : ""}" style="background:${CEL[i % CEL.length]};height:${stripH}px;font-size:${lbFs}px"><span class="no" style="color:${CEL[i % CEL.length]}">${String(i + 1).padStart(2, "0")}</span><span class="lb">${esc(it.label)}</span></div><div class="val">${esc(it.value)}</div>`).join("");
  const kids = [...stEl.children];
  items.forEach((it, i) => {
    const s = kids[2 * i], vl = kids[2 * i + 1];
    const top = plates[i].yf + 4;
    s.style.top = Math.round(top) + "px";
    let vfs = Math.round(clamp(stripH * 0.86, 34, 46));
    vl.style.fontSize = vfs + "px";
    const place = () => { const sr = 168 + s.offsetWidth; vl.style.left = (sr + 24) + "px"; vl.style.top = Math.round(top + (stripH - vl.offsetHeight) / 2 + 2) + "px"; return sr + 24 + vl.offsetWidth; };
    let right = place();
    while (right > 820 && vfs > 30) { vfs -= 2; vl.style.fontSize = vfs + "px"; right = place(); }
    let lf = lbFs;
    while (right > 820 && lf > 30) { lf -= 1; s.style.fontSize = lf + "px"; right = place(); }
  });

  // ---------- karaoke caption on the platen edge: camera cue + words ----------
  const cap = String(D.caption || D.sub || "").trim();
  const words = cap.split(/\s+/).filter(Boolean);
  let a0 = -1, a1 = -1;
  if (hlL) {
    const idx = cap.toLowerCase().indexOf(hlL);
    if (idx >= 0) { let pos = 0; words.forEach((w, wi) => { const s = cap.indexOf(w, pos), e = s + w.length; pos = e; if (e > idx && s < idx + hl.length) { if (a0 < 0) a0 = wi; a1 = wi; } }); }
  }
  if (a0 < 0) { a0 = 0; a1 = 0; }
  const parts = [];
  for (let i = 0; i < words.length; i++) {
    if (i === a0) { parts.push(`<span class="w on">${esc(words.slice(a0, a1 + 1).join(" "))}</span>`); i = a1; continue; }
    parts.push(`<span class="w">${esc(words[i])}</span>`);
  }
  const capEl = $("caption");
  capEl.innerHTML = `<span class="cue">PL ${act + 1} ▸</span>` + parts.join(" ");
  // max 2 lines at 40-46 px; a long line switches to the condensed cut before it may wrap to a third line
  const fitCap = () => { for (let fs = 46; fs >= 40; fs -= 2) { capEl.style.fontSize = fs + "px"; if (capEl.offsetHeight <= Math.ceil(fs * 1.22 * 2) + 4) return true; } return false; };
  if (!fitCap()) { capEl.classList.add("cn"); fitCap(); }

  $("src").textContent = D.source ? "Sumber: " + D.source : "";
  $("date").textContent = D.date || "";
  }
</script>
</body>
</html>

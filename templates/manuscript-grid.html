<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Zen+Old+Mincho:wght@700;900&display=block" rel="stylesheet" />
<!--DATA-->
<style>
  /*
    Manuscript Grid (manuscript-grid): a clipped bundle of horizontal genko-yoshi
    (squared manuscript paper) on a kraft desk. One character per square; under
    every square strip runs a blank ruby band. Each item is a paragraph: its first
    square is left for the paragraph number (circled in blue pencil), the label is
    written into the squares, the value is the blue-pencil tally in the margin.
    When labels carry token breaks ("Ken·apa"), the ruby band shows one bracket +
    one (illustrative) token id per chunk: the token count is the number of
    brackets, the squares are just the text. Without token breaks the ruby band
    stays blank, as on real paper. Genko-yoshi conventions drive the skeleton:
    title on top, the name line (series + episode in squares) ends one square
    from the right, the body starts below it. Karaoke caption marks the active
    word with kenten (emphasis dots), the manuscript way of stressing a word.
    Fully deterministic: hashes only, no randomness, no clock.
  */
  :root { --paper: #F6F1E6; --verm: #C23B24; --ink: #222222; --blue: #3A62A8; --desk: #E6D9BE; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--desk); }
  body { position: relative; color: var(--ink); font-family: "DM Mono", monospace; }

  .desk { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  /* a bundle of identical sheets, same size, 0 deg, offset straight down-right */
  .sheet { position: absolute; width: 980px; height: 1452px; background: var(--paper); }
  .sheet.s3 { left: 62px; top: 252px; background: #EFE8DA; box-shadow: 0 22px 44px -16px rgba(60, 40, 15, 0.40), 0 2px 5px rgba(60, 40, 15, 0.16); }
  .sheet.s2 { left: 56px; top: 244px; background: #F2ECDF; box-shadow: 0 1px 3px rgba(60, 40, 15, 0.20); }
  .sheet.front { left: 50px; top: 236px; box-shadow: 0 1px 2px rgba(60, 40, 15, 0.22); }

  #ink, #clip { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }

  .title { position: absolute; left: 92px; width: 896px; top: 322px; font-family: "Zen Old Mincho", serif; font-weight: 900;
    line-height: 1.12; letter-spacing: -0.012em; color: var(--ink); }
  .title .hl.boxed { white-space: nowrap; }
  .title .sq { display: inline-block; font: 500 0.84em "DM Mono", monospace; width: 0.98em; height: 1.16em; line-height: 1.12em;
    text-align: center; border: 0.06em solid var(--verm); margin-right: -0.06em; vertical-align: baseline; color: var(--ink);
    background: #F3DACF; letter-spacing: 0; }
  .title .sq.sp { background: transparent; }
  .title .hl.plain { color: var(--verm); }

  /* name line: series, then the episode number written into squares */
  .by { position: absolute; top: 0; left: 92px; height: 44px; display: flex; align-items: center; gap: 14px; white-space: nowrap;
    font: 500 28px "DM Mono", monospace; line-height: 1; color: var(--ink); }
  .by .ep { display: flex; }
  .by .sq { width: 36px; height: 44px; display: flex; align-items: center; justify-content: center; border: 2px solid var(--verm);
    margin-right: -2px; font: 700 30px "Zen Old Mincho", serif; color: var(--ink); }

  .cell { position: absolute; display: flex; align-items: center; justify-content: center; font-family: "DM Mono", monospace;
    font-weight: 500; line-height: 1; color: var(--ink); }
  .num { position: absolute; display: flex; align-items: center; justify-content: center; font-family: "DM Mono", monospace;
    font-weight: 500; line-height: 1; color: var(--blue); }
  .tid { position: absolute; font: 500 26px "DM Mono", monospace; line-height: 1; color: var(--blue); white-space: nowrap; text-align: center; }
  .val { position: absolute; font-family: "DM Mono", monospace; font-weight: 500; line-height: 1.08; color: var(--blue); letter-spacing: -0.02em; white-space: nowrap; }

  .src { position: absolute; left: 92px; width: 808px; display: flex; gap: 12px; align-items: flex-start;
    font: 400 26px "DM Mono", monospace; line-height: 1.25; color: var(--ink); }
  .src svg { flex: none; margin-top: 3px; }

  /* caption / voice-over: manuscript prose; active word in vermilion with kenten dots above */
  .cap { position: absolute; left: 92px; width: 896px; top: 1500px; font-family: "Zen Old Mincho", serif; font-weight: 700;
    line-height: 1.3; color: var(--ink); }
  .cap .w.on { color: var(--verm); }
  /* kenten: one dot above every letter of the active word; drawn as pseudo-elements so line height never changes */
  .cap .k { position: relative; }
  .cap .k::before { content: ""; position: absolute; left: 50%; top: 0.05em; width: 0.22em; height: 0.22em; margin-left: -0.11em;
    border-radius: 50%; background: var(--verm); }
</style>
</head>
<body>
<svg class="desk" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg" data-layout-allow-overlap aria-hidden="true">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" />
      <feColorMatrix values="0 0 0 0 0.35  0 0 0 0 0.25  0 0 0 0 0.12  0 0 0 0.55 0" />
    </filter>
    <radialGradient id="vig" cx="50%" cy="48%" r="75%">
      <stop offset="60%" stop-color="#000" stop-opacity="0" />
      <stop offset="100%" stop-color="#3a2a12" stop-opacity="0.22" />
    </radialGradient>
  </defs>
  <rect width="1080" height="1920" fill="#E6D9BE" />
  <rect width="1080" height="1920" filter="url(#grain)" opacity="0.32" />
  <rect width="1080" height="1920" fill="url(#vig)" />
</svg>
<div class="sheet s3" data-layout-allow-overlap></div>
<div class="sheet s2" data-layout-allow-overlap></div>
<div class="sheet front" data-layout-allow-overlap></div>
<svg id="ink" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg" data-layout-allow-overlap aria-hidden="true"></svg>
<div class="title" id="title"></div>
<div class="by" id="by"></div>
<div id="cells"></div>
<div class="src" id="src"></div>
<div class="cap" id="cap" data-slot="caption"></div>
<!-- binder clip holding the bundle by its top edge (decoration, above the safe zone) -->
<svg id="clip" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg" data-layout-allow-overlap aria-hidden="true">
  <defs>
    <linearGradient id="jaw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46464C" />
      <stop offset="0.16" stop-color="#232327" />
      <stop offset="1" stop-color="#131315" />
    </linearGradient>
    <linearGradient id="jawSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10" />
      <stop offset="0.12" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="0.88" stop-color="#000000" stop-opacity="0" />
      <stop offset="1" stop-color="#000000" stop-opacity="0.25" />
    </linearGradient>
    <filter id="soft" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="7" /></filter>
  </defs>
  <path d="M440 288H640L664 326H416Z" fill="#2b1d0a" opacity="0.34" filter="url(#soft)" />
  <path d="M478 214L494 146Q496 138 504 138H576Q584 138 586 146L602 214" fill="none" stroke="#6C7077" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M444 212H636L648 296Q648 302 642 302H438Q432 302 432 296Z" fill="url(#jaw)" />
  <path d="M444 212H636L648 296Q648 302 642 302H438Q432 302 432 296Z" fill="url(#jawSide)" />
  <path d="M436 297H644" stroke="#5C5C63" stroke-width="2" stroke-linecap="round" />
  <rect x="438" y="200" width="204" height="24" rx="12" fill="#2C2C31" />
  <path d="M452 206H628" stroke="#77777E" stroke-width="2.4" stroke-linecap="round" />
  <path d="M458 214L472 116Q474 106 484 106H596Q606 106 608 116L622 214" fill="none" stroke="#A6AAB1" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M456 212L470 115Q472 103 484 103H596Q608 103 610 115" fill="none" stroke="#EEF0F3" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
  <circle cx="458" cy="213" r="6.5" fill="#18181B" />
  <circle cx="622" cy="213" r="6.5" fill="#18181B" />
</svg>
<script>
  // Built-in sample so the file also opens on its own in a browser.
  const D = window.D || { series: "Cara kerja AI", ep: "#01", kicker: "Cara kerja AI · #01",
    title: "AI nggak baca kata. Dia baca token.", hl: "token",
    sub: "Makanya AI kadang salah hitung huruf di kata \"strawberry\".",
    items: [{ label: "Ken·apa", value: "2 token" }, { label: "AI", value: "1 token" }, { label: "bisa", value: "1 token" }, { label: "ng·arang", value: "2 token" }],
    source: "ilustrasi — jumlah token beda tiap model", date: "per 14 Okt 2026" };

  // Lay out only after the web fonts are in: square sizes and fitting measure real glyphs.
  Promise.all(['900 100px "Zen Old Mincho"', '700 40px "Zen Old Mincho"', '500 40px "DM Mono"', '400 40px "DM Mono"'].map(f => document.fonts.load(f)))
    .then(() => document.fonts.ready).catch(() => {}).then(render);

  function render() {
    const VERM = "#C23B24", BLUE = "#3A62A8", TINT = ["#F3DACF", "#DCE6F5"];
    const NS = "http://www.w3.org/2000/svg";
    const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const items = (D.items || []).slice(0, 5);
    const ink = document.getElementById("ink"), cellsEl = document.getElementById("cells");
    const svg = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); (parent || ink).appendChild(e); return e; };
    const measure = document.createElement("canvas").getContext("2d");
    const textW = (txt, font) => { measure.font = font; return measure.measureText(txt).width; };

    // ---- name line (genko-yoshi line 2): series, then the episode number written into squares
    const byEl = document.getElementById("by");
    const epNo = String(D.ep || "").replace(/^#/, "").trim();
    const series = D.series || D.kicker || "";
    byEl.innerHTML = '<span class="ser">' + esc(series) + "</span>" +
      (epNo ? '<span class="ep">' + [...epNo].map(c => '<span class="sq">' + esc(c) + "</span>").join("") + "</span>" : "");

    // ---- source + date (reference mark drawn, not typed): measured first, the grid fits above it
    const srcEl = document.getElementById("src");
    const srcDate = String(D.date || "").replace(/ /g, "\u00a0");
    srcEl.innerHTML = '<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5L19 19M19 5L5 19" stroke="' + VERM + '" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="3.2" r="2" fill="' + VERM + '"/><circle cx="12" cy="20.8" r="2" fill="' + VERM + '"/><circle cx="3.2" cy="12" r="2" fill="' + VERM + '"/><circle cx="20.8" cy="12" r="2" fill="' + VERM + '"/></svg><span></span>';
    // source and date share one line when they fit; otherwise the date takes its own line (no dangling separator)
    const srcSpan = srcEl.querySelector("span");
    srcSpan.innerHTML = esc([D.source, srcDate].filter(Boolean).join(" · "));
    if (D.source && srcDate && srcEl.offsetHeight > 40) srcSpan.innerHTML = esc(D.source) + "<br>" + esc(srcDate);
    const srcH = srcEl.offsetHeight;

    // ---- caption / voice-over (karaoke): one active word = hl if it is spoken, else the first word.
    // Max 2 lines from y 1500, bottom <= 1616: 44 -> 40 px, then cut at a word boundary with an ellipsis
    // (never cutting the active word).
    const capEl = document.getElementById("cap");
    const hl = String(D.hl || "");
    const words = String(D.caption || D.sub || "").split(/\s+/).filter(Boolean);
    const norm = w => w.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, "");
    const hw = hl.split(/\s+/).map(norm).filter(Boolean);
    let a0 = 0, a1 = 0;
    if (hw.length) {
      let found = -1;
      for (let i = 0; i + hw.length <= words.length && found < 0; i++) if (hw.every((h, k) => norm(words[i + k]) === h)) found = i;
      if (found < 0 && hw.length === 1) found = words.findIndex(w => norm(w).includes(hw[0]));
      if (found >= 0) { a0 = found; a1 = found + hw.length - 1; }
    }
    const kenten = w => [...w].map(c => /[\p{L}\p{N}]/u.test(c) ? '<span class="k">' + esc(c) + "</span>" : esc(c)).join("");
    const capHTML = (lo, hi) => {
      const parts = [];
      for (let i = lo; i < hi; i++) {
        if (i === a0) { parts.push('<span class="w on">' + kenten(words.slice(a0, a1 + 1).join(" ")) + "</span>"); i = a1; }
        else parts.push('<span class="w">' + esc(words[i]) + "</span>");
      }
      return (lo > 0 ? "… " : "") + parts.join(" ") + (hi < words.length ? "…" : "");
    };
    const CAP_TOP = 1500, CAP_BOTTOM = 1616;
    const capFits = cf => { const lines = Math.round(capEl.offsetHeight / (cf * 1.3)); return lines <= 2 && CAP_TOP + capEl.offsetHeight <= CAP_BOTTOM; };
    let lo = 0, hi = words.length, cf = 44;
    for (; cf >= 40; cf -= 2) { capEl.style.fontSize = cf + "px"; capEl.innerHTML = capHTML(lo, hi); if (capFits(cf)) break; }
    if (cf < 40) {
      cf = 40; capEl.style.fontSize = cf + "px";
      while (hi > a1 + 1) { hi--; capEl.innerHTML = capHTML(lo, hi); if (capFits(cf)) break; }
      while (!capFits(cf) && lo < a0) { lo++; capEl.innerHTML = capHTML(lo, hi); }
    }
    const G1MAX = Math.min(1440, CAP_TOP - 22 - srcH - 14);

    // ---- title: the highlighted part is written into manuscript squares
    const titleEl = document.getElementById("title");
    const t = String(D.title || "");
    const at = hl ? t.toLowerCase().indexOf(hl.toLowerCase()) : -1;
    const titleHTML = boxed => {
      if (at < 0) return esc(t);
      const mid = t.slice(at, at + hl.length);
      const inner = boxed ? [...mid].map(c => c === " " ? '<span class="sq sp">&nbsp;</span>' : '<span class="sq">' + esc(c) + "</span>").join("") : esc(mid);
      return esc(t.slice(0, at)) + '<span class="hl ' + (boxed ? "boxed" : "plain") + '">' + inner + "</span>" + esc(t.slice(at + hl.length));
    };
    // largest size that fits 3 lines; then a slightly smaller size (<= 10 px) is preferred if it saves a line
    const fitTitle = maxFs => {
      let boxed = at >= 0 && hl.length <= 14;
      const set = fs => {
        titleEl.style.fontSize = fs + "px";
        titleEl.innerHTML = titleHTML(boxed);
        const hb = titleEl.querySelector(".hl.boxed");
        if (hb && hb.getBoundingClientRect().width > 890) { boxed = false; titleEl.innerHTML = titleHTML(false); }
        return Math.round(titleEl.offsetHeight / (fs * 1.12));
      };
      let fs = maxFs, n = 0;
      for (; fs > 68; fs -= 2) { n = set(fs); if (n <= 3 && titleEl.offsetHeight <= 340) break; }
      if (fs <= 68) { fs = 68; n = set(fs); }
      for (let f2 = fs - 2; f2 >= Math.max(68, fs - 10); f2 -= 2) if (set(f2) < n) return f2;
      set(fs);
      return fs;
    };

    // ---- value tally (blue pencil, margin column ending at x 900): one shared size; wraps at a space if needed
    const vals = items.map(it => String(it.value == null ? "" : it.value));
    const VMAX = 250;
    let vf = 44, vLines = null, vW = 0;
    for (; vf >= 32; vf -= 2) {
      const font = "500 " + vf + 'px "DM Mono"';
      const lines = vals.map(v => {
        if (textW(v, font) <= VMAX) return [v];
        let best = null;
        for (let i = v.indexOf(" "); i > 0; i = v.indexOf(" ", i + 1)) {
          const a = v.slice(0, i), b = v.slice(i + 1), w = Math.max(textW(a, font), textW(b, font));
          if (!best || w < best.w) best = { w, l: [a, b] };
        }
        return best && best.w <= VMAX ? best.l : null;
      });
      if (lines.every(Boolean)) { vLines = lines; vW = Math.max(120, ...lines.flat().map(s => textW(s, font))); break; }
    }
    if (!vLines) { vf = 32; vLines = vals.map(v => [v]); vW = VMAX; }
    vW = Math.ceil(vW) + 4;

    // ---- grid: paragraph per item (first square = number), label squares, value tally in the margin
    const X0 = 100, BAND = 40, PAD = 16;
    const gridRmax = 900 - vW - 36;
    const chunkMode = items.some(it => /[·|]/.test(String(it.label || "")));
    const parseLabel = label => {
      const parts = String(label == null ? "" : label).split(/[·|]/);
      const cells = [];
      parts.forEach((p, ci) => [...p].forEach(c => cells.push({ c, ci })));
      return cells;
    };
    // first line of a paragraph starts one square in (that square carries the paragraph number)
    const wrap = (cells, cols) => {
      const lines = []; let rest = cells.slice(), cap = cols - 1;
      while (rest.length > cap) {
        let cut = -1;
        for (let i = Math.min(cap, rest.length - 1); i > 0; i--) if (rest[i].c === " ") { cut = i; break; }
        if (cut > 0) { lines.push(rest.slice(0, cut)); rest = rest.slice(cut + 1); cap = cols; continue; }
        let cb = -1;
        for (let i = cap; i > 0; i--) if (rest[i].ci !== rest[i - 1].ci) { cb = i; break; }
        const k = cb > 0 ? cb : cap; lines.push(rest.slice(0, k)); rest = rest.slice(k); cap = cols;
      }
      lines.push(rest); return lines;
    };
    const build = (cols, blank) => {
      const rows = [];
      items.forEach((it, i) => {
        if (blank && i > 0) rows.push(null);
        const ll = wrap(parseLabel(it.label), cols);
        ll.forEach((cells, k) => rows.push({ item: i, cells, first: k === 0, last: k === ll.length - 1, off: k === 0 ? 1 : 0 }));
      });
      return rows;
    };
    const layoutGrid = G0 => {
      const GH = G1MAX - G0;
      const cands = [];
      for (let cols = 8; cols <= 16; cols++) {
        const opts = [false, true].map(blank => {
          const rows = build(cols, blank), R = rows.length;
          const s = Math.min(Math.floor((gridRmax - X0) / cols), Math.floor((GH - PAD - 4 - R * BAND) / R), 74);
          return { cols, rows, s, blank };
        });
        const pick = opts[1].s >= opts[0].s * 0.88 ? opts[1] : opts[0];
        // fewer wrapped lines reads better; more than 2 lines per label reads worst
        const lines = items.map((_, i) => pick.rows.filter(r => r && r.item === i).length);
        pick.score = pick.s - 5 * lines.reduce((a, n) => a + n - 1, 0) - 12 * lines.reduce((a, n) => a + Math.max(0, n - 2), 0);
        cands.push(pick);
      }
      const legible = cands.filter(c => c.s >= 49);
      const pool = legible.length ? legible : cands;
      const best = pool.reduce((a, b) => (b.score > a.score ? b : a));
      best.G0 = G0; best.GH = GH;
      return best;
    };
    let fsT = 104, G;
    for (;;) {
      const fs = fitTitle(fsT);
      G = layoutGrid(Math.max(530, 322 + titleEl.offsetHeight + 12 + 44 + 34));
      if (G.s >= 54 || fs <= 72) break;
      fsT = fs - 4;
    }
    const { rows, s, cols, G0, GH } = G;
    const pitch = s + BAND;
    const RT = Math.max(rows.length, Math.floor((GH - PAD - 4) / pitch));
    const pad = PAD + Math.max(0, Math.floor((GH - (PAD + 4 + RT * pitch)) / 2));
    const G1 = G0 + pad + RT * pitch + 4;
    const gridR = X0 + cols * s;
    const rowTop = r => G0 + pad + r * pitch;

    // name line sits under the title and ends one square short of the grid's right edge
    const byTop = 322 + titleEl.offsetHeight + 12;
    byEl.style.top = byTop + "px";
    byEl.style.left = Math.max(92, Math.round(gridR - s - byEl.offsetWidth)) + "px";

    // frame (double rule) + square strips (vermilion), ruler ticks every 5 squares
    svg("rect", { x: X0 - 12, y: G0, width: gridR - X0 + 24, height: G1 - G0, fill: "none", stroke: VERM, "stroke-width": 3.2 });
    svg("rect", { x: X0 - 6, y: G0 + 6, width: gridR - X0 + 12, height: G1 - G0 - 12, fill: "none", stroke: VERM, "stroke-width": 1, opacity: 0.8 });
    const gTint = svg("g", {}), gLines = svg("g", { stroke: VERM, fill: "none" });
    for (let r = 0; r < RT; r++) {
      const y = rowTop(r);
      svg("rect", { x: X0, y, width: cols * s, height: s, "stroke-width": 2.2 }, gLines);
      let d = "";
      for (let c = 1; c < cols; c++) d += "M" + (X0 + c * s) + " " + y + "V" + (y + s);
      svg("path", { d, "stroke-width": 1.2, opacity: 0.85 }, gLines);
    }
    for (let c = 5; c < cols; c += 5) {
      const x = X0 + c * s;
      svg("path", { d: "M" + (x - 6) + " " + (G0 - 14) + "L" + x + " " + (G0 - 5) + "L" + (x + 6) + " " + (G0 - 14) + "Z", fill: VERM, stroke: "none" });
    }

    // ---- writing: one character per square; with token breaks, one bracket + id per chunk in the ruby band
    let html = "";
    const fsz = Math.round(s * 0.62);
    const gBr = svg("g", { stroke: VERM, fill: "none", "stroke-width": 2.6, "stroke-linecap": "round", "stroke-linejoin": "round" });
    const gNum = svg("g", { stroke: BLUE, fill: "none", "stroke-width": 2.6 });
    const idOf = (str, digits) => {
      let h = 2166136261;
      for (const ch of str.toLowerCase()) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619) >>> 0; }
      const lo = Math.pow(10, digits - 1);
      return String(lo + (h % (9 * lo)));
    };
    const TW = 26 * 0.6; // DM Mono advance at 26px
    rows.forEach((row, r) => {
      if (!row) return;
      const y = rowTop(r), off = row.off;
      if (row.first) {
        // paragraph number circled in blue pencil in the indent square
        svg("circle", { cx: X0 + s / 2, cy: y + s / 2, r: Math.round(s * 0.36) }, gNum);
        html += '<div class="num" style="left:' + X0 + "px;top:" + y + "px;width:" + s + "px;height:" + s + "px;font-size:" + Math.max(30, Math.round(s * 0.48)) + 'px">' + (row.item + 1) + "</div>";
      }
      if (chunkMode) {
        const groups = [];
        row.cells.forEach((cell, c) => {
          const g = groups[groups.length - 1];
          if (g && g.ci === cell.ci) { g.end = c + 1; g.text += cell.c; } else groups.push({ ci: cell.ci, start: c, end: c + 1, text: cell.c });
        });
        groups.forEach(g => {
          const x1 = X0 + (off + g.start) * s, w = (g.end - g.start) * s;
          svg("rect", { x: x1 + 2, y: y + 2, width: w - 4, height: s - 4, fill: TINT[g.ci % 2] }, gTint);
          const yb = y + s + 4;
          svg("path", { d: "M" + (x1 + 6) + " " + yb + "V" + (yb + 6) + "H" + (x1 + w - 6) + "V" + yb }, gBr);
          const digits = Math.max(2, Math.min(5, Math.floor((w - 6) / TW)));
          html += '<div class="tid" style="left:' + x1 + "px;width:" + w + "px;top:" + (yb + 9) + 'px">' + idOf(g.text.trim() || g.text, digits) + "</div>";
        });
      }
      row.cells.forEach((cell, c) => {
        if (cell.c === " ") return;
        html += '<div class="cell" style="left:' + (X0 + (off + c) * s) + "px;top:" + y + "px;width:" + s + "px;height:" + s + "px;font-size:" + fsz + 'px">' + esc(cell.c) + "</div>";
      });
    });

    // value tally in the margin column, aligned to each paragraph's first row, dotted leader from the frame
    const VX = gridR + 12 + 24;
    rows.forEach((row, r) => {
      if (!row || !row.first) return;
      const y = rowTop(r);
      const ls = vLines[row.item];
      const h = Math.round(vf * 1.08 * ls.length);
      html += '<div class="val" style="left:' + VX + "px;width:" + (900 - VX) + "px;top:" + Math.round(y + (s - h) / 2) + "px;font-size:" + vf + 'px">' + ls.map(esc).join("<br>") + "</div>";
      svg("path", { d: "M" + (gridR + 14) + " " + (y + s / 2) + "H" + (VX - 8), stroke: VERM, "stroke-width": 2, "stroke-dasharray": "2 5", "stroke-linecap": "round" });
    });
    cellsEl.innerHTML = html;

    srcEl.style.top = (G1 + 14) + "px";
  }
</script>
</body>
</html>

<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&display=block" rel="stylesheet" />
<!--DATA-->
<style>
  /*
    Winnowing Tray (winnowing-tray): a round woven bamboo tampah on a dark floor, caught
    mid-toss, lying half over a flattened woven-plastic rice sack (karung beras).
    Metaphor: training-data curation -- the tray separates one mixture into fractions;
    most of it is swept to the rim, only one small clean heap is kept.
    - the type is the sack's own 2-colour flexo print: kicker = the red top band,
      title = big blue sack lettering with hl in red (blue plate misregistered),
      source = the sack's small print, date = a paper label sewn into the hem.
    - kept item: the clean rice heap in the centre, in the only pool of light, with a
      wooden centong pushed into it; its torn brown-paper slip is stamped in red.
    - the other items: piles of husk / grit / paddy / broken rice swept to the rim, each
      sitting on a torn scrap of brown paper stamped in blue.
    Deterministic: a seeded PRNG builds every grain and torn edge; no Math.random / Date.now.
  */
  :root { --floor: #1D1A17; --sack: #E6E0CF; --blue: #1C3F86; --red: #B5322A; --stamp: #8E2217; --bamboo: #C8A36A; --rice: #F4EFE4; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--floor); }
  body { position: relative; color: var(--rice); font-family: "Barlow Condensed", sans-serif; }
  .layer { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; pointer-events: none; }

  /* sack print (flexo ink on woven plastic) */
  .ink { filter: url(#inkEdge); }
  .kick { position: absolute; left: 98px; top: 300px; font: 700 29px/1 "Barlow Condensed", sans-serif; letter-spacing: 0.14em;
    text-transform: uppercase; color: #F3EEE2; white-space: nowrap; }
  .title { position: absolute; left: 96px; width: 886px; top: 358px; font-family: "Anton", sans-serif; font-weight: 400;
    text-transform: uppercase; line-height: 1.0; letter-spacing: 0.006em; color: var(--blue); }
  .title .hl { color: var(--red); white-space: nowrap; text-shadow: -3px 3px 0 var(--blue); }
  .small { position: absolute; left: 94px; width: 740px; font: 500 26px/1.2 "Barlow Condensed", sans-serif; letter-spacing: 0.02em;
    color: var(--blue); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tag { position: absolute; font: 600 27px/1 "Barlow Condensed", sans-serif; letter-spacing: 0.03em; color: var(--blue);
    white-space: nowrap; text-align: center; }

  /* torn brown-paper slips, rubber-stamped */
  .slip { position: absolute; color: var(--blue); }
  .slip .v { font: 400 46px/1 "Anton", sans-serif; letter-spacing: 0.01em; white-space: nowrap; }
  .slip .l { font: 600 30px/1.04 "Barlow Condensed", sans-serif; margin-top: 5px; }
  .slip.keep { color: var(--stamp); display: flex; flex-wrap: wrap; align-items: center; column-gap: 16px; row-gap: 4px; }
  .slip.keep .v { font-size: 80px; }
  .slip.keep .l { font-size: 34px; font-weight: 700; margin-top: 0; max-width: 210px; }

  .cap { position: absolute; left: 90px; width: 810px; font: 600 46px/1.26 "Barlow Condensed", sans-serif; letter-spacing: 0.005em; color: var(--rice); }
  .cap .w { white-space: nowrap; }
  .cap .w.on { white-space: normal; }
  .cap .on { background: var(--red); color: #F7F2E8; border-radius: 3px; padding: 0 0.2em; font-weight: 700;
    -webkit-box-decoration-break: clone; box-decoration-break: clone; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <!-- flexo ink edge: a hair of displacement so the print sits on the woven tapes -->
  <filter id="inkEdge" x="-2%" y="-6%" width="104%" height="112%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="4" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<svg id="scene" class="layer" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" data-layout-allow-overlap></svg>
<div class="kick ink" id="kick"></div>
<div class="title ink" id="title"></div>
<div class="small ink" id="src"></div>
<div class="tag" id="date"></div>
<svg id="inkTex" class="layer" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" data-layout-allow-overlap></svg>
<div id="slips"></div>
<div class="cap" id="cap" data-slot="caption"></div>
<script>
  // Built-in sample so the file also opens on its own in a browser.
  const D = window.D || { series: "AI dalam angka", ep: "#01", kicker: "AI dalam angka · #01",
    title: "Dari 100 data internet, cuma 6 yang dipakai", hl: "cuma 6",
    sub: "Sisanya dibuang: duplikat, spam, dan teks sampah.",
    items: [{ label: "duplikat", value: "41%" }, { label: "spam & iklan", value: "28%" }, { label: "teks sampah", value: "17%" }, { label: "bahasa rusak", value: "8%" }, { label: "dipakai", value: "6%" }],
    source: "ilustrasi — angka beda tiap dataset", date: "per 14 Okt 2026" };

  Promise.all(['400 100px "Anton"', '700 29px "Barlow Condensed"', '600 30px "Barlow Condensed"', '500 26px "Barlow Condensed"', '700 46px "Barlow Condensed"']
    .map(f => document.fonts.load(f))).catch(() => {}).then(() => document.fonts.ready).then(render);

  function render() {
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const f1 = v => (Math.round(v * 10) / 10).toString();

  // Seeded PRNG (mulberry32): same seed -> same tray every render.
  function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  // rotate an absolutely placed element around page points, same as an SVG rotate(a px py) chain
  const rotCSS = (el, list) => {
    const L = el.offsetLeft, T = el.offsetTop;
    el.style.transformOrigin = "0 0";
    el.style.transform = list.map(([a, px, py]) => `translate(${f1(px - L)}px,${f1(py - T)}px) rotate(${a}deg) translate(${f1(L - px)}px,${f1(T - py)}px)`).join(" ");
  };
  const SA = -1.2, PVX = 540, PVY = 600;                 // the sack lies slightly askew
  const SACK = [[SA, PVX, PVY]];

  const items = (D.items || []).filter(Boolean).slice(0, 5);
  const hl = String(D.hl || "").trim();

  // ---------- sack print: top band (kicker), title, small print (source), sewn label (date) ----------
  const epNo = String(D.ep || "").trim(), ser = String(D.series || "").trim();
  const kickEl = $("kick");
  kickEl.textContent = ser ? ser + (epNo ? "  ·  " + epNo : "") : String(D.kicker || "");
  for (let fs = 29; fs >= 26 && kickEl.offsetWidth > 610; fs--) kickEl.style.fontSize = fs + "px";
  rotCSS(kickEl, SACK);

  const t = String(D.title || "");
  const at = hl ? t.toLowerCase().indexOf(hl.toLowerCase()) : -1;
  const titleEl = $("title");
  titleEl.innerHTML = at < 0 ? esc(t) : esc(t.slice(0, at)) + '<span class="hl">' + esc(t.slice(at, at + hl.length)) + "</span>" + esc(t.slice(at + hl.length));
  for (let fs = 140; fs >= 72; fs -= 2) { titleEl.style.fontSize = fs + "px"; if (titleEl.offsetHeight <= 246 && titleEl.scrollWidth <= 886) break; }
  const titleH = titleEl.offsetHeight;
  const srcEl = $("src");
  srcEl.textContent = D.source ? "Sumber: " + D.source : "";
  const srcH1 = srcEl.textContent ? srcEl.offsetHeight : 0;
  const titleTop = Math.round(Math.max(358, 350 + (322 - (titleH + 22 + srcH1)) / 2));   // centre title + small print in the print area
  const titleBottom = titleTop + titleH;
  titleEl.style.top = titleTop + "px";
  rotCSS(titleEl, SACK);
  srcEl.style.top = (titleBottom + 22) + "px";
  if (srcEl.scrollWidth > 740 && titleBottom + 22 + 64 <= 670) {            // room for a 2-line small print
    srcEl.style.whiteSpace = "normal"; srcEl.style.display = "-webkit-box"; srcEl.style.webkitBoxOrient = "vertical"; srcEl.style.webkitLineClamp = "2";
  }
  const srcH = srcEl.textContent ? srcEl.offsetHeight : 0;
  rotCSS(srcEl, SACK);

  // sewn-in hem label (paper), holds the date
  const LB = { x: 752, y: 236, w: 226, h: 114, a: 2.4 };
  const LBC = [LB.x + LB.w / 2, LB.y + LB.h / 2];
  const dateEl = $("date");
  dateEl.textContent = D.date || "";
  dateEl.style.width = (LB.w - 24) + "px";
  for (let fs = 27; fs >= 26 && dateEl.scrollWidth > LB.w - 24; fs--) dateEl.style.fontSize = fs + "px";
  dateEl.style.left = (LB.x + 12) + "px"; dateEl.style.top = (LB.y + 72) + "px";
  rotCSS(dateEl, [[SA, PVX, PVY], [LB.a, LBC[0], LBC[1]]]);

  // ---------- geometry ----------
  const CX = 540, CY = 1062, R = 460, K = 0.8;            // tray: circle R squashed by K (seen slightly from the front)
  const IA = 424, IB = IA * K;                              // interior (inside the rim)
  const LIP = 24;                                           // visible thickness of the rim
  const rimTop = x => CY - R * K * Math.sqrt(Math.max(0, 1 - ((x - CX) / R) ** 2));

  // ---------- which item is KEPT (the clean centre heap) ----------
  const words = s => String(s || "").toLowerCase().replace(/·/g, "").split(/[^\p{L}\p{N}]+/u).filter(Boolean);
  const nums = s => (String(s || "").replace(/(\d)\.(?=\d{3}(\D|$))/g, "$1").match(/\d+(?:,\d+)?/g) || []).map(x => parseFloat(x.replace(",", ".")));
  let kI = items.findIndex(it => it.keep === true);
  if (kI < 0 && hl) {
    const hw = words(hl), hn = nums(hl);
    kI = items.findIndex(it => { const lw = words(it.label); return lw.length > 0 && (lw.every(w => hw.includes(w)) || hw.every(w => lw.includes(w))); });
    if (kI < 0 && hn.length) kI = items.findIndex(it => nums(it.value).some(v => hn.includes(v)));
  }
  if (kI < 0) kI = items.length - 1;
  const rim = items.map((it, i) => ({ it, i })).filter(o => o.i !== kI);
  const m = rim.length;

  // ---------- layout: row 1 (back) -> kept heap + slip (centre) -> row 2 (front) ----------
  const TL = { cx: 300, top: 846, w: 262 }, TR = { cx: 766, top: 846, w: 238 };
  const BL = { cx: 338, w: 272 }, BR = { cx: 736, w: 252 };
  const LAY = {
    0: { r1: [], r2: [], heap: [540, 172, 112], keptMin: 1010 },
    1: { r1: [], r2: [BL], heap: [540, 170, 110], keptMin: 1000 },
    2: { r1: [], r2: [BL, BR], heap: [540, 168, 108], keptMin: 1000 },
    3: { r1: [TL], r2: [BL, BR], heap: [568, 120, 84], keptMin: 960 },
    4: { r1: [TL, TR], r2: [BL, BR], heap: [540, 102, 74], keptMin: 960 }
  }[Math.min(4, m)];

  const PADX = 22, PT_R = 40, PT_K = 32, PB = 16;
  const slipsEl = $("slips");
  const mkSlip = (it, keep) => {
    const el = document.createElement("div");
    el.className = "slip" + (keep ? " keep" : "");
    el.innerHTML = `<div class="v">${esc(it.value)}</div><div class="l">${esc(it.label)}</div>`;
    slipsEl.appendChild(el);
    return el;
  };
  const fitSlip = (el, maxText, big, small) => {
    const v = el.querySelector(".v");
    el.style.maxWidth = maxText + "px";
    for (let fs = big; fs >= small; fs -= 2) { v.style.fontSize = fs + "px"; if (v.scrollWidth <= maxText) break; }
    // shrink-wrap to the widest real line (Range rect = union of line boxes), then lock it so nothing re-wraps later
    const lab = el.querySelector(".l");
    const tw = node => { const r = document.createRange(); r.selectNodeContents(node); return r.getBoundingClientRect().width; };
    const sameRow = lab.offsetTop < v.offsetTop + v.offsetHeight - 4;      // keep slip: label beside the value, not wrapped under it
    const natural = el.classList.contains("keep") && sameRow ? el.getBoundingClientRect().width : Math.max(tw(v), tw(lab));
    const w = Math.min(maxText, Math.ceil(natural) + 2);
    el.style.width = w + "px";
    return { w, h: el.offsetHeight };
  };

  const papers = [];   // {x, y, w, h, cx, kind, el, tilt, item}
  const TILTS = [-1.8, 1.4, 1.9, -1.3];
  const place = (slot, o, k, top) => {
    const el = mkSlip(o.it, false);
    const s = fitSlip(el, slot.w - 2 * PADX, 46, 38);
    const w = s.w + 2 * PADX, h = PT_R + s.h + PB;
    let x = slot.cx - w / 2;
    if (top + h > 900) x = Math.min(x, 902 - w);           // text stays clear of the action buttons
    x = Math.max(112, x);
    const p = { x, y: top, w, h, cx: x + w / 2, kind: "rim", el, tilt: TILTS[k % 4], tw: s.w, th: s.h, style: k };
    papers.push(p); return p;
  };
  const hOver = (a, b, g) => a.x < b.x + b.w + g && b.x < a.x + a.w + g;

  let r = 0;
  const row1 = LAY.r1.map(slot => place(slot, rim[r], r++, slot.top));

  // kept slip (red stamp) in front of the clean heap
  const [HX, HRX, HRY] = LAY.heap;
  const kept = items[kI] ? (() => {
    const el = mkSlip(items[kI], true);
    const s = fitSlip(el, 400 - 2 * PADX, 80, 50);
    const w = s.w + 2 * PADX, h = PT_K + s.h + PB;
    const x = HX - w / 2;
    let top = LAY.keptMin;
    row1.forEach(p => { if (hOver(p, { x, w }, 14)) top = Math.max(top, p.y + p.h + 14); });
    const p = { x, y: top, w, h, cx: HX, kind: "keep", el, tilt: 0.8, tw: s.w, th: s.h };
    papers.push(p); return p;
  })() : null;
  const keptBottom = kept ? kept.y + kept.h : LAY.keptMin;
  const HY = (kept ? kept.y : LAY.keptMin) + 22 - HRY;     // heap rides on the slip's top edge

  // row 2 (front): below the kept slip, pile peeking above each paper
  const row2 = LAY.r2.map(slot => {
    let top = keptBottom + 14 + 44;
    row1.forEach(p => { if (Math.abs(p.cx - slot.cx) < 300) top = Math.max(top, p.y + p.h + 14 + 44); });
    return place(slot, rim[r], r++, top);
  });

  // place the slip text (HTML) over its paper, same tilt
  papers.forEach(p => {
    p.el.style.left = f1(p.x + PADX) + "px";
    p.el.style.top = f1(p.y + (p.kind === "keep" ? PT_K : PT_R)) + "px";
    rotCSS(p.el, [[p.tilt, p.x + p.w / 2, p.y + p.h / 2]]);
  });

  // ---------- svg ----------
  const svg = [];
  const P = s => svg.push(s);

  // Twill weave tile (2 over / 2 under), strips w px wide; each float darkens where it dives under.
  const w = 17, T4 = w * 4;
  let tile = `<rect width="${T4}" height="${T4}" fill="#4A3720"/>`;
  for (let rr = 0; rr < 4; rr++) for (let c = 0; c < 4; c++) {
    const horiz = ((c - rr + 8) % 4) < 2;
    const first = horiz ? ((c - rr + 8) % 4) === 0 : ((rr - c + 8) % 4) === 2;
    const x = c * w, y = rr * w;
    const g = horiz ? (first ? "gHa" : "gHb") : (first ? "gVa" : "gVb");
    tile += `<rect x="${x + (horiz ? 0 : 1.2)}" y="${y + (horiz ? 1.2 : 0)}" width="${horiz ? w : w - 2.4}" height="${horiz ? w - 2.4 : w}" fill="url(#${g})"/>`;
    if (horiz) tile += `<path d="M${x} ${y + 6.2}h${w}M${x} ${y + 11.4}h${w}" stroke="#9C7840" stroke-width="0.9" opacity="0.55"/>`;
    else tile += `<path d="M${x + 6.2} ${y}v${w}M${x + 11.4} ${y}v${w}" stroke="#94713B" stroke-width="0.9" opacity="0.55"/>`;
  }
  // Woven polypropylene (karung): flat 6 px tapes, plain weave.
  const pp = `<rect width="12" height="12" fill="#D3CCB8"/>
    <rect x="0" y="0.6" width="6" height="4.8" fill="url(#ppH)"/><rect x="6.6" y="0" width="4.8" height="6" fill="url(#ppV)"/>
    <rect x="0.6" y="6" width="4.8" height="6" fill="url(#ppV)"/><rect x="6" y="6.6" width="6" height="4.8" fill="url(#ppH)"/>`;
  P(`<defs>
    <linearGradient id="gHa" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#9E7B45"/><stop offset="0.7" stop-color="#D2AE73"/><stop offset="1" stop-color="#D8B57A"/></linearGradient>
    <linearGradient id="gHb" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#D8B57A"/><stop offset="0.3" stop-color="#D2AE73"/><stop offset="1" stop-color="#9E7B45"/></linearGradient>
    <linearGradient id="gVa" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#8F6E3D"/><stop offset="0.7" stop-color="#BE9A61"/><stop offset="1" stop-color="#C5A167"/></linearGradient>
    <linearGradient id="gVb" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#C5A167"/><stop offset="0.3" stop-color="#BE9A61"/><stop offset="1" stop-color="#8F6E3D"/></linearGradient>
    <pattern id="weave" width="${T4}" height="${T4}" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">${tile}</pattern>
    <linearGradient id="ppH" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#E3DDCB"/><stop offset="0.45" stop-color="#F0EBDF"/><stop offset="1" stop-color="#DCD5C2"/></linearGradient>
    <linearGradient id="ppV" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#D9D2BF"/><stop offset="0.5" stop-color="#E6E0D0"/><stop offset="1" stop-color="#D5CEBA"/></linearGradient>
    <pattern id="pp" width="12" height="12" patternUnits="userSpaceOnUse">${pp}</pattern>
    <radialGradient id="bowl" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#1D1A17" stop-opacity="0"/><stop offset="0.9" stop-color="#1D1A17" stop-opacity="0.18"/><stop offset="1" stop-color="#1D1A17" stop-opacity="0.42"/></radialGradient>
    <linearGradient id="light" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FFF6E0" stop-opacity="0.12"/><stop offset="0.5" stop-color="#FFF6E0" stop-opacity="0"/><stop offset="1" stop-color="#1D1A17" stop-opacity="0.22"/></linearGradient>
    <linearGradient id="lip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4E3A21"/><stop offset="0.35" stop-color="#7A5B33"/><stop offset="0.7" stop-color="#6A4F2C"/><stop offset="1" stop-color="#3E2E1A"/></linearGradient>
    <radialGradient id="heapG" cx="0.42" cy="0.36" r="0.7">
      <stop offset="0" stop-color="#FFFDF7"/><stop offset="0.55" stop-color="#EDE5D3"/><stop offset="1" stop-color="#BFB096"/></radialGradient>
    <radialGradient id="vign" cx="0.5" cy="0.52" r="0.75">
      <stop offset="0.5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.55"/></radialGradient>
    <radialGradient id="pool" gradientUnits="userSpaceOnUse" cx="${HX}" cy="${f1(HY)}" r="560" gradientTransform="translate(${HX} ${f1(HY)}) scale(1 0.8) translate(${-HX} ${f1(-HY)})">
      <stop offset="0" stop-color="#0A0806" stop-opacity="0"/><stop offset="0.3" stop-color="#0A0806" stop-opacity="0"/><stop offset="0.75" stop-color="#0A0806" stop-opacity="0.34"/><stop offset="1" stop-color="#0A0806" stop-opacity="0.5"/></radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E2B57A"/><stop offset="0.45" stop-color="#C89356"/><stop offset="1" stop-color="#8E6131"/></linearGradient>
    <filter id="blur30" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="blur18" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="blur6" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="blur3" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="blur2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="floorTex" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.009" numOctaves="4" seed="11" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.19  0 0 0 0 0.165  0 0 0 0 0.14  0 0 0 0.6 -0.18"/>
    </filter>
    <filter id="kraftTex" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.45" numOctaves="2" seed="5" result="t"/>
      <feColorMatrix in="t" type="matrix" values="0 0 0 0 0.42  0 0 0 0 0.29  0 0 0 0 0.15  0 0 0 0.5 -0.18" result="c"/>
      <feComposite in="c" in2="SourceGraphic" operator="in"/>
    </filter>
    <clipPath id="trayClip"><ellipse cx="${CX}" cy="${CY}" rx="${IA}" ry="${f1(IB)}"/></clipPath>
    <clipPath id="trayOuter"><ellipse cx="${CX}" cy="${CY}" rx="${R}" ry="${f1(R * K)}"/></clipPath>
  </defs>`);

  // ---------- floor ----------
  P(`<rect width="1080" height="1920" fill="#1D1A17"/>`);
  P(`<rect width="1080" height="1920" filter="url(#floorTex)" opacity="0.7"/>`);
  P(`<rect width="1080" height="1920" fill="url(#vign)"/>`);

  // ---------- the rice sack (flattened woven plastic) ----------
  const SX0 = 32, SX1 = 1048, SY0 = 220, SY1 = 1030;
  { const rnd = rng(19);
    let top = "";

    for (let i = prof.length - 1; i >= 0; i--) outline.push(at(prof[i][0], -prof[i][1]));
    const d = "M" + outline.map(q => f1(q[0]) + " " + f1(q[1])).join(" L") + "Z";
    const sd = "M" + outline.map((q, i) => { const s2 = prof[i < prof.length ? i : 2 * prof.length - 1 - i][0], lift = Math.max(0, s2) / LEN; return f1(q[0] + 6 + 16 * lift) + " " + f1(q[1] + 8 + 26 * lift); }).join(" L") + "Z";
    let s = `<path d="${sd}" fill="#0B0806" opacity="0.5" filter="url(#blur3)"/>`;
    s += `<path d="${d}" fill="url(#wood)" stroke="#6E4824" stroke-width="1.6" transform="rotate(0)"/>`;
    // grain lines + a highlight along the handle
    const g1 = at(-30, -14), g2 = at(LEN - 14, -4), g3 = at(-20, 12), g4 = at(LEN - 20, 5);
    s += `<path d="M${f1(g1[0])} ${f1(g1[1])} L${f1(g2[0])} ${f1(g2[1])}" stroke="#F2CF97" stroke-width="2.2" opacity="0.6" stroke-linecap="round"/>`;
    s += `<path d="M${f1(g3[0])} ${f1(g3[1])} L${f1(g4[0])} ${f1(g4[1])}" stroke="#9A6A36" stroke-width="1.3" opacity="0.7" stroke-linecap="round"/>`;
    P(s);
    // bury the blade: rice heaped back over its tip
    const nx = ux, ny = uy;
    P(heapGrains(rng(211), Math.round(520 * (HRX * HRY) / (120 * 80)), q => {
      const ls = (q.x - sx0) * nx + (q.y - sy0) * ny, lt = -(q.x - sx0) * ny + (q.y - sy0) * nx;
      return ls < 30 && ls > -60 && Math.abs(lt) < 46;
    }));
    const e0 = at(LEN * 0.55, 0), e1 = at(LEN + 6, 0);
    occupied.push({ x: Math.min(e0[0], e1[0]) - 20, y: Math.min(e0[1], e1[1]) - 20, w: Math.abs(e1[0] - e0[0]) + 40, h: Math.abs(e1[1] - e0[1]) + 40 });
  }

  // ---------- mid-toss: grains + chaff in the air, with cast shadows ----------
  { const rnd = rng(55);
    const srcRight = 94 + Math.min(740, srcEl.scrollWidth || 0);
    const textTop = titleBottom + 22 + srcH;
    const clear = (x, y) => !occupied.some(b => x > b.x - 10 && x < b.x + b.w + 10 && y > b.y - 10 && y < b.y + b.h + 10)
      && !(y < textTop + 14 && x < srcRight + 20) && y > titleBottom + 8 && !(x > 780 && y < 790);
    let sh = "", fly = "";
    const x0 = HX + 30, y0 = HY - HRY - 30, x1 = 1110, y1 = 870;
    for (let k = 0; k < 74; k++) {
      const u = rnd();
      const x = x0 + u * (x1 - x0) + (rnd() - 0.5) * 70;
      const y = y0 + u * (y1 - y0) - Math.sin(u * Math.PI) * 60 + (rnd() - 0.5) * 80 * (1 - u * 0.4);
      if (x > 1100 || !clear(x, y)) continue;
      const isHusk = u > 0.32 ? rnd() < 0.82 : rnd() < 0.3;
      const s = 1.35 + rnd() * 0.55, ang = rnd() * 180, h = 0.6 + u * 0.6;
      const sx = x + 22 * h, sy = y + 46 * h;
      sh += isHusk ? husk(sx, sy, ang, s, "#0C0A08", "#0C0A08") : grain(sx, sy, ang, s, "#0C0A08", "#0C0A08");
      fly += isHusk ? husk(x, y, ang, s, ["#C8A36A", "#A8844E", "#D9BB86"][k % 3], "#6E522E") : grain(x, y, ang, s, "#FBF7EE", "#B9A988");
    }
    P(`<g opacity="0.3" filter="url(#blur2)">${sh}</g>${fly}`);
    // chaff already settled on the floor (edges only, clear of the text)
    let fl = "";
    [[1030, 880, 20], [1052, 946, 112], [1022, 1005, 64], [1062, 1090, 140], [1040, 1230, 30], [56, 1250, 80], [40, 1330, 150], [1066, 1340, 96],
     [148, 1690, 24], [210, 1712, 128], [834, 1676, 60], [902, 1720, 150], [520, 1752, 40]].forEach(([x, y, a], i) =>
      fl += husk(x, y, a, 1.3, i % 2 ? "#8B6A3E" : "#A8844E", "#4E3A21"));
    [[176, 1668, 30], [610, 1700, 120], [760, 1742, 70], [300, 1760, 10]].forEach(([x, y, a]) => fl += grain(x, y, a, 1.1, "#E9E1CF", "#A99A7E"));
    P(fl);
  }

  $("scene").innerHTML = svg.join("");

  // ---------- ink texture over the print: tape gaps + small dropouts ----------
  { const rnd = rng(77);
    const tw = titleEl.offsetWidth, sh = srcH;
    let s = `<defs><pattern id="gaps" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 0.6 H6 M0 5.4 H6 M6.6 0 V6 M11.4 0 V6 M0.6 6 V12 M5.4 6 V12 M6 6.6 H12 M6 11.4 H12" stroke="#EDE7D9" stroke-width="0.9"/></pattern>
      <clipPath id="printClip"><rect x="96" y="${titleTop}" width="${tw}" height="${titleH}"/><rect x="94" y="${titleBottom + 22}" width="740" height="${sh}"/></clipPath></defs>`;
    s += `<g transform="rotate(${SA} ${PVX} ${PVY})" clip-path="url(#printClip)"><rect x="80" y="${titleTop - 8}" width="920" height="${titleH + sh + 40}" fill="url(#gaps)" opacity="0.16"/>`;
    for (let i = 0; i < 70; i++) {
      const x = 96 + rnd() * tw, y = titleTop + rnd() * titleH, rr = 0.8 + rnd() * 1.8;
      s += `<ellipse cx="${f1(x)}" cy="${f1(y)}" rx="${f1(rr * 1.4)}" ry="${f1(rr)}" fill="#ECE6D7" opacity="${f1(0.5 + rnd() * 0.4)}"/>`;
    }
    for (let i = 0; i < 14; i++) {
      const x = 96 + rnd() * (tw - 60), y = titleTop + rnd() * titleH, l = 14 + rnd() * 50;
      s += `<path d="M${f1(x)} ${f1(y)} h${f1(l)}" stroke="#ECE6D7" stroke-width="${f1(0.8 + rnd() * 0.8)}" opacity="0.55"/>`;
    }
    $("inkTex").innerHTML = s + `</g>`;
  }

  // ---------- karaoke caption ----------
  const capText = String(D.caption || D.sub || "").trim();
  const capWords = capText.split(/\s+/).filter(Boolean);
  const norm = s => s.toLowerCase().replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu, "");
  const hw = hl ? hl.split(/\s+/).map(norm).filter(Boolean) : [];
  let a0 = -1, a1 = -1;
  if (hw.length) {
    for (let i = 0; i + hw.length <= capWords.length && a0 < 0; i++) if (hw.every((h2, k) => norm(capWords[i + k]) === h2)) { a0 = i; a1 = i + hw.length - 1; }
    if (a0 < 0 && hw.length === 1) { const j = capWords.findIndex(x => norm(x).includes(hw[0])); if (j >= 0) a0 = a1 = j; }
  }
  if (a0 < 0) a0 = a1 = 0;
  const parts = [];
  for (let i = 0; i < capWords.length; i++) {
    if (i === a0) { parts.push(`<span class="w on">${esc(capWords.slice(a0, a1 + 1).join(" "))}</span>`); i = a1; }
    else parts.push(`<span class="w">${esc(capWords[i])}</span>`);
  }
  const capEl = $("cap");
  capEl.innerHTML = parts.join(" ");
  for (let fs = 48; fs >= 40; fs -= 2) { capEl.style.fontSize = fs + "px"; if (capEl.offsetHeight <= fs * 1.26 * 2 + 4) break; }
  const trayBottom = CY + R * K + LIP;
  capEl.style.top = Math.round(Math.min(trayBottom + 20, 1604 - capEl.offsetHeight)) + "px";
  }
</script>
</body>

<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>Locker Wall</title>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@800&family=Saira+Stencil+One&family=Red+Hat+Mono:wght@500;600&family=Red+Hat+Text:wght@500;600;700&display=block" rel="stylesheet" />
<!--DATA-->
<style>
  /*
    Locker Wall: one changing-room locker bank seen in real perspective (CSS 3D,
    one shared vanishing point). The hook line is spray-stencilled on the bank's
    riveted name rail (the hl in amber paint), an enamel room sign carries the
    series, each item is one locker (stencilled number, cream card, door), and
    the door's opening angle is the match strength (attention as soft lookup).
    A wooden key tag burned with the query word hangs from a brass hook on the
    door-head rail; the matching lockers are lit amber and spill light onto the
    slatted bench in front, whose base carries the laminated PERATURAN LOKER card
    (the caption). Deterministic: every angle, grain line and coil loop comes
    from data or is hard-coded; no randomness, no time.
  */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #1F2A36; }
  body { position: relative; color: #F4F4F2; font-family: "Red Hat Text", sans-serif; }

  .layer { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; pointer-events: none; }
  #room { z-index: 0; }
  #bank { z-index: 1; }
  #inside { z-index: 2; }
  #doors { z-index: 3; }
  #bench { z-index: 4; }
  #shade { z-index: 5; }
  #heads { z-index: 6; }
  #tagfx { z-index: 7; }
  #tag { z-index: 8; }
  .txt { z-index: 9; }

  /* ---- bank frame (2D, z = 0 plane) ---- */
  .abs { position: absolute; }
  .fascia { position: absolute; left: -40px; width: 1160px; background: linear-gradient(180deg, #33404E 0%, #2A3643 38%, #253039 100%); box-shadow: inset 0 3px 0 #4D5F72, inset 0 -5px 0 #19212A, 0 14px 20px rgba(5,8,12,.5); }
  .rv { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #A2B4C6 0%, #56687B 55%, #222C37 100%); box-shadow: 0 1px 1px rgba(0,0,0,.55); }
  .spray { position: absolute; border-radius: 6px; background: rgba(233,223,201,.06); filter: blur(7px); }
  .void { background: #0B1016; box-shadow: inset 0 0 0 2px #0A0E13; }
  .kick { background: linear-gradient(180deg, #3A4A5B, #303E4D); border-top: 2px solid #4E6175; }
  .kick i { position: absolute; left: 22%; right: 22%; top: 28%; height: 38%; background: repeating-linear-gradient(90deg, #1A222B 0 7px, transparent 7px 15px); border-radius: 2px; }
  .seam { background: linear-gradient(90deg, #2D3947 0, #121920 45%, #121920 60%, #4A5D71 100%); }
  .rail { background: linear-gradient(180deg, #5C6F83, #506276); box-shadow: inset 0 2px 0 #7286A0, inset 0 -2px 0 #3D4D5E; }
  .blank { position: absolute; background: #CFC6B2; border: 3px solid #7F8FA0; border-radius: 3px; opacity: .9; }

  /* ---- door faces ---- */
  .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 2px; }
  .face.out { background: linear-gradient(90deg, #7D90A3 0%, #6F8295 38%, #62758A 100%); box-shadow: inset 0 0 0 2px rgba(15,22,30,.35), inset 3px 3px 0 rgba(200,214,228,.22); }
  .face.out .lv { position: absolute; left: 20%; right: 20%; background: repeating-linear-gradient(180deg, #1C2630 0 7px, #9CB0C3 7px 9px, transparent 9px 17px); }
  .face.out .hd { position: absolute; right: 9%; width: 9%; min-width: 14px; border-radius: 7px; background: linear-gradient(90deg, #26313D, #3A4858); box-shadow: inset 0 0 0 2px #1A222B, 0 2px 0 rgba(200,214,228,.25); }
  .face.out .lk { position: absolute; right: 9%; width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #F6CE86, #C8913A 55%, #7A5520); box-shadow: 0 0 0 2px #2A333D; }
  .face.out .lk::after { content: ""; position: absolute; left: 9px; top: 5px; width: 4px; height: 12px; border-radius: 2px; background: #3A2813; }
  .face.out .dim { position: absolute; inset: 0; background: #0A0F15; }
  .face.inn { transform: rotateY(180deg); background: linear-gradient(90deg, #5A6C80, #4B5C6F); box-shadow: inset 0 0 0 2px rgba(15,22,30,.4); }
  .face.inn .ch { position: absolute; top: 4%; bottom: 4%; left: 36%; width: 20%; background: linear-gradient(90deg, #45566A, #63778C 40%, #4B5C70); border-radius: 3px; }
  .face.inn .warm { position: absolute; inset: 0; }
  .edge { position: absolute; top: 0; height: 100%; width: 12px; transform-origin: 0 50%; transform: rotateY(90deg); background: linear-gradient(180deg, #4A5B6D, #36444F); }

  /* ---- number plates + locker cards ---- */
  .hdr { position: absolute; }
  .np { height: 64px; background: #18212B; border-radius: 4px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; box-shadow: inset 0 0 0 2px #0F151B; }
  .num { font: 400 46px/1 "Saira Stencil One", sans-serif; color: #E9DFC9; letter-spacing: .02em; padding-top: 2px; }
  .np.lit .num { color: #F2A33A; }
  .slits { width: 34px; height: 28px; background: repeating-linear-gradient(180deg, #4E6074 0 4px, transparent 4px 9px); border-radius: 2px; }
  .card { margin-top: 10px; background: #E9DFC9; border: 3px solid #8C9CAD; border-radius: 4px; padding: 8px 7px 10px; color: #1F2A36; box-shadow: 0 3px 0 rgba(8,12,16,.35); }
  .card.lit { border-color: #F2A33A; box-shadow: 0 0 0 3px rgba(242,163,58,.25), 0 3px 0 rgba(8,12,16,.35); }
  .lb { font-family: "Big Shoulders Stencil Display", sans-serif; font-weight: 800; line-height: 1.02; letter-spacing: .01em; color: #1F2A36; overflow-wrap: anywhere; }
  .vl { font: 600 30px/1.18 "Red Hat Mono", monospace; letter-spacing: -.04em; color: #1F2A36; margin-top: 4px; overflow-wrap: anywhere; }

  /* ---- foreground key tag ---- */
  #tag { position: absolute; width: 224px; height: 380px; transform-origin: 112px 30px; }
  #tag svg { position: absolute; left: 0; top: 0; width: 224px; height: 380px; overflow: visible; }
  .tagq { position: absolute; left: 12px; width: 200px; text-align: center; font-family: "Saira Stencil One", sans-serif; font-weight: 400; line-height: .98; color: #3A2213; text-shadow: 0 1px 0 rgba(255,236,204,.45); }
  .tagq .qw { white-space: nowrap; }

  /* ---- enamel room sign (kicker), screwed to the top of the name rail ---- */
  #sign { position: absolute; top: 300px; height: 52px; padding: 0 50px; display: flex; align-items: center; background: linear-gradient(180deg, #F1E8D4, #E2D7BE); border-radius: 12px; font: 600 26px/1 "Red Hat Mono", monospace; letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; color: #1F2A36; box-shadow: inset 0 0 0 4px #ECE2CB, inset 0 0 0 7px #1F2A36, 0 6px 14px rgba(4,7,10,.55); }
  #sign::before, #sign::after { content: ""; position: absolute; top: 19px; width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #C9D3DC, #6F8295 60%, #2A3643); }
  #sign::before { left: 18px; }
  #sign::after { right: 18px; }

  /* ---- title: spray-stencilled on the riveted name rail ---- */
  #title { position: absolute; left: 110px; width: 860px; text-align: center; font-family: "Saira Stencil One", sans-serif; font-weight: 400; text-transform: uppercase; line-height: .96; letter-spacing: -.006em; color: #E9DFC9; text-wrap: balance; text-shadow: 0 0 2px rgba(233,223,201,.45), 0 0 14px rgba(233,223,201,.10); }
  #title .tw { white-space: nowrap; }
  #title .hl { color: #F2A33A; text-shadow: 0 0 2px rgba(242,163,58,.5), 0 0 16px rgba(242,163,58,.16); }
  #sub { position: absolute; left: 110px; width: 860px; text-align: center; font: 600 40px/1.25 "Red Hat Text", sans-serif; color: #DCD3BF; text-wrap: balance; }

  /* ---- laminated rules card bolted to the bench base: the caption slot ---- */
  #rules { position: absolute; left: 90px; width: 900px; padding: 14px 24px 14px; background: #E9DFC9; border-radius: 10px; color: #1F2A36; box-shadow: 0 0 0 9px rgba(214,226,236,.14), 0 0 0 10px rgba(244,244,242,.26), 0 18px 30px rgba(4,7,10,.6); }
  #rules::after { content: ""; position: absolute; right: 0; top: 0; width: 300px; height: 58px; border-radius: 0 10px 0 0; background: linear-gradient(115deg, rgba(255,255,255,0) 30%, rgba(255,255,255,.32) 48%, rgba(255,255,255,0) 66%); pointer-events: none; }
  #rules .bolt { position: absolute; width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #D5DEE6, #7F92A5 55%, #2A3643); box-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .rh { font: 600 30px/1.2 "Red Hat Mono", monospace; letter-spacing: .14em; text-transform: uppercase; color: #1F2A36; padding-bottom: 8px; border-bottom: 3px solid #1F2A36; margin-bottom: 10px; }
  #caption { font-family: "Red Hat Text", sans-serif; font-weight: 600; line-height: 1.24; text-align: left; text-wrap: pretty; }
  #caption .w { color: #4E5A68; }
  #caption .w.said { color: #1F2A36; }
  #caption .now { background: #F2A33A; border-radius: 6px; padding: 0 .12em; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  #caption .now .w { color: #1F2A36; }
  .foot { display: flex; justify-content: space-between; align-items: flex-end; gap: 30px; margin-top: 12px; padding-top: 8px; border-top: 2px dashed rgba(31,42,54,.35); font: 500 26px/1.3 "Red Hat Mono", monospace; color: #4E5A68; }
  .foot span:last-child { white-space: nowrap; }
</style>
</head>
<body>
<svg id="room" class="layer" data-layout-allow-overflow viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg>
<div id="bank" class="layer" data-layout-allow-overflow></div>
<div id="inside" class="layer" data-layout-allow-overflow></div>
<div id="doors" class="layer" data-layout-allow-overflow></div>
<svg id="bench" class="layer" data-layout-allow-overflow viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg>
<div id="shade" class="layer"></div>
<div id="heads" class="layer"></div>
<svg id="tagfx" class="layer" data-layout-allow-overflow viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg>
<div id="tag" data-layout-allow-overflow></div>

<div id="sign" class="txt"><span id="signtx"></span></div>
<h1 id="title" class="txt"></h1>
<div id="sub" class="txt"></div>
<div id="rules" class="txt">
  <div class="rh">Peraturan loker</div>
  <div id="caption" data-slot="caption"></div>
  <div class="foot" id="foot"><span id="src"></span><span id="date"></span></div>
  <i class="bolt" style="left:-13px;top:-13px"></i><i class="bolt" style="right:-13px;top:-13px"></i>
  <i class="bolt" style="left:-13px;bottom:-13px"></i><i class="bolt" style="right:-13px;bottom:-13px"></i>
</div>

<script>
  // Fallback sample so the file also opens standalone in a browser.
  const D = window.D || { series: "Cara kerja AI", ep: "#01", kicker: "Cara kerja AI · #01",
    title: "AI nggak baca kata. Dia baca token.", hl: "token",
    sub: "Makanya AI kadang salah hitung huruf di kata \"strawberry\".",
    items: [{ label: "Ken·apa", value: "2 token" }, { label: "AI", value: "1 token" }, { label: "bisa", value: "1 token" }, { label: "ng·arang", value: "2 token" }],
    source: "ilustrasi — jumlah token beda tiap model", date: "per 14 Okt 2026" };

  // Lay out only after the web fonts are in: all fitting below measures real glyph widths.
  Promise.all(['800 100px "Big Shoulders Stencil Display"', '400 100px "Saira Stencil One"', '600 30px "Red Hat Mono"', '500 26px "Red Hat Mono"', '600 44px "Red Hat Text"', '600 40px "Red Hat Text"']
    .map(f => document.fonts.load(f))).catch(() => {}).then(() => document.fonts.ready).then(render);

  function render() {
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const $ = id => document.getElementById(id);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const AMBER = "#F2A33A";

  const items = (D.items || []).slice(0, 5);
  const N = Math.max(1, items.length);
  const hl = String(D.hl || "").trim(), hlL = hl.toLowerCase();
  const t = String(D.title || "");

  // ---------- enamel room sign: RUANG GANTI · series · ep ----------
  const kick = String(D.kicker || "");
  const series = String(D.series || kick.split("·")[0] || "").trim();
  const ep = String(D.ep || kick.split("·")[1] || "").replace(/^\s*(ep\.?|episode)?\s*#?\s*/i, "").trim();
  const sign = $("sign"), signTx = $("signtx");
  const parts = [series, ep].filter(Boolean);
  signTx.textContent = ["Ruang ganti"].concat(parts).join(" · ");
  if (sign.offsetWidth > 900) signTx.textContent = parts.join(" · ");
  if (sign.offsetWidth > 900) sign.style.letterSpacing = ".04em";
  sign.style.left = Math.round(540 - sign.offsetWidth / 2) + "px";

  // ---------- rules card: karaoke caption (active = hl if spoken, else the first word) + source ----------
  const capText = String(D.caption || D.sub || "");
  const cap = $("caption");
  const words = []; { let pos = 0; for (const w of capText.split(/\s+/).filter(Boolean)) { const s = capText.indexOf(w, pos); words.push({ w, s, e: s + w.length }); pos = s + w.length; } }
  let a0 = -1, a1 = -1;
  if (hlL) { const i = capText.toLowerCase().indexOf(hlL); if (i >= 0) { a0 = i; a1 = i + hl.length; } }
  const isAct = (o, k) => a0 >= 0 ? (o.s < a1 && o.e > a0) : k === 0;
  let html = "", seen = false, k = 0;
  while (k < words.length) {
    if (isAct(words[k], k)) {
      const grp = [];
      while (k < words.length && isAct(words[k], k)) grp.push('<span class="w">' + esc(words[k++].w) + "</span>");
      html += '<span class="now">' + grp.join(" ") + "</span> "; seen = true;
    } else { html += '<span class="w' + (seen ? "" : " said") + '">' + esc(words[k++].w) + "</span> "; }
  }
  cap.innerHTML = html.trim();
  $("src").textContent = D.source ? "Sumber: " + D.source : "";
  $("date").textContent = D.date || "";
  if (!D.source && !D.date) $("foot").remove();
  let capFs = 46;
  for (; capFs >= 40; capFs -= 1) { cap.style.fontSize = capFs + "px"; if (cap.offsetHeight <= capFs * 1.24 * 2 + 2) break; }
  if (capFs < 40) { capFs = 40; cap.style.fontSize = "40px"; }
  const rules = $("rules");
  const cardTop = 1620 - rules.offsetHeight;
  rules.style.top = cardTop + "px";

  // ---------- bench + bank base, bottom-up from the card ----------
  const NOSE = 22, apronTop = cardTop - 14, seatFrontY = apronTop - NOSE;
  let SEAT = 56, KICK = 42, PH = 64;                       // a compact pass shrinks these before the bays get short
  let seatBackY = seatFrontY - SEAT, yBayB = seatBackY - KICK;
  const G = 16, X0 = 90, X1 = 990, STILE = 9;
  const colW = (X1 - X0 - (N - 1) * G) / N;
  const colX = i => X0 + i * (colW + G);

  // ---------- match strength -> door angle ----------
  // all values numbers in one unit: angle proportional to the value (ties share angle + light);
  // otherwise: lockers whose label/value matches the query (hl text, its number or a word) open wide, the rest stand equally ajar
  const parseVal = s => {
    const raw = String(s == null ? "" : s).trim();
    const m = raw.match(/(\d{1,3}(?:\.\d{3})+(?:,\d+)?|\d+(?:[.,]\d+)?)/);
    if (!m) return null;
    const n = /^\d{1,3}(\.\d{3})+(,\d+)?$/.test(m[1]) ? m[1].replace(/\./g, "").replace(",", ".") : m[1].replace(",", ".");
    const unit = (raw.slice(0, m.index) + " " + raw.slice(m.index + m[0].length)).toLowerCase().replace(/[^a-z%$€£¥]+/g, " ").trim();
    return { v: parseFloat(n), unit, neg: /-\s*$/.test(raw.slice(0, m.index)) };
  };
  const pv = items.map(it => parseVal(it.value));
  const numeric = items.length > 1 && pv.every(p => p && isFinite(p.v) && !p.neg) && pv.every(p => p.unit === pv[0].unit);
  const vmax = numeric ? Math.max(...pv.map(p => p.v)) : 0;
  let ang, lit;
  if (numeric && vmax > 0) {
    ang = pv.map(p => 10 + 102 * p.v / vmax);
    lit = pv.map(p => p.v === vmax);
  } else {
    const nums = s => (String(s).match(/\d+(?:[.,]\d+)?/g) || []).map(x => parseFloat(x.replace(",", ".")));
    const hn = nums(hl), hw = hlL.split(/[^a-z0-9À-ɏ]+/).filter(w => w.length >= 4);
    lit = items.map(it => { const s = (String(it.label || "") + " " + String(it.value || "")).toLowerCase();
      return !!hlL && (s.includes(hlL) || nums(s).some(n => hn.includes(n)) || hw.some(w => s.includes(w))); });
    if (!lit.some(Boolean)) lit[0] = true;
    ang = lit.map(h => (h ? 112 : 24));
  }

  // ---------- plates + cards (measured first: they set the header height) ----------
  const heads = $("heads");
  const pad2 = n => (n < 10 ? "0" : "") + n;
  heads.innerHTML = items.map((it, i) =>
    '<div class="hdr" style="left:' + (colX(i) + 3).toFixed(1) + 'px;width:' + (colW - 6).toFixed(1) + 'px;top:0">' +
      '<div class="np' + (lit[i] ? " lit" : "") + '"><span class="num">' + pad2(i + 1) + '</span><span class="slits"></span></div>' +
      '<div class="card' + (lit[i] ? " lit" : "") + '"><div class="lb">' + esc(it.label) + '</div><div class="vl">' + esc(it.value) + "</div></div>" +
    "</div>").join("");
  const cards = [...heads.querySelectorAll(".card")], lbs = [...heads.querySelectorAll(".lb")];
  // one label size for the whole bank: biggest that keeps every label to <= 2 lines without breaking words
  let lbFs = 48;
  const probe = document.createElement("span");
  probe.style.cssText = "position:absolute;visibility:hidden;white-space:nowrap;font-family:'Big Shoulders Stencil Display';font-weight:800;letter-spacing:.01em";
  document.body.appendChild(probe);
  const wordW = (w, fs) => { probe.style.fontSize = fs + "px"; probe.textContent = w; return probe.offsetWidth; };
  const lbOk = () => lbs.every(el => el.offsetHeight <= lbFs * 1.02 * 2 + 2 && el.scrollWidth <= el.clientWidth + 1 &&
    String(el.textContent).split(/\s+/).every(w => wordW(w, lbFs) <= el.clientWidth + 1));
  for (; lbFs >= 30; lbFs -= 2) { lbs.forEach(el => el.style.fontSize = lbFs + "px"); if (lbOk()) break; }
  if (lbFs < 30) { lbFs = 30; lbs.forEach(el => el.style.fontSize = "30px"); }
  const cardH = Math.max(...cards.map(c => c.offsetHeight));
  cards.forEach(c => c.style.height = cardH + "px");
  let headH = 12 + PH + 10 + cardH + 22;

  // ---------- title: stencil words, the hl range in amber paint ----------
  const titleEl = $("title");
  const at = hl ? t.toLowerCase().indexOf(hlL) : -1, atE = at < 0 ? -1 : at + hl.length;
  { let th = "", pos = 0;
    for (const w of t.split(/\s+/).filter(Boolean)) {
      const s = t.indexOf(w, pos), e = s + w.length; pos = e;
      const cut = (x, y) => esc(t.slice(x, y));
      let inner = cut(s, e);
      if (at >= 0 && s < atE && e > at) { const p = Math.max(s, at), q = Math.min(e, atE); inner = cut(s, p) + '<span class="hl">' + cut(p, q) + "</span>" + cut(q, e); }
      th += '<span class="tw">' + inner + "</span> ";
    }
    titleEl.innerHTML = th.trim(); }
  const subEl = $("sub");
  const hasSub = !!(D.caption && D.sub && D.caption !== D.sub);
  if (hasSub) subEl.textContent = D.sub; else subEl.remove();
  const subH = hasSub ? 18 + subEl.offsetHeight : 0;

  // biggest title (<= 3 lines) that still leaves the door bays at least MINBAY tall
  const FT = 326, TT = 370, FPB = 30, MINBAY = 330;
  const tws = [...titleEl.querySelectorAll(".tw")];
  let titleFs = 136;
  const fitTitle = (minFs, minBay) => {
    for (titleFs = 136; titleFs >= minFs; titleFs -= 2) {
      titleEl.style.fontSize = titleFs + "px";
      const h = titleEl.offsetHeight, lines = Math.round(h / (titleFs * 0.96));
      if (tws.every(s => s.offsetWidth <= 860) && lines <= 3 && h <= 340 && yBayB - (TT + h + subH + FPB + headH) >= minBay) return true;
    }
    titleFs = minFs; titleEl.style.fontSize = minFs + "px"; return false;
  };
  if (!fitTitle(80, MINBAY)) {
    // dense data (long title + sub + long caption + 5 two-line cards): lower seat, kick and number plates first
    SEAT = 40; KICK = 30; PH = 54; seatBackY = seatFrontY - SEAT; yBayB = seatBackY - KICK; headH = 12 + PH + 10 + cardH + 22;
    if (!fitTitle(80, MINBAY)) fitTitle(72, 230);
  }
  heads.querySelectorAll(".np").forEach(el => { el.style.height = PH + "px"; });
  heads.querySelectorAll(".num").forEach(el => { el.style.fontSize = (PH < 64 ? 40 : 46) + "px"; });
  const titleH = titleEl.offsetHeight;
  titleEl.style.top = TT + "px";
  if (hasSub) subEl.style.top = (TT + titleH + 18) + "px";
  const fasciaB = TT + titleH + subH + FPB;
  const yHead = fasciaB, yBay = yHead + headH, bayH = yBayB - yBay;
  heads.querySelectorAll(".hdr").forEach(h => h.style.top = (yHead + 12) + "px");

  // ---------- bank frame: riveted name rail, column rails, bays, kick plates ----------
  const cols = []; for (let i = -1; i <= N; i++) cols.push(i);
  let bank = '<div class="abs" style="left:-40px;top:' + FT + 'px;width:1160px;height:' + (seatBackY - FT) + 'px;background:linear-gradient(180deg,#56697D,#4A5C6F 55%,#3F5062)"></div>';
  bank += '<div class="fascia" style="top:' + FT + "px;height:" + (fasciaB - FT) + 'px"></div>';
  for (let x = 14; x < 1080; x += 52) {
    bank += '<i class="rv" style="left:' + (x - 6) + "px;top:" + (FT + 9) + 'px"></i><i class="rv" style="left:' + (x - 6) + "px;top:" + (fasciaB - 21) + 'px"></i>';
  }
  // stencil overspray: the soft rectangle the stencil sheet left round each painted line

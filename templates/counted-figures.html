<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600;700&family=Newsreader:ital,opsz,wght@0,16,500;0,16,700;1,16,500&display=block" rel="stylesheet" />
<!--DATA-->
<style>
  /*
    Counted Figures: a 1930s Vienna-method pictorial-statistics board (Isotype).
    Cream card, double neatline, hairline row rules. Every item of D.items is
    ONE ROW of identical same-size linocut pictograms — a bigger number is MORE
    figures, never a bigger icon; values that cannot be counted (miliaran…)
    overflow past the right edge and end in a cut figure. Label in small caps
    at row start, value in red at row end, key box states the unit. All figures
    are inline SVG paths, deterministic.
    Video: rows stamp their figures one by one (stagger build); the overflowing
    row keeps stamping past the edge (hook #2); loop = figures collapse back
    into the single key-box figure (ending G/J).
  */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #F1EAD8; }
  body { position: relative; font-family: "Jost", sans-serif; color: #1C1C1C; }

  .kick { position: absolute; left: 90px; top: 296px; font: 600 28px "Jost", sans-serif; letter-spacing: 0.22em; text-transform: uppercase; color: #2F4F8F; }
  .title { position: absolute; left: 90px; width: 900px; top: 352px; font: 700 96px "Jost", sans-serif; line-height: 1.02; text-transform: uppercase; letter-spacing: 0.005em; }
  .title .hl { color: #F1EAD8; background: #C2412D; padding: 0 0.12em; box-decoration-break: clone; -webkit-box-decoration-break: clone; }

  .board { position: absolute; left: 60px; width: 960px; border: 4px solid #1C1C1C; box-shadow: 0 0 0 3px #F1EAD8, 0 0 0 6px #1C1C1C; background: #F5EFDF; }
  .row { position: relative; border-bottom: 2px solid #B9A88A; }
  .row:last-of-type { border-bottom: none; }
  .rl { position: absolute; left: 34px; top: 16px; width: 520px; font: 600 30px "Jost", sans-serif; line-height: 1.15; text-transform: uppercase; letter-spacing: 0.06em; color: #1C1C1C; }
  .rv { position: absolute; right: 34px; top: 16px; font: 700 44px "Newsreader", serif; color: #C2412D; text-align: right; }
  .figs { position: absolute; left: 34px; right: 10px; bottom: 8px; height: 64px; overflow: hidden; white-space: nowrap; }
  .keybox { position: absolute; left: 34px; bottom: 26px; border: 3px solid #1C1C1C; padding: 12px 20px 14px; background: #F5EFDF; }
  .keybox .kt { font: 700 30px "Jost", sans-serif; letter-spacing: 0.14em; text-transform: uppercase; }
  .keybox .ku { font: italic 500 32px "Newsreader", serif; color: #2F4F8F; margin-top: 2px; }
  .meta { position: absolute; right: 34px; bottom: 30px; width: 380px; text-align: right; font: 500 26px "Jost", sans-serif; line-height: 1.3; color: #55534B; }

  .cap { position: absolute; left: 90px; width: 860px; font: 500 44px "Newsreader", serif; line-height: 1.24; color: #1C1C1C; }
  .cap .w.on { font-weight: 700; color: #F1EAD8; background: #2F4F8F; padding: 0 0.16em; }
</style>
</head>
<body>
<div class="kick" id="kick"></div>
<div class="title" id="title"></div>
<div class="board" id="board"></div>
<div class="cap" id="cap" data-slot="caption"></div>
<script>
  // Fallback sample (AI dalam angka) shaped like data/sample-tokens.json.
  const D = window.D || { series_id: "ai-in-numbers", series: "AI dalam angka", ep: "#01", kicker: "AI dalam angka · #01",
    title: "1 chat ke AI = oven nyala 1 detik.", hl: "1 detik",
    sub: "Kecil? Kalikan miliaran chat tiap hari.",
    items: [
      { label: "Listrik per chat", value: "0,34 Wh" },
      { label: "Setara oven", value: "±1 dtk" },
      { label: "Chat per hari", value: "miliaran" }
    ],
    source: "klaim OpenAI, Jun 2025", date: "per 14 Okt 2026" };

  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const norm = w => w.toLowerCase().replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu, "");
  const $ = id => document.getElementById(id);
  const INK = "#1C1C1C", RED = "#C2412D", BLUE = "#2F4F8F", TAN = "#B9A88A";

  // Flat linocut pictograms, 64x64 viewbox each, drawn as SVG paths.
  const FIGS = {
    chip: c => '<rect x="14" y="14" width="36" height="36" fill="' + c + '"/>' +
      '<rect x="24" y="24" width="16" height="16" fill="#F5EFDF"/>' +
      [10, 22, 34, 46].map(p => '<rect x="' + p + '" y="2" width="6" height="10" fill="' + c + '"/><rect x="' + p + '" y="52" width="6" height="10" fill="' + c + '"/><rect x="2" y="' + p + '" width="10" height="6" fill="' + c + '"/><rect x="52" y="' + p + '" width="10" height="6" fill="' + c + '"/>').join(""),
    bolt: c => '<polygon points="36,2 12,36 28,36 24,62 52,26 34,26" fill="' + c + '"/>',
    drop: c => '<path d="M32 4 C32 4 10 32 10 44 a22 22 0 0 0 44 0 C54 32 32 4 32 4 Z" fill="' + c + '"/>' +
      '<path d="M22 42 a10 12 0 0 0 8 14" stroke="#F5EFDF" stroke-width="5" fill="none" stroke-linecap="round"/>',
    rack: c => '<rect x="6" y="6" width="52" height="52" fill="' + c + '"/>' +
      [14, 28, 42].map(y => '<rect x="14" y="' + y + '" width="24" height="6" fill="#F5EFDF"/><circle cx="48" cy="' + (y + 3) + '" r="4" fill="#F5EFDF"/>').join("")
  };
  const FIG_ORDER = ["chip", "bolt", "drop", "rack"];

  Promise.all(['700 96px "Jost"', '600 30px "Jost"', '700 44px "Newsreader"', '500 44px "Newsreader"'].map(f => document.fonts.load(f))).catch(() => {}).then(render);

  function render() {
  $("kick").textContent = D.kicker || (D.series + " · " + (D.ep || ""));

  // title: largest element, auto-fit
  const tEl = $("title");
  const title = String(D.title || "");
  const at = D.hl ? title.indexOf(D.hl) : -1;
  tEl.innerHTML = at < 0 ? esc(title) : esc(title.slice(0, at)) + '<span class="hl">' + esc(title.slice(at, at + D.hl.length)) + "</span>" + esc(title.slice(at + D.hl.length));
  // title space budget: caption must clear board bottom at y 1456
  const nItems0 = D.items.length;
  const maxTitleH = 1456 - 130 - nItems0 * Math.max(118, Math.floor(720 / nItems0)) - 650;
  let tfs = 96;
  for (; tfs >= 72; tfs -= 2) { tEl.style.fontSize = tfs + "px"; if (tEl.offsetHeight <= maxTitleH) break; }

  // board: below the measured title; compress rows if needed to keep caption clear
  const n = D.items.length;
  const keyH = 130;
  const board = $("board");
  let rowH = Math.max(140, Math.min(200, Math.floor(720 / n)));
  let BH = n * rowH + keyH;
  const tBot = 352 + tEl.offsetHeight;
  let boardTop = tBot + 50;
  const slack = 1504 - tBot - BH;
  if (slack > 100) boardTop = tBot + Math.round(slack / 2);   // centre the board when the title leaves a void
  if (boardTop + BH > 1456) { rowH = Math.max(118, Math.floor((1456 - boardTop - keyH) / n)); BH = n * rowH + keyH; }
  board.style.top = boardTop + "px";
  board.style.height = BH + "px";

  const rowsHtml = D.items.map((it, i) => {
    return '<div class="row" style="height:' + rowH + 'px">' +
      '<div class="rl">' + esc(it.label) + "</div>" +
      '<div class="rv" style="max-width:300px">' + esc(it.value) + "</div>" +
      '<div class="figs" id="figs' + i + '"></div>' +
      "</div>";
  }).join("");
  board.innerHTML = rowsHtml +
    '<div class="keybox"><div class="kt">Kunci</div><div class="ku">1 ikon = 1 satuan</div></div>' +
    '<div class="meta">' + esc(D.source || "") + "<br>" + esc(D.date || "") + "</div>";

  // pictogram runs: count figures for numeric values, overflow + cut figure otherwise
  const fig = (kind, colour) => '<svg width="64" height="64" viewBox="0 0 64 64" style="margin:0 10px 0 0">' + FIGS[kind](colour) + "</svg>";
  D.items.forEach((it, i) => {
    const host = $("figs" + i);
    const colour = i % 3 === 1 ? BLUE : (i % 3 === 2 ? RED : INK);
    const kind = FIG_ORDER[i % FIG_ORDER.length];
    const m = String(it.value).replace(/\./g, "").replace(",", ".").match(/-?\d+(\.\d+)?/);
    let count = 1, overflow = false;
    if (m) { const v = parseFloat(m[0]); if (v >= 1 && v <= 8) count = Math.round(v); else if (v > 8) overflow = true; }
    else overflow = true;
    if (overflow) count = 14;                    // runs past the right edge, cut by the board
    host.innerHTML = fig(kind, colour).repeat(count);
  });

  // caption karaoke
  const cap = String(D.caption || D.sub || "").trim();
  const words = cap.split(/\s+/).filter(Boolean);
  const hws = D.hl ? D.hl.split(/\s+/).map(norm).filter(Boolean) : [];
  let a0 = -1, a1 = -1;
  if (hws.length) {
    for (let i = 0; i + hws.length <= words.length && a0 < 0; i++) if (hws.every((h2, k) => norm(words[i + k]) === h2)) { a0 = i; a1 = i + hws.length - 1; }
    if (a0 < 0 && hws.length === 1) { const j = words.findIndex(w => norm(w).includes(hws[0])); if (j >= 0) a0 = a1 = j; }
  }
  if (a0 < 0) a0 = a1 = 0;
  const parts = [];
  for (let i = 0; i < words.length; i++) {
    if (i === a0) { parts.push('<span class="w on">' + esc(words.slice(a0, a1 + 1).join(" ")) + "</span>"); i = a1; }
    else parts.push('<span class="w">' + esc(words[i]) + "</span>");
  }
  const capEl = $("cap");
  capEl.innerHTML = parts.join(" ");
  let cfs = 46;
  for (; cfs >= 40; cfs -= 2) { capEl.style.fontSize = cfs + "px"; if (capEl.offsetHeight <= cfs * 1.24 * 2 + 4) break; }
  capEl.style.top = (1616 - capEl.offsetHeight) + "px";
  }
</script>
</body>
</html>

<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<title>Capsule hook</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* Capsule preset tokens (frame-presets/capsule/FRAME.md) */
  :root {
    --cream: #f5f5f0; --ink: #1a1a1a; --outline: #1e1e1e; --white: #fff;
    --coral: #e85d4e; --lime: #c4d94e; --lavender: #c5b5e0; --sky: #8bb4f7; --violet: #a06ce8;
    --yellow: #f2d160; --peach: #f5b895; --mint: #a8e6cf; --shadow: rgba(26,26,26,.08);
    --line: 3px solid var(--outline);
    --disp: "Bodoni Moda", serif; --sans: "Space Grotesk", sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body { background: var(--cream); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; position: relative; }

  /* atmosphere: radial candy glows + 4% grain — never absent */
  .glow { position: absolute; inset: 0;
    background:
      radial-gradient(620px 620px at 8% 14%, rgba(139,180,247,.22), transparent 70%),
      radial-gradient(560px 560px at 96% 52%, rgba(197,181,224,.26), transparent 70%),
      radial-gradient(640px 640px at 30% 96%, rgba(245,184,149,.24), transparent 70%); }
  .grain { position: absolute; inset: 0; opacity: .05; mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

  /* floating-pill wallpaper: flat (no shadow), outlined, tilted */
  .fp { position: absolute; border: var(--line); border-radius: 9999px; }

  .col { position: absolute; left: 90px; right: 90px; top: 250px; bottom: 300px; display: flex; flex-direction: column; align-items: center; text-align: center; }

  .title-pill { background: var(--yellow); border: var(--line); border-radius: 9999px; box-shadow: 6px 6px 0 var(--shadow);
    padding: 12px 30px 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .14em; font-size: 30px; }

  /* pin a small optical size: the display opsz has hairlines that vanish on video */
  .title, .stat .val, .stat .num { font-optical-sizing: none; font-variation-settings: "opsz" 14; }
  .title { margin-top: 40px; width: 900px; font-family: var(--disp); font-weight: 800; letter-spacing: -.03em; line-height: 1.02; }
  /* quote-highlight: candy pill wrapping the key phrase, italic Bodoni inside */
  .title .hl { display: inline-block; background: var(--sky); border: var(--line); border-radius: 9999px; box-shadow: 6px 6px 0 var(--shadow);
    font-style: italic; font-weight: 700; padding: 0 .32em .06em .28em; line-height: 1.04; margin: .06em 0; white-space: nowrap; }
  .accent { width: 130px; height: 9px; border-radius: 9999px; background: var(--coral); margin-top: 34px; }

  .grid { flex: 1; width: 740px; display: grid; grid-template-columns: 1fr 1fr; gap: 26px; align-content: center; padding: 34px 0 30px; margin-right: 70px; }
  .stat { background: var(--white); border: var(--line); border-radius: 56px; box-shadow: 8px 8px 0 var(--shadow); padding: 26px 26px 30px; position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  .stat.wide { grid-column: 1 / -1; flex-direction: row; justify-content: space-between; padding: 22px 30px 22px 22px; border-radius: 9999px; }
  .chip { border: var(--line); border-radius: 9999px; padding: 8px 22px 7px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; font-size: 30px; line-height: 1.15; max-width: 100%; }
  .stat .val { font-family: var(--disp); font-weight: 800; letter-spacing: -.03em; line-height: 1; white-space: nowrap; }
  .stat .bar { width: 64px; height: 8px; border-radius: 9999px; }
  .stat .num { position: absolute; top: -18px; right: 18px; width: 56px; height: 56px; border: var(--line); border-radius: 50%; background: var(--white);
    display: grid; place-items: center; font-family: var(--disp); font-weight: 800; font-size: 30px; }

  .sub { width: 820px; font-size: 40px; line-height: 1.38; font-weight: 500; }
  .meta { margin-top: 26px; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .meta span { background: var(--white); border: var(--line); border-radius: 9999px; padding: 7px 20px 6px; font-weight: 500; text-transform: uppercase; letter-spacing: .08em; font-size: 26px; }
</style>
<!--DATA-->
<script>
  // Fallback sample so the file opens standalone in a browser.
  const FALLBACK = {
    series: "Cara kerja AI", ep: "#01", kicker: "Cara kerja AI · #01",
    title: "AI nggak baca kata. Dia baca token.", hl: "token",
    sub: "Makanya AI kadang salah hitung huruf di kata \"strawberry\".",
    items: [ { label: "Ken·apa", value: "2 token" }, { label: "AI", value: "1 token" }, { label: "bisa", value: "1 token" }, { label: "ng·arang", value: "2 token" } ],
    source: "ilustrasi — jumlah token beda tiap model", date: "per 14 Okt 2026"
  };
  const D = window.D || FALLBACK;
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  function splitHL(t, hl) {
    const i = hl ? t.toLowerCase().indexOf(String(hl).toLowerCase()) : -1;
    return i < 0 ? [t, "", ""] : [t.slice(0, i), t.slice(i, i + hl.length), t.slice(i + hl.length)];
  }
  function fit(el, maxH, hi, lo) {
    let a = lo, b = hi;
    while (b - a > 1) { const m = (a + b) >> 1; el.style.fontSize = m + "px"; (el.scrollHeight <= maxH && el.scrollWidth <= el.clientWidth + 1) ? (a = m) : (b = m); }
    el.style.fontSize = a + "px";
  }
  // Warm / cool / neutral-bright rotation (no two same-family adjacent).
  const CHIP = ["var(--peach)", "var(--sky)", "var(--yellow)", "var(--lavender)", "var(--coral)"];
  const BAR = ["var(--coral)", "var(--violet)", "var(--lime)", "var(--sky)", "var(--yellow)"];
  // Flat floating pills (top + bottom bands, edges only — never behind content).
  const FLOAT = [
    { x: -40, y: 70, w: 230, h: 78, r: -14, c: "var(--lavender)" }, { x: 250, y: 120, w: 70, h: 70, r: 0, c: "var(--coral)" },
    { x: 760, y: 60, w: 260, h: 84, r: 18, c: "var(--sky)" }, { x: 640, y: 160, w: 120, h: 50, r: -22, c: "var(--yellow)" },
    { x: 1010, y: 640, w: 150, h: 64, r: 70, c: "var(--peach)" }, { x: -70, y: 1040, w: 140, h: 60, r: -60, c: "var(--violet)" },
    { x: 80, y: 1700, w: 280, h: 90, r: 12, c: "var(--yellow)" }, { x: 420, y: 1790, w: 90, h: 90, r: 0, c: "var(--sky)" },
    { x: 640, y: 1690, w: 300, h: 92, r: -16, c: "var(--coral)" },
  ];
  function render() {
    document.getElementById("fl").innerHTML = FLOAT.map((p) =>
      `<div class="fp" style="left:${p.x}px;top:${p.y}px;width:${p.w}px;height:${p.h}px;transform:rotate(${p.r}deg);background:${p.c}"></div>`).join("");
    const series = D.series || (D.kicker || "").split("·")[0].trim();
    document.getElementById("tp").textContent = [series || D.kicker, D.ep].filter(Boolean).join(" · ");
    const [a, h, b] = splitHL(D.title || "", D.hl);
    const t = document.getElementById("title");
    t.innerHTML = esc(a) + (h ? `<span class="hl">${esc(h)}</span>` : "") + esc(b);
    fit(t, 420, 140, 72);

    const items = (D.items || []).slice(0, 5), n = items.length;
    const vf = n >= 5 ? 54 : n === 4 ? 66 : 74;
    const g = document.getElementById("grid");
    g.innerHTML = items.map((it, i) => {
      const wide = n % 2 === 1 && i === n - 1;
      const mh = n <= 3 ? (wide ? 170 : 300) : n === 4 ? 0 : 0;
      return `<div class="stat${wide ? " wide" : ""}" style="${mh ? `min-height:${mh}px` : ""}">
        ${wide ? "" : `<div class="num">${i + 1}</div>`}
        <div class="chip" style="background:${CHIP[i]}">${esc(it.label)}</div>
        <div class="val" style="font-size:${vf}px">${esc(it.value)}</div>
        ${wide ? "" : `<div class="bar" style="background:${BAR[i]}"></div>`}
      </div>`;
    }).join("");
    // Shrink any value wider than its card.
    g.querySelectorAll(".stat").forEach((s) => { const v = s.querySelector(".val"); let f = parseFloat(v.style.fontSize);
      while ((v.scrollWidth > s.clientWidth - 40 || s.scrollWidth > s.clientWidth + 1) && f > 40) { f -= 3; v.style.fontSize = f + "px"; } });
    document.getElementById("sub").textContent = D.sub || "";
    document.getElementById("meta").innerHTML = [D.source, D.date].filter(Boolean).map((x) => `<span>${esc(x)}</span>`).join("");
  }
  document.addEventListener("DOMContentLoaded", () => { render(); document.fonts && document.fonts.ready.then(render); });
</script>
</head>
<body>
  <div class="glow"></div>
  <div class="grain"></div>
  <div id="fl"></div>
  <div class="col">
    <div class="title-pill" id="tp"></div>
    <div class="title" id="title"></div>
    <div class="accent"></div>
    <div class="grid" id="grid"></div>
    <div class="sub" id="sub"></div>
    <div class="meta" id="meta"></div>
  </div>
</body>
</html>

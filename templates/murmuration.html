<html lang="id">

<style>
  /*
    Murmuration: a dusk sky over power lines and flooded rice paddies, seen as one
    silhouette photograph. Everything dark is ink (title, flock, wires, palms); the sky
    and its mirror in the sawah are the light.
    - The title is set like the silhouettes; the hl word is knocked out of a dense
      little flock of birds (the highlight IS a murmuration, not a colour).
    - The flock is a smooth S-teardrop: a thin stream of single birds arrives from the
      right (item 1) and swells into a folded body that tapers to a soft tail. Each item
      is one section of the flock, pinched apart and ringed by a dashed field-glass
      ellipse with a birder's tally that grows with the section.
    - The karaoke caption perches on the power lines word by word; the active word is
      the bird taking off. The source + date sit on the near dyke like a field-log entry.
    Scale up simple birds and a shape appears that no bird planned = emergent abilities.
  */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #C9B4A8; }
  body { position: relative; font-family: "Spectral", serif; color: #121212; }

  #sky, #flock, #land, #notes { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }

  /* kicker = an aluminium bird ring stamped with the series + episode */
  .ring { position: absolute; left: 90px; top: 290px; height: 50px; display: flex; align-items: center; gap: 16px; padding: 0 24px 0 14px;
          border-radius: 25px; white-space: nowrap; color: #121212;
          background: linear-gradient(180deg, #F3F2EE 0%, #DADCE0 42%, #B7BBC4 56%, #E4E5E2 100%);
          box-shadow: inset 0 0 0 2px #7D828D, 0 3px 0 rgba(18, 18, 18, 0.35);
          font: 600 27px "IBM Plex Mono", monospace; letter-spacing: 0.12em; text-transform: uppercase; }
  .ring i { flex: none; width: 3px; height: 50px; background: #7D828D; }

  .title { position: absolute; left: 90px; width: 900px; top: 364px; font-weight: 500; line-height: 1.08; letter-spacing: -0.018em; color: #121212; }
  .title .hl { display: inline-block; line-height: 0.8; color: #F4EFE6; white-space: nowrap; margin: 0 0.3em; }
  .title .bl { display: inline-block; width: 0; height: 0; }

  .it { position: absolute; left: 90px; display: flex; align-items: flex-start; gap: 14px; color: #121212; }
  .it .no { flex: none; width: 46px; height: 46px; margin-top: 2px; border: 2px solid #121212; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font: italic 500 30px "Spectral", serif; line-height: 1; padding-bottom: 3px; }
  .it .lb { font: 600 30px "IBM Plex Mono", monospace; letter-spacing: 0.03em; text-transform: uppercase; color: #1B2133; line-height: 1.12; white-space: nowrap; }
  .it .vl { font: 500 48px "Spectral", serif; line-height: 1.02; color: #121212; white-space: nowrap; }

  .tally { position: absolute; height: 42px; display: flex; align-items: center; padding: 0 11px; border-radius: 6px; white-space: nowrap;
           background: #F4EFE6; box-shadow: 0 2px 0 rgba(18, 18, 18, 0.55); font: 600 30px "IBM Plex Mono", monospace; letter-spacing: -0.02em; color: #121212; }

  /* caption: words perch on the power lines */
  .cap { position: absolute; left: 90px; width: 810px; }
  .cap span { position: absolute; left: 0; top: 0; display: inline-block; white-space: nowrap; line-height: 1; font: 500 44px "Spectral", serif; color: #464A56; }
  .cap .w-past { color: #121212; }
  .cap .w-on { color: #121212; font-style: italic; text-decoration: underline; text-decoration-thickness: 4px; text-underline-offset: 8px; }

  /* field-log entry on the near dyke */
  .log { position: absolute; left: 90px; width: 880px; font: 500 26px "IBM Plex Mono", monospace; line-height: 1.32; color: #121212; }
  .log b { font-weight: 600; }
</style>

<svg id="sky" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>

<div class="ring"><i></i><span id="kick"></span></div>
<div class="title" id="title"></div>

<script>
  // Built-in sample so the file also opens on its own.
  const D = window.D || { series: "Cara kerja AI", ep: "#01", kicker: "Cara kerja AI · #01",
    title: "AI nggak baca kata. Dia baca token.", hl: "token",
    sub: "Makanya AI kadang salah hitung huruf di kata \"strawberry\".",
    items: [{ label: "Ken·apa", value: "2 token" }, { label: "AI", value: "1 token" }, { label: "bisa", value: "1 token" }, { label: "ng·arang", value: "2 token" }],
    source: "ilustrasi — jumlah token beda tiap model", date: "per 14 Okt 2026" };

  const FONTS = ['500 100px Spectral', '400 100px Spectral', '500 44px Spectral', 'italic 500 44px Spectral', '500 48px Spectral',
                 'italic 500 30px Spectral', '600 30px "IBM Plex Mono"', '600 27px "IBM Plex Mono"', '500 26px "IBM Plex Mono"'];
  Promise.all(FONTS.map(f => document.fonts.load(f))).catch(() => {}).then(() => document.fonts.ready).then(render);

  function render() {
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const PEACH = "#E9C9A8", INK = "#121212", CREAM = "#F4EFE6", SIL = "#16171C";
  const HOR = 1404;                                      // horizon
  const items = (D.items || []).slice(0, 5);
  const n = Math.max(items.length, 1);

  // Seeded generator: same picture on every render.
  function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const R = rng(20261014);

  // colour helpers (sky gradient is shared by the sky and its mirror in the sawah)
  const hx = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const toHex = a => "#" + a.map(v => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, "0")).join("");
  const mix = (a, b, t) => { const A = hx(a), B = hx(b); return toHex(A.map((v, i) => v + (B[i] - v) * t)); };
  const STOPS = [[0, "#101726"], [160, "#1E2A44"], [290, "#4D5976"], [400, "#868CA2"], [560, "#A9A2A9"], [820, "#C9B3A8"], [1120, "#E0C2A7"], [HOR, "#EFD3B4"]];
  const skyAt = y => { for (let k = 1; k < STOPS.length; k++) if (y <= STOPS[k][0]) { const a = STOPS[k - 1], b = STOPS[k]; return mix(a[1], b[1], Math.max(0, (y - a[0]) / (b[0] - a[0]))); } return STOPS[STOPS.length - 1][1]; };

  // ---------- kicker ring + title ----------
  const ep = String(D.ep || "").trim();
  document.getElementById("kick").textContent = D.series ? D.series + (ep ? " · " + ep : "") : (D.kicker || "");
  const t = String(D.title || ""), hl = String(D.hl || "");
  const at = hl ? t.toLowerCase().indexOf(hl.toLowerCase()) : -1;
  const titleEl = document.getElementById("title");
  titleEl.innerHTML = at < 0 ? esc(t) : esc(t.slice(0, at)) + '<span class="hl" id="hl">' + esc(t.slice(at, at + hl.length)) + '<i class="bl" id="hlb"></i></span><span id="aft">' + esc(t.slice(at + hl.length)) + "</span>";
  for (let fs = 116; fs >= 72; fs -= 2) { titleEl.style.fontSize = fs + "px"; if (titleEl.offsetHeight <= 300 && titleEl.scrollWidth <= 900) break; }
  const TF = parseFloat(titleEl.style.fontSize);
  const T = 364 + titleEl.offsetHeight;                  // title bottom

  // ---------- power lines (needed early: the caption perches on them) ----------
  const PX = 46, WX1 = 1120;
  const wires = [{ x0: PX + 28, y0: 1238, y1: 1268, sag: 40 }, { x0: PX + 28, y0: 1306, y1: 1336, sag: 40 }];
  const wireY = (w, x) => { const u = (x - w.x0) / (WX1 - w.x0); return w.y0 + (w.y1 - w.y0) * u + w.sag * 4 * u * (1 - u); };
  const wireSlope = (w, x) => { const u = (x - w.x0) / (WX1 - w.x0); return ((w.y1 - w.y0) + w.sag * 4 * (1 - 2 * u)) / (WX1 - w.x0); };

  // ---------- karaoke caption, perched word by word on wire 1 and wire 2 ----------
  const cap = document.getElementById("cap");
  const capWords0 = String(D.caption || D.sub || "").split(/\s+/).filter(Boolean);
  const norm = s => s.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, "");
  const CX0 = 104, CX1 = 900;
  function activeIdx(words) {
    if (hl) { const hw = hl.split(/\s+/).map(norm).filter(Boolean); const k = words.findIndex(w => norm(w) && hw.includes(norm(w))); if (k >= 0) return k; }
    return 0;
  }
  function measure(words, fs) {
    const on = activeIdx(words);
    cap.innerHTML = words.map((w, i) => `<span class="${i < on ? "w-past" : i === on ? "w-on" : "w-next"}" style="font-size:${fs}px">${esc(w)}</span>`).join(" ");
    return [...cap.querySelectorAll("span")].map(s => s.offsetWidth);
  }
  function flow(widths, fs) {                            // words along the two wires; null when they do not fit
    const gap = 0.3 * fs; let wi = 0, x = CX0; const out = [];
    for (let i = 0; i < widths.length; i++) {

      out.push({ wire: wi, x, w: widths[i] }); x += widths[i] + gap;

      capWords = ws; placed = flow(measure(ws, 40), 40);
    }

  }
  const capOn = activeIdx(capWords);
  measure(capWords, capFs);
  // baseline offset inside a word box (line-height 1)
  const probe = document.createElement("span"); probe.style.cssText = `position:absolute;left:0;top:0;line-height:1;font:500 ${capFs}px Spectral;`;
  probe.innerHTML = 'Hg<i style="display:inline-block;width:0;height:0"></i>'; cap.appendChild(probe);
  const baseOff = probe.lastChild.getBoundingClientRect().top - probe.getBoundingClientRect().top; probe.remove();
  const LIFT = 16;
  const wordBoxes = [];
  const capSpans = [...cap.querySelectorAll("span")];
  (placed || []).forEach((p, i) => {
    const w = wires[p.wire], cx = p.x + p.w / 2, by = wireY(w, cx) - 2;
    const deg = Math.atan(wireSlope(w, cx)) * 180 / Math.PI, lift = i === capOn ? LIFT : 0;
    wordBoxes.push({ i, wire: p.wire, x: p.x, w: p.w, by, top: by - baseOff - lift, bot: by - baseOff - lift + capFs * 1.02, deg, lift });
  });
  const capTop = Math.min(...wordBoxes.map(b => b.top)) - 6, capBot = Math.max(...wordBoxes.map(b => b.bot)) + 6;
  cap.style.top = capTop + "px"; cap.style.height = (capBot - capTop) + "px";
  wordBoxes.forEach(b => {
    const s = capSpans[b.i];
    s.style.left = (b.x - 90) + "px"; s.style.top = (b.by - baseOff - capTop) + "px";
    s.style.transformOrigin = `${b.w / 2}px ${baseOff}px`;
    s.style.transform = `translateY(${-b.lift}px) rotate(${b.deg.toFixed(2)}deg)`;
  });
  capSpans.slice(wordBoxes.length).forEach(s => s.remove());

  // ---------- field-log entry (source + date) on the near dyke ----------
  const logEl = document.getElementById("log");
  logEl.innerHTML = (D.date ? `<b>${esc(D.date)}</b>` : "") + (D.date && D.source ? " · " : "") + (D.source ? "Sumber: " + esc(D.source) : "");
  const logBot = 1602, logTop = logBot - logEl.offsetHeight;
  logEl.style.top = logTop + "px";

  // ---------- items: field-notebook notes in the left margin ----------
  const box = document.getElementById("items");
  box.innerHTML = items.map((it, i) => `<div class="it" id="it${i}"><span class="no">${i + 1}</span><div><div class="lb">${esc(it.label)}</div><div class="vl">${esc(it.value)}</div></div></div>`).join("");
  const itEls = items.map((_, i) => document.getElementById("it" + i));
  const itH = itEls.map(e => e.offsetHeight), itW = itEls.map(e => e.offsetWidth);
  const colR = 90 + Math.max(0, ...itW);                 // right edge of the notes column

  // ---------- flock geometry: one smooth S-teardrop ----------
  // A thin stream arrives from the right edge just under the title (item 1), turns down and
  // swells into the body, which tapers to a soft tail above the wires.
  const Y0 = T + 58;
  const notesBot = Math.min(1180, capTop - 16);
  const Y1 = Math.min(1196, capTop - 22);
  const H = Y1 - Y0;
  const FL = Math.max(colR + 48, 440);                   // body keeps clear of the notes
  let Wm = 168, BX = FL + 230;
  function catmull(P) {
    const poly = [];
    for (let k = 0; k < P.length - 1; k++) {
      const p0 = P[Math.max(k - 1, 0)], p1 = P[k], p2 = P[k + 1], p3 = P[Math.min(k + 2, P.length - 1)];
      for (let j = 0; j < 60; j++) {
        const u = j / 60, u2 = u * u, u3 = u2 * u;
        poly.push([0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * u + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * u2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * u3),
                   0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * u + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * u2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * u3)]);
      }
    }
    poly.push(P[P.length - 1]);
    return poly;
  }
  let poly, cum, LEN, S1;
  function build() {
    // a crescent "(": the stream joins the top tip, the body bows towards the notes, the tail tip swings back right
    const P = [[1160, Y0 - 34], [1010, Y0 - 12], [BX + 150, Y0 + 14], [BX + 6, Y0 + 0.24 * H], [BX - 62, Y0 + 0.53 * H], [BX + 12, Y0 + 0.82 * H], [BX + 165, Y1]];
    poly = catmull(P);
    cum = [0];
    for (let k = 1; k < poly.length; k++) cum.push(cum[k - 1] + Math.hypot(poly[k][0] - poly[k - 1][0], poly[k][1] - poly[k - 1][1]));
    LEN = cum[cum.length - 1];
    S1 = cum[120] / LEN;                                 // the stream ends at control point 2
  }
  function at_(s) {                                      // point, unit tangent, unit normal at arc fraction s
    const d = Math.min(Math.max(s, 0), 1) * LEN;
    let k = 1; while (k < cum.length - 1 && cum[k] < d) k++;
    const a = poly[k - 1], b = poly[k], f = (d - cum[k - 1]) / ((cum[k] - cum[k - 1]) || 1);
    const tx = b[0] - a[0], ty = b[1] - a[1], tl = Math.hypot(tx, ty) || 1;
    return { x: a[0] + tx * f, y: a[1] + ty * f, tx: tx / tl, ty: ty / tl, nx: -ty / tl, ny: tx / tl };
  }
  const NB = Math.max(n - 1, 1);                         // body sections
  const borders = []; for (let j = 1; j < NB; j++) borders.push(j / NB);
  const pinch = u => { let p = 1; for (const b of borders) p *= 1 - Math.exp(-Math.pow((u - b) / 0.02, 2)); return p; };
  // half-width: soft at both ends, widest a little past the middle (a crescent ribbon)
  const halfW = u => 6 + (Wm - 6) * Math.pow(Math.sin(Math.PI * Math.pow(Math.min(Math.max(u, 0), 1), 1.12)), 0.8) + 14 * Math.pow(1 - u, 4);
  const wl = u => 1 + 0.10 * Math.sin(4.1 * u + 2.1), wr = u => 1 + 0.12 * Math.sin(5.3 * u + 0.6);
  const edgeX = (u, sg) => { const c = at_(S1 + (1 - S1) * u), w = halfW(u) * (sg > 0 ? wl(u) : wr(u)), lag = -w * 0.22; return c.x + c.nx * sg * w + c.tx * lag; };
  for (let it = 0; it < 4; it++) {                       // fit the body between the notes and the right edge
    build();
    let mn = 1e9, mx = -1e9;
    for (let k = 0; k <= 60; k++) for (const sg of [1, -1]) { const x = edgeX(k / 60, sg); mn = Math.min(mn, x); mx = Math.max(mx, x); }
    if (mn < FL - 1) BX += FL - mn;
    else if (mx > 1050 && Wm > 120) Wm = Math.max(120, Wm - (mx - 1050) / 2);
    else break;
  }
  build();

  // ---------- place notes next to their sections ----------
  const secMid = j => j === 0 ? at_(S1 * 0.55) : at_(S1 + (1 - S1) * (j - 0.5) / NB);
  const ys = [];
  { const lo = T + 34, gap = 12, m = items.length;
    const want = items.map((_, i) => secMid(i).y - itH[i] * 0.6);
    for (let i = 0; i < m; i++) ys.push(Math.max(want[i], i ? ys[i - 1] + itH[i - 1] + gap : lo));       // top-down
    for (let i = m - 1; i >= 0; i--) ys[i] = Math.min(ys[i], (i < m - 1 ? ys[i + 1] - gap : notesBot) - itH[i]); // bottom-up
    if (m && ys[0] < lo) {                               // over-full column: spread evenly
      const tot = itH.reduce((a, b) => a + b, 0), g = Math.max(4, (notesBot - lo - tot) / Math.max(m - 1, 1));
      let y = lo; for (let i = 0; i < m; i++) { ys[i] = y; y += itH[i] + g; }
    } }
  itEls.forEach((e, i) => { e.style.top = ys[i] + "px"; });

  // keep birds off the text
  const avoid = [];
  const pad = (x0, y0, x1, y1, p) => avoid.push([x0 - p, y0 - p, x1 + p, y1 + p]);
  itEls.forEach((e, i) => pad(90, ys[i], 90 + itW[i], ys[i] + itH[i], 14));
  pad(90, 364, 990, T, 4);
  wordBoxes.forEach(b => pad(b.x, b.top, b.x + b.w, b.bot, 10));
  const blocked = (x, y) => { for (const a of avoid) if (x > a[0] && x < a[2] && y > a[1] && y < a[3]) return true; return false; };

  // ---------- draw the flock ----------
  const cv = document.getElementById("flock"), dpr = window.devicePixelRatio || 1;
  cv.width = 1080 * dpr; cv.height = 1920 * dpr;
  const ctx = cv.getContext("2d"); ctx.scale(dpr, dpr);
  ctx.fillStyle = INK; ctx.strokeStyle = INK; ctx.lineCap = "round"; ctx.lineJoin = "round";
  const dots = [];                                       // kept for the reflection in the sawah
  const secPts = items.map(() => []);
  const wing = (x, y, a, tilt, lw) => { ctx.lineWidth = lw; ctx.beginPath(); ctx.moveTo(x - a, y - a * (0.55 + tilt)); ctx.lineTo(x, y); ctx.lineTo(x + a, y - a * (0.55 - tilt)); ctx.stroke(); };

  // item 1: the arriving stream, single birds as wing marks
  const FIRST = 120;
  { let placedN = 0, guard = 0;
    while (placedN < FIRST && guard++ < 4000) {
      const q = R(); if (R() > 0.55 + 0.45 * Math.sin(q * 23 + 0.9)) continue;      // loose clumps
      const s = S1 * (0.04 + 0.96 * q), c = at_(s), w = 7 + 15 * q;
      const v = (R() + R() - 1) * w;
      const x = c.x + c.nx * v + (R() - 0.5) * 10, y = c.y + c.ny * v;

      placedN++;
      ctx.globalAlpha = 0.92; wing(x, y, 4.4 + 1.8 * R() + 1.4 * (1 - q), (R() - 0.5) * 0.7, 2.1);
      dots.push([x, y, 1.6, 30]); if (secPts[0]) secPts[0].push([x, y]);
    } }

  const TOT = 19000, RATIO = 2.05;
  const wts = []; for (let j = 0; j < NB; j++) wts.push(Math.pow(RATIO, j));
  const wsum = wts.reduce((a, b) => a + b, 0);
  const counts = [FIRST].concat(wts.map(w => Math.round(TOT * w / wsum)));
  for (let j = 0; j < NB; j++) {
    const ulo = j / NB, uhi = (j + 1) / NB, cnt = counts[j + 1];
    let placedN = 0, guard = 0;
    while (placedN < cnt && guard++ < cnt * 60) {

      if (R() > w / Wm) continue;                        // area weighting
      const v = R() * 2 - 1;
      let a = (1 - Math.pow(Math.abs(v), 4)) * (0.55 + 0.45 * (1 - v * v));
      // one long fold: a curved crest that crosses the ribbon from the outer edge (top) to the inner edge (tail)
      const vf = 0.92 - 1.84 * Math.pow(u, 1.05), dv = v - vf;
      const fold = dv < 0 ? Math.exp(-Math.pow(dv / 0.06, 2)) + 0.22 * Math.exp(-Math.pow(dv / 0.3, 2)) : 0.3 * Math.exp(-Math.pow(dv / 0.05, 2));
      a *= (0.62 + 2.1 * fold) / 2.72 * (dv > 0 ? 0.85 : 1);

      <linearGradient id="g-water" gradientUnits="userSpaceOnUse" x1="0" y1="${HOR}" x2="0" y2="1920">${wst}</linearGradient>
      <radialGradient id="g-sun" gradientUnits="userSpaceOnUse" cx="360" cy="${HOR}" r="560" gradientTransform="translate(360 ${HOR}) scale(1.4 0.4) translate(-360 -${HOR})">
        <stop offset="0" stop-color="#F8E0C2" stop-opacity="0.9"/><stop offset="1" stop-color="#F8E0C2" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="1080" height="${HOR}" fill="url(#g-sky)"/>
    <rect y="${HOR}" width="1080" height="${1920 - HOR}" fill="url(#g-water)"/>
    <rect width="1080" height="1920" fill="url(#g-sun)"/>
    ${stars}
    <path d="M928,150 a30,30 0 1,0 34,38 a24,24 0 1,1 -34,-38 z" fill="${PEACH}" opacity="0.92"/>`;
  }
</script>

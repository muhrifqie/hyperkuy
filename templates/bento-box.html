<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=Shippori+Mincho:wght@600&family=IBM+Plex+Mono:wght@400;500&display=block" rel="stylesheet" />
<!--DATA-->
<style>
  /*
    Kotak Bento (g2-kotak-bento): a black lacquer bento box photographed from
    straight above on a dark table. Every item is one compartment: the label is
    a small cream paper slip pinned inside at a 2 degree tilt (Shippori Mincho),
    the value is the portion number on that slip (IBM Plex Mono). Compartment
    area is proportional to the value when every value is numeric. Contents are
    flat menu-illustration patterns (bars, discs, stripes, grid, ripples), never
    food drawings. The highlighted compartment has a red urushi floor; the only
    other red is the strap and the episode seal on the lid, which has been slid
    off and rests behind the box. A pair of chopsticks on the rim points at the
    highlighted compartment. Matte lacquer: no gloss highlight, no glow.

    Signature move (video, not animated here): the lid slides off (translate +
    rotate 3 degrees, shadow following), compartments fill one by one from above
    with a contact shadow, paper slips are pinned on at a tilt, and the
    chopsticks slide to point at the compartment being discussed.
  */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #1C1A19; }
  body { position: relative; color: #F1ECE2; font-family: "Zen Kaku Gothic New", sans-serif; }

  .top { position: absolute; left: 90px; right: 90px; top: 300px; display: flex; justify-content: space-between; align-items: baseline;
    font: 400 28px "IBM Plex Mono", monospace; color: #9B948A; letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; }
  .title { position: absolute; left: 90px; width: 900px; top: 352px; font: 700 88px/1.04 "Zen Kaku Gothic New", sans-serif; letter-spacing: -0.02em; color: #F1ECE2; }
  .title .hl { color: #B8382B; }

  /* table-top scene */
  .scene { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  .lid { position: absolute; left: 100px; top: 700px; width: 780px; height: 690px; background: #221E1C; border: 14px solid #2E2825; border-radius: 10px;
    transform: translate(90px, -70px) rotate(2.5deg); transform-origin: 50% 50%; box-shadow: 0 26px 40px rgba(0,0,0,.55); }
  .lid::before { content: ""; position: absolute; left: 18px; top: 18px; right: 18px; bottom: 18px; border: 1px solid #332C28; border-radius: 4px; }
  .lid .strap { position: absolute; top: -14px; bottom: -14px; width: 46px; left: 540px; background: #B8382B; }
  .lid .strap::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 0; border-top: 1px solid #8F2B21; }
  .lid .seal { position: absolute; right: 30px; top: 8px; width: 74px; height: 74px; border-radius: 50%; background: #B8382B; color: #F1ECE2;
    display: flex; align-items: center; justify-content: center; font: 500 26px "IBM Plex Mono", monospace; letter-spacing: -0.04em; }
  .lid .seal::after { content: ""; position: absolute; inset: 5px; border: 1.5px solid #F1ECE2; border-radius: 50%; opacity: .75; }

  .box { position: absolute; left: 100px; top: 700px; width: 780px; height: 690px; background: #302926; border-radius: 10px; padding: 14px;
    box-shadow: 0 24px 36px rgba(0,0,0,.6), inset 0 0 0 1px #3F3733; }
  .inner { position: relative; width: 100%; height: 100%; background: #3A332E; border-radius: 4px; }
  .comp { position: absolute; background: #14110F; overflow: hidden; }
  .comp.hl { background: #B8382B; }
  .comp svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .comp .paper { position: absolute; left: 18px; top: 18px; max-width: calc(100% - 44px); background: #F1ECE2; color: #1C1A19; padding: 10px 16px 12px;
    transform: rotate(-2deg); transform-origin: 0 0; box-shadow: 2px 3px 0 rgba(0,0,0,.45); }
  .comp .paper .lb { font: 600 30px/1.2 "Shippori Mincho", serif; }
  .comp .paper .vl { font: 500 38px/1.15 "IBM Plex Mono", monospace; margin-top: 4px; white-space: nowrap; }
  .comp.hl .paper .vl { color: #B8382B; }
  .comp .paper::before { content: ""; position: absolute; left: 50%; top: -5px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: #1C1A19; }

  /* chopsticks: two rods with lighter tips, rotated to point at the highlighted compartment */
  .sticks { position: absolute; left: 0; top: 0; width: 520px; height: 44px; transform-origin: 0 50%; }
  .sticks i { position: absolute; left: 0; height: 13px; width: 520px; background: #2B2421; border-radius: 3px 6px 6px 3px; box-shadow: 0 6px 8px rgba(0,0,0,.55); }
  .sticks i::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 70px; background: #8C8176; border-radius: 3px 0 0 3px; }
  .sticks i:nth-child(1) { top: 6px; }
  .sticks i:nth-child(2) { top: 26px; transform: rotate(1.2deg); transform-origin: 0 50%; }

  .sub { position: absolute; left: 90px; width: 810px; top: 1436px; font: 500 40px/1.3 "Zen Kaku Gothic New", sans-serif; color: #F1ECE2; }
  .foot { position: absolute; left: 90px; right: 90px; top: 1572px; font: 400 26px/1.4 "IBM Plex Mono", monospace; color: #9B948A; }
</style>
</head>
<body>
<div class="top"><span id="kick"></span><span id="date"></span></div>
<div class="title" id="title"></div>
<div class="scene">
  <div class="lid"><div class="strap"></div><div class="seal" id="seal"></div></div>
  <div class="box"><div class="inner" id="inner"></div></div>
  <div class="sticks" id="sticks"><i></i><i></i></div>
</div>
<div class="sub" id="sub"></div>
<div class="foot" id="foot"></div>
<script>
  // Fallback sample so the file also opens standalone in a browser.
  const D = window.D || { series: "AI dalam angka", ep: "#01", kicker: "AI dalam angka · #01",
    title: "1 chat ke AI = oven nyala 1 detik", hl: "1 detik",
    sub: "Kecil? Kalikan miliaran chat tiap hari.",
    items: [{ label: "Listrik per chat", value: "0,34 Wh" }, { label: "Setara oven", value: "±1 dtk" }, { label: "Chat per hari", value: "miliaran" }],
    source: "klaim OpenAI, Jun 2025", date: "per 14 Okt 2026" };
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const hlWrap = (t, h) => { const i = h ? t.toLowerCase().indexOf(h.toLowerCase()) : -1;
    return i < 0 ? esc(t) : esc(t.slice(0, i)) + `<span class="hl">${esc(t.slice(i, i + h.length))}</span>` + esc(t.slice(i + h.length)); };
  const num = (s) => { const m = String(s ?? "").match(/-?\d+(?:[.,]\d+)?/); return m ? Math.abs(parseFloat(m[0].replace(",", "."))) : null; };

  const items = (D.items || []).slice(0, 5);
  const n = items.length;

  document.getElementById("kick").textContent = D.kicker || [D.series, D.ep].filter(Boolean).join(" · ");
  document.getElementById("date").textContent = D.date || "";
  const titleEl = document.getElementById("title");
  titleEl.innerHTML = hlWrap(D.title || "", D.hl);
  document.getElementById("sub").textContent = D.sub || "";
  document.getElementById("foot").textContent = D.source ? `sumber: ${D.source}` : "";
  document.getElementById("seal").textContent = D.ep || "#01";

  /* ---------- which compartment is highlighted: label match, unique value match, else the largest ---------- */
  const h = String(D.hl || "").toLowerCase();
  const has = (s) => h && String(s ?? "").toLowerCase().includes(h);
  const raw = items.map((it) => num(it.value));
  const allNum = n > 0 && raw.every((v) => v !== null && v > 0);
  let w = allNum ? raw.slice() : items.map(() => 1);
  if (allNum) { const mean = w.reduce((a, b) => a + b, 0) / n; w = w.map((v) => Math.min(Math.max(v, mean * 0.6), mean * 2.2)); }
  let hlIdx = items.findIndex((it) => has(it.label));
  if (hlIdx < 0) { const m = items.map((it, i) => has(it.value) ? i : -1).filter((i) => i >= 0); if (m.length === 1) hlIdx = m[0]; }
  if (hlIdx < 0) hlIdx = w.indexOf(Math.max(...w));

  /* ---------- compartment layout: rows of 1..3 cells, row height and cell width proportional to weight ---------- */
  const inner = document.getElementById("inner");
  const W = inner.clientWidth, H = inner.clientHeight, GAP = 12;         // GAP = lacquer divider thickness
  const groups = { 1: [1], 2: [1, 1], 3: [1, 2], 4: [2, 2], 5: [2, 3] }[n] || [n];
  const sumW = w.reduce((a, b) => a + b, 0) || 1;
  const rects = []; let idx = 0, y = GAP;
  const rowsH = H - GAP * (groups.length + 1);
  groups.forEach((k) => {
    const rowItems = w.slice(idx, idx + k), rowSum = rowItems.reduce((a, b) => a + b, 0);
    const rh = Math.round(rowsH * rowSum / sumW);
    const cellsW = W - GAP * (k + 1); let x = GAP;
    rowItems.forEach((wi, j) => {
      const cw = j === k - 1 ? W - GAP - x : Math.round(cellsW * wi / rowSum);
      rects.push({ x, y, w: cw, h: rh, i: idx + j }); x += cw + GAP;
    });
    idx += k; y += rh + GAP;
  });
  // the last row absorbs rounding so the box floor is fully covered
  if (rects.length) { const last = rects.filter((r) => r.i >= idx - groups[groups.length - 1]); last.forEach((r) => { r.h = H - GAP - r.y; }); }

  /* ---------- flat contents: five menu-illustration patterns in muted warm tones ---------- */
  const fills = (hl) => hl ? ["#7A2419", "#5E1B12"] : ["#2B2521", "#3A322C"];
  const content = (k, hl, cw, ch) => {
    const [a, b] = fills(hl), id = `c${k}${hl ? "h" : ""}`;
    const pats = [
      `<pattern id="${id}" width="46" height="26" patternUnits="userSpaceOnUse"><ellipse cx="22" cy="13" rx="19" ry="9" fill="${b}"/><ellipse cx="22" cy="12" rx="14" ry="5" fill="${a}"/></pattern>`,   // discs
      `<pattern id="${id}" width="40" height="40" patternUnits="userSpaceOnUse"><rect x="4" y="4" width="32" height="12" fill="${b}"/><rect x="4" y="22" width="32" height="12" fill="${a}"/></pattern>`,  // stacked bars
      `<pattern id="${id}" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="24" fill="${b}"/></pattern>`,                                    // diagonal stripes
      `<pattern id="${id}" width="30" height="30" patternUnits="userSpaceOnUse"><rect x="3" y="3" width="24" height="24" fill="${b}"/><rect x="9" y="9" width="12" height="12" fill="${a}"/></pattern>`, // grid blocks
      `<pattern id="${id}" width="60" height="60" patternUnits="userSpaceOnUse"><circle cx="30" cy="30" r="26" fill="none" stroke="${b}" stroke-width="5"/><circle cx="30" cy="30" r="14" fill="none" stroke="${b}" stroke-width="5"/></pattern>`, // ripples
    ];
    // contents sit inside a margin so the lacquer floor shows around them, like a portion that does not touch the wall
    return `<svg viewBox="0 0 ${cw} ${ch}" preserveAspectRatio="none"><defs>${pats[k % 5]}</defs><rect x="14" y="14" width="${cw - 28}" height="${ch - 28}" rx="6" fill="url(#${id})"/></svg>`;
  };

  inner.innerHTML = rects.map((r) => {
    const it = items[r.i], hl = r.i === hlIdx;
    return `<div class="comp${hl ? " hl" : ""}" style="left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px">${content(r.i, hl, r.w, r.h)}
      <div class="paper"><div class="lb">${esc(it.label)}</div><div class="vl">${esc(it.value)}</div></div></div>`;
  }).join("");

  /* ---------- chopsticks: anchored bottom-right of the box, tip stops just inside the highlighted compartment ---------- */
  const hr = rects.find((r) => r.i === hlIdx) || rects[0];
  if (hr) {
    const box = document.querySelector(".box"), bx = box.offsetLeft + 14, by = box.offsetTop + 14;
    const cx = bx + hr.x + hr.w - 70, cy = by + hr.y + hr.h * 0.62;      // aim at the lower-right part of the compartment, away from every paper slip (top-left)
    const ax = 1030, ay = 1600;                                          // where the hand would be (outside the box, bottom right)
    const dx = cx - ax, dy = cy - ay, dist = Math.hypot(dx, dy);
    const inset = Math.min(hr.w, hr.h) * 0.22;                           // how far the tips reach into the compartment
    const tx = ax + dx * (dist - inset) / dist, ty = ay + dy * (dist - inset) / dist;
    const st = document.getElementById("sticks");
    st.style.left = tx + "px"; st.style.top = (ty - 22) + "px";
    st.style.transform = `rotate(${Math.atan2(ay - ty, ax - tx) * 180 / Math.PI}deg)`;
  }

  /* ---------- fit the title into at most 3 lines (min 62 px) ---------- */
  const fitTitle = () => {
    let fs = 88; titleEl.style.fontSize = fs + "px";
    while (titleEl.scrollHeight > fs * 1.04 * 3 + 4 && fs > 62) { fs -= 2; titleEl.style.fontSize = fs + "px"; }
  };
  fitTitle(); (document.fonts ? document.fonts.ready : Promise.resolve()).then(fitTitle);
</script>
</body>
</html>

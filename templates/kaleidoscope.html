<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Victor+Mono:wght@500;600&display=block" rel="stylesheet" />
<!--DATA-->
<style>
  /*
    Kaleidoscope: a brass kaleidoscope seen end-on (top, in the dark) and its
    object cell seen in profile (bottom, on the light table).
    The eyepiece view is a 12-fold mirror mandala built ONLY from the item chips:
    one 30-degree wedge holds the chips, two mirrors repeat it 12 times. Below,
    the same chips lie loose in the glass cell, each labelled with what it stands
    for. Metaphor: generative AI recombines pieces it has already seen; a new
    turn (seed) gives a "new" picture, but it never adds a chip it did not have.
    Deterministic: every chip position is hard-coded per item count (3/4/5).
  */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body { position: relative; background: #15161C; color: #15161C; font-family: "Fraunces", serif; }

  #art { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }

  .meta { position: absolute; left: 90px; right: 90px; top: 298px; display: flex; justify-content: space-between; align-items: baseline;
          font: 500 28px "Victor Mono", monospace; letter-spacing: 0.08em; text-transform: uppercase; color: #B9B1A2; }
  .meta b { font-weight: 600; color: #C9A15B; }

  .title { position: absolute; left: 90px; width: 900px; top: 352px; color: #F0E6D2; font-weight: 500;
           font-variation-settings: "opsz" 144; letter-spacing: -0.012em; line-height: 1.02; text-wrap: balance; }
  .title .hl { font-style: italic; font-weight: 600; color: #C9A15B; white-space: nowrap; }

  .col { position: absolute; text-align: center; }
  .col .lb { font: 500 30px "Victor Mono", monospace; line-height: 1.12; color: #3A3B44; overflow-wrap: anywhere; }
  .col .vl { font-weight: 600; font-variation-settings: "opsz" 72; line-height: 1.08; color: #15161C; margin-top: 6px; white-space: nowrap; }

  .cap { position: absolute; left: 90px; width: 900px; font-size: 44px; font-weight: 400; font-variation-settings: "opsz" 36;
         line-height: 1.24; color: #2C2D35; text-wrap: pretty; }
  .cap .w { display: inline; }
  .cap .on { font-style: italic; font-weight: 600; color: #15161C; background: #C9A15B; padding: 0 0.2em 0.04em;
             -webkit-box-decoration-break: clone; box-decoration-break: clone;
             clip-path: polygon(0.18em 0, 100% 0, calc(100% - 0.18em) 100%, 0 100%); }

  .foot { position: absolute; left: 90px; right: 90px; top: 1586px; display: flex; justify-content: space-between; gap: 36px;
          font: 500 26px "Victor Mono", monospace; color: #55534C; line-height: 1.25; }
  .foot span:last-child { white-space: nowrap; }
</style>
</head>
<body>
<svg id="art" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg" data-layout-allow-overlap data-layout-allow-overflow></svg>
<div class="meta" data-layout-allow-overlap><span id="kick"></span><span id="cell"></span></div>
<div class="title" id="title"></div>
<div id="cols"></div>
<div class="cap" id="cap" data-slot="caption"></div>
<div class="foot"><span id="src"></span><span id="date"></span></div>
<script>
  // Fallback sample so the file also opens standalone in a browser.
  const D = window.D || { series: "Cara kerja AI", ep: "#01", kicker: "Cara kerja AI · #01",
    title: "AI nggak baca kata. Dia baca token.", hl: "token",
    sub: "Makanya AI kadang salah hitung huruf di kata \"strawberry\".",
    items: [{ label: "Ken·apa", value: "2 token" }, { label: "AI", value: "1 token" }, { label: "bisa", value: "1 token" }, { label: "ng·arang", value: "2 token" }],
    source: "ilustrasi — jumlah token beda tiap model", date: "per 14 Okt 2026" };

  Promise.all(['500 100px Fraunces', 'italic 600 100px Fraunces', '600 44px Fraunces', '400 44px Fraunces', 'italic 600 44px Fraunces',
    '500 30px "Victor Mono"', '600 28px "Victor Mono"'].map(f => document.fonts.load(f))).catch(() => {})
    .then(() => document.fonts.ready).then(render);

  function render() {
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const INK = "#15161C", BRASS = "#C9A15B", RED = "#D8553B", BLUE = "#3C6FB4", CREAM = "#F0E6D2";
  const items = (D.items || []).slice(0, 5);
  const n = Math.max(3, Math.min(5, items.length || 3));
  const hl = (D.hl || "").trim();

  // ---------- header ----------
  const kick = D.kicker || [D.series, D.ep].filter(Boolean).join(" · ");
  document.getElementById("kick").textContent = kick;
  document.getElementById("cell").innerHTML = "Sel · <b>" + items.length + " keping</b>";

  // keep a lone operator (=, +, ->) on the line of the word it introduces
  const t = String(D.title || "").replace(/(^|\s)([=+×→–—])\s+/g, "$1$2 ");
  const at = hl ? t.toLowerCase().indexOf(hl.toLowerCase()) : -1;
  const titleEl = document.getElementById("title");
  titleEl.innerHTML = at < 0 ? esc(t) : esc(t.slice(0, at)) + '<span class="hl">' + esc(t.slice(at, at + hl.length)) + "</span>" + esc(t.slice(at + hl.length));
  for (let fs = 112; fs >= 72; fs -= 2) { titleEl.style.fontSize = fs + "px"; if (titleEl.offsetHeight <= 246) break; }
  const titleBottom = 352 + titleEl.offsetHeight;

  // ---------- active chip: first item mentioning hl, else the first ----------
  let active = items.findIndex(it => hl && (String(it.label) + " " + String(it.value)).toLowerCase().includes(hl.toLowerCase()));
  if (active < 0) active = 0;

  // ---------- caption (karaoke line) ----------
  const capText = String(D.caption || D.sub || "");
  const words = capText.split(/\s+/).filter(Boolean);
  let pos = 0;
  const ranges = words.map(w => { const s = capText.indexOf(w, pos); pos = s + w.length; return [s, pos]; });
  let act = [];
  const hi = hl ? capText.toLowerCase().indexOf(hl.toLowerCase()) : -1;
  if (hi >= 0) ranges.forEach((r, i) => { if (r[0] < hi + hl.length && r[1] > hi) act.push(i); });
  if (!act.length) act = [0];
  let capHTML = "";
  for (let i = 0; i < words.length; i++) {
    if (i === act[0]) { capHTML += '<span class="w on">' + esc(words.slice(act[0], act[act.length - 1] + 1).join(" ")) + "</span> "; i = act[act.length - 1]; continue; }
    capHTML += '<span class="w">' + esc(words[i]) + "</span> ";
  }
  const capEl = document.getElementById("cap");
  capEl.innerHTML = capHTML.trim();
  for (let fs = 46; fs >= 40; fs -= 1) { capEl.style.fontSize = fs + "px"; if (capEl.offsetHeight <= fs * 1.24 * 2 + 4) break; }
  document.getElementById("src").textContent = D.source ? "Sumber: " + D.source : "";
  document.getElementById("date").textContent = D.date || "";
  const footEl = document.querySelector(".foot");
  const footTop = 1616 - footEl.offsetHeight;
  footEl.style.top = footTop + "px";
  const CAP_BOTTOM = footTop - 18;
  const capTop = CAP_BOTTOM - capEl.offsetHeight;
  capEl.style.top = capTop + "px";

  // ---------- item columns under the cell ----------
  const CX0 = 110, CW = 860, colW = CW / n;
  const colsEl = document.getElementById("cols");
  colsEl.innerHTML = items.map((it, i) =>
    '<div class="col" style="left:' + (CX0 + i * colW + 4) + 'px;width:' + (colW - 8) + 'px"><div class="lb">' + esc(it.label) + '</div><div class="vl"><span>' + esc(it.value) + "</span></div></div>").join("");
  const cols = [...colsEl.children];
  cols.forEach(c => { const v = c.querySelector(".vl"), sp = v.firstChild; for (let fs = 46; fs >= 34; fs -= 1) { v.style.fontSize = fs + "px"; if (sp.getBoundingClientRect().width <= colW - 10) break; } });
  // equalise value baselines: all labels take the tallest label's height
  const lbH = Math.max(...cols.map(c => c.querySelector(".lb").offsetHeight));
  cols.forEach(c => c.querySelector(".lb").style.minHeight = lbH + "px");
  const colH = Math.max(...cols.map(c => c.offsetHeight));
  const colTop = capTop - 30 - colH;
  cols.forEach(c => c.style.top = colTop + "px");

  // ---------- geometry ----------
  const CELL_H = 116, cellCy = colTop - 22 - CELL_H / 2;           // the glass object cell (profile)
  const lensTop = titleBottom + 34, lensBot = cellCy - CELL_H / 2 - 30;
  const RO = Math.min(318, (lensBot - lensTop) / 2);                 // outer radius of the brass eyepiece
  const cx = 540, cy = lensTop + (lensBot - lensTop) / 2;
  const R = RO - 36;                                                // mirror view radius
  const k = R / 270;

  // dark (looking in) -> light (the table the cell lies on)
  document.body.style.background = "linear-gradient(180deg, #15161C 0px, #15161C " + Math.round(cy) + "px, #3A3129 " + Math.round(cy + RO * 0.62) + "px, #F0E6D2 " + Math.round(cellCy - CELL_H / 2 - 6) + "px, #F0E6D2 1920px)";

  // ---------- chip vocabulary (unit shapes, centred) ----------
  const SH = [
    { d: "M-0.48,-0.40 L0.52,-0.12 L-0.12,0.50 Z", f: "M-0.48,-0.40 L0.52,-0.12 L0.04,0.02 Z", c: RED },
    { d: "M0,-0.55 L0.30,0 L0,0.55 L-0.30,0 Z", f: "M0,-0.55 L0.30,0 L0,0 Z", c: BLUE },
    { d: "M-0.42,0 A0.42,0.42 0 1,0 0.42,0 A0.42,0.42 0 1,0 -0.42,0 Z M-0.13,0 A0.13,0.13 0 1,1 0.13,0 A0.13,0.13 0 1,1 -0.13,0 Z",
      f: "M-0.33,-0.16 A0.36,0.36 0 0,1 0.08,-0.35 L0.05,-0.25 A0.27,0.27 0 0,0 -0.24,-0.11 Z", c: BRASS },
    { d: "M-0.229,-0.399 A0.46,0.46 0 1,1 -0.229,0.399 A0.40,0.40 0 1,0 -0.229,-0.399 Z", f: "M-0.10,-0.44 A0.46,0.46 0 0,1 0.40,-0.20 L0.16,-0.10 A0.4,0.4 0 0,0 -0.10,-0.37 Z", c: CREAM },
    { d: "M-0.55,-0.11 L0.55,-0.11 A0.11,0.11 0 0,1 0.55,0.11 L-0.55,0.11 A0.11,0.11 0 0,1 -0.55,-0.11 Z", f: "M-0.48,-0.07 L0.48,-0.07 L0.48,-0.025 L-0.48,-0.025 Z", c: "glass" },
  ];
  // wedge layouts (r px, theta deg in the 0-30 wedge, size px, rotation deg) per item count, for R = 270
  const LAY = {
    5: [{ r: 168, t: 13, s: 104, a: 18 }, { r: 96, t: 23, s: 86, a: 64 }, { r: 236, t: 21, s: 60, a: 0 }, { r: 40, t: 9, s: 66, a: 28 }, { r: 226, t: 1, s: 124, a: 94 }],
    4: [{ r: 172, t: 12, s: 124, a: 18 }, { r: 100, t: 25, s: 98, a: 62 }, { r: 238, t: 22, s: 64, a: 0 }, { r: 44, t: 8, s: 76, a: 28 }],
    3: [{ r: 158, t: 13, s: 156, a: 20 }, { r: 64, t: 22, s: 112, a: 62 }, { r: 238, t: 21, s: 74, a: 0 }],
  };
  const lay = LAY[n];

  function chip(i, x, y, s, a, ctx) {
    const sh = SH[i];
    const glass = sh.c === "glass";
    const dark = ctx === "lens";
    const fill = glass ? (dark ? "rgba(240,230,210,0.30)" : "rgba(255,255,255,0.55)") : sh.c;
    const isAct = i === active;
    const stroke = dark ? (isAct ? CREAM : "rgba(10,10,14,0.55)") : INK;
    const sw = dark ? (isAct ? 2.6 : 1.4) : 2.4;
    return '<g transform="translate(' + x.toFixed(1) + "," + y.toFixed(1) + ") rotate(" + a + ") scale(" + s.toFixed(2) + ')">' +
      '<path d="' + sh.d + '" fill="' + fill + '" fill-rule="evenodd" fill-opacity="' + (glass ? 1 : 0.94) + '" stroke="' + stroke + '" stroke-width="' + sw + '" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>' +
      '<path d="' + sh.f + '" fill="#FFFFFF" fill-opacity="' + (glass ? 0.5 : 0.26) + '"/></g>';
  }

  // ---------- SVG ----------
  let s = "";
  s += '<defs>' +
    '<linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E9CF97"/><stop offset="0.28" stop-color="#C9A15B"/><stop offset="0.55" stop-color="#8C6A33"/><stop offset="0.78" stop-color="#C9A15B"/><stop offset="1" stop-color="#6B4F24"/></linearGradient>' +
    '<linearGradient id="body" gradientUnits="userSpaceOnUse" x1="' + (cx + 60) + '" y1="' + (cy - RO) + '" x2="' + (cx + 20) + '" y2="' + (cy + RO) + '"><stop offset="0" stop-color="#6B4F24"/><stop offset="0.35" stop-color="#B48C49"/><stop offset="0.5" stop-color="#E2C68D"/><stop offset="0.66" stop-color="#A57E3E"/><stop offset="1" stop-color="#4E3A1B"/></linearGradient>' +
    '<radialGradient id="lens" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#262833"/><stop offset="0.75" stop-color="#17181E"/><stop offset="1" stop-color="#0B0C10"/></radialGradient>' +
    '<linearGradient id="collar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E9CF97"/><stop offset="0.45" stop-color="#C9A15B"/><stop offset="1" stop-color="#7A5A2A"/></linearGradient>' +
    '<linearGradient id="glassbody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E9DEC8"/><stop offset="0.5" stop-color="#DCCFB4"/><stop offset="1" stop-color="#CDBFA2"/></linearGradient>' +
    '<clipPath id="wedge"><path d="M0,0 L' + (R + 2) + ',0 A' + (R + 2) + ',' + (R + 2) + ' 0 0,1 ' + ((R + 2) * Math.cos(30.4 * Math.PI / 180)).toFixed(2) + "," + ((R + 2) * Math.sin(30.4 * Math.PI / 180)).toFixed(2) + ' Z" transform="rotate(-0.2)"/></clipPath>' +
    '<clipPath id="disc"><circle cx="' + cx + '" cy="' + cy + '" r="' + R + '"/></clipPath>' +
    '<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>' +
    '</defs>';

  // tube body receding behind the eyepiece (2.5D), far end slightly smaller
  const dx = 150, dy = 86, r2 = RO * 0.7, L = Math.hypot(dx, dy), px = -dy / L, py = dx / L;
  const P = (x, y) => x.toFixed(1) + "," + y.toFixed(1);
  s += '<ellipse cx="' + (cx + dx + 30) + '" cy="' + (cy + RO + 18) + '" rx="' + (RO * 0.95) + '" ry="22" fill="#000" opacity="0.22" filter="url(#soft)"/>';
  s += '<path d="M' + P(cx + px * RO, cy + py * RO) + " L" + P(cx + dx + px * r2, cy + dy + py * r2) + " A" + r2 + "," + r2 + " 0 0,0 " + P(cx + dx - px * r2, cy + dy - py * r2) +
       " L" + P(cx - px * RO, cy - py * RO) + ' Z" fill="url(#body)"/>';

  // front brass ring + knurling
  s += '<circle cx="' + cx + '" cy="' + cy + '" r="' + RO + '" fill="url(#ring)" stroke="#4E3A1B" stroke-width="2"/>';
  let kn = "";
  for (let j = 0; j < 180; j++) {
    const an = j / 180 * Math.PI * 2, c = Math.cos(an), si = Math.sin(an);
    kn += "M" + P(cx + c * (RO - 13), cy + si * (RO - 13)) + "L" + P(cx + c * (RO - 1.5), cy + si * (RO - 1.5));
  }
  s += '<path d="' + kn + '" stroke="#3E2E14" stroke-width="2" opacity="0.5"/>';
  s += '<circle cx="' + cx + '" cy="' + cy + '" r="' + (RO - 15) + '" fill="none" stroke="#5A431F" stroke-width="2" opacity="0.7"/>';
  // six engraved sector notches (one per mirror pair)
  for (let j = 0; j < 6; j++) {
    const an = (-90 + j * 60) * Math.PI / 180, c = Math.cos(an), si = Math.sin(an), tc = -si, ts = c;
    const ro = RO - 17, ri = R + 10;
    s += '<path d="M' + P(cx + c * ro + tc * 6, cy + si * ro + ts * 6) + " L" + P(cx + c * ri, cy + si * ri) + " L" + P(cx + c * ro - tc * 6, cy + si * ro - ts * 6) + ' Z" fill="#3E2E14" opacity="0.75"/>';
  }
  s += '<circle cx="' + cx + '" cy="' + cy + '" r="' + (R + 8) + '" fill="#0B0C10" stroke="#2A2010" stroke-width="2"/>';
  s += '<circle cx="' + cx + '" cy="' + cy + '" r="' + R + '" fill="url(#lens)"/>';

  // the wedge: chips in the 0..30 degree sector between two mirrors
  let cell = "";
  lay.forEach((L0, i) => {
    if (i >= items.length) return;
    const th = L0.t * Math.PI / 180;
    cell += chip(i, L0.r * k * Math.cos(th), L0.r * k * Math.sin(th), L0.s * k, L0.a, "lens");
  });
  // the real sector + its 11 mirror images (all equal, so a 60-degree turn is invisible = loop seam)
  let man = '<defs><g id="cellw" clip-path="url(#wedge)">' + cell + "</g></defs><g>";
  for (let j = 1; j < 6; j++) man += '<use href="#cellw" transform="rotate(' + (j * 60) + ')"/>';
  for (let j = 0; j < 6; j++) man += '<use href="#cellw" transform="rotate(' + (j * 60) + ') scale(1,-1)"/>';
  man += '</g><use href="#cellw"/>';
  // outline of the real sector (the space between the two mirrors)
  const wa = 30 * Math.PI / 180;
  man += '<path d="M0,0 L' + (R - 3) + ',0 A' + (R - 3) + ',' + (R - 3) + ' 0 0,1 ' + P((R - 3) * Math.cos(wa), (R - 3) * Math.sin(wa)) + ' Z" fill="none" stroke="#F0E6D2" stroke-width="2.5" stroke-dasharray="9 7" stroke-linejoin="round" opacity="0.9"/>';
  // faint mirror joints
  let mir = "";
  for (let j = 0; j < 6; j++) { const an = j * 30 * Math.PI / 180; mir += "M" + P(-Math.cos(an) * R, -Math.sin(an) * R) + "L" + P(Math.cos(an) * R, Math.sin(an) * R); }
  s += '<g clip-path="url(#disc)"><g transform="translate(' + cx + "," + cy + ') rotate(-90)">' + man +
       '<path d="' + mir + '" stroke="#F0E6D2" stroke-width="1" opacity="0.07"/></g>' +
       // glass glare across the upper-left of the lens
       '<path d="M' + P(cx - R * 0.86, cy - R * 0.2) + " A" + R + "," + R + " 0 0,1 " + P(cx + R * 0.2, cy - R * 0.86) + " A" + (R * 1.25) + "," + (R * 1.25) + " 0 0,0 " + P(cx - R * 0.86, cy - R * 0.2) + ' Z" fill="#FFFFFF" opacity="0.05"/></g>';
  s += '<circle cx="' + cx + '" cy="' + cy + '" r="' + R + '" fill="none" stroke="#000" stroke-width="6" opacity="0.35"/>';

  // ---------- the object cell in profile: glass cylinder between brass collars ----------
  const top = cellCy - CELL_H / 2, bot = cellCy + CELL_H / 2;
  s += '<rect x="96" y="' + (bot - 6) + '" width="900" height="26" rx="13" fill="#15161C" opacity="0.10" filter="url(#soft)"/>';
  s += '<rect x="112" y="' + top + '" width="856" height="' + CELL_H + '" fill="url(#glassbody)" stroke="' + INK + '" stroke-width="2.5"/>';
  s += '<rect x="122" y="' + (top + 12) + '" width="836" height="7" rx="3.5" fill="#FFFFFF" opacity="0.6"/>';
  s += '<rect x="122" y="' + (bot - 20) + '" width="836" height="10" rx="5" fill="#15161C" opacity="0.06"/>';
  // collars (left: frosted end window, right: joins the tube that runs off the frame)
  s += '<rect x="996" y="' + (cellCy - 40) + '" width="90" height="80" fill="url(#collar)" stroke="' + INK + '" stroke-width="2.5"/>';
  [[76, 44], [964, 44]].forEach(([x, w]) => {
    s += '<rect x="' + x + '" y="' + (top - 12) + '" width="' + w + '" height="' + (CELL_H + 24) + '" rx="6" fill="url(#collar)" stroke="' + INK + '" stroke-width="2.5"/>';
    let kk = "";
    for (let j = 1; j < 9; j++) kk += "M" + (x + j * w / 9).toFixed(1) + "," + (top - 6) + "V" + (bot + 6);
    s += '<path d="' + kk + '" stroke="#5A431F" stroke-width="1.6" opacity="0.55"/>';
  });

  // loose chips lying in the cell, one per item column
  const tilt = [12, -18, 0, 34, -8];
  items.forEach((it, i) => {
    const x = CX0 + (i + 0.5) * colW, y = cellCy + 4;
    const sz = i === 4 ? 92 : 80;
    s += chip(i, x, y, sz, tilt[i], "cell");
    if (i === active) s += '<circle cx="' + x + '" cy="' + y + '" r="50" fill="none" stroke="' + INK + '" stroke-width="3" stroke-dasharray="7 7"/>';
    // leader tick from cell to label
    s += '<path d="M' + x + "," + (bot + 6) + "V" + (colTop - 6) + '" stroke="' + INK + '" stroke-width="2"/>';
  });

  document.getElementById("art").innerHTML = s;

  }
</script>
</body>
</html>

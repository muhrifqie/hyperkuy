<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<link href="https://fonts.googleapis.com/css2?family=Rammetto+One&family=Caveat+Brush&family=Patrick+Hand&display=block" rel="stylesheet" />
<!--DATA-->
<style>
  /*
    Jamu Basket (jamu-basket): a jamu seller's corner on a sunlit, whitewashed warung
    wall. A painted signboard hangs on two strings; below it the bottles have been lifted
    out of the woven bakul and tipped over one big ribbed glass that is already brimming.
    Metaphor: model merging - a new model is blended from the weights of a few existing
    models in set shares, like jamu mixed to order, instead of being trained from scratch.
    Items = bottles; each one carries a hand-lettered sticker label along its body
    (label = model / part, value = its share). hl = the bottle pouring the most:
    turmeric brew, the only thick stream, its value ringed in turmeric marker.
    Title = the signboard (sign-painter lettering, hl repainted in turmeric).
    Caption = a resep scribbled on a sheet torn from a school exercise book.
    Fully deterministic: hard-coded shapes, no randomness.
  */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #F1EBDD; }
  body { position: relative; color: #2A1F18; }
  #scene { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }

  /* ---------- hanging signboard ---------- */
  .sign { position: absolute; left: 74px; width: 932px; top: 300px; padding: 30px 52px 26px; text-align: center; border-radius: 12px;
          color: #F6E8C9; transform: rotate(-0.35deg); transform-origin: 50% 0;
          background:
            repeating-linear-gradient(179deg, rgba(255, 236, 214, 0.035) 0 3px, transparent 3px 13px),
            linear-gradient(100deg, #A1352B 0%, #8E2A22 46%, #84251E 100%);
          box-shadow: 0 9px 0 #5A1A14, 0 9px 0 1px rgba(60, 18, 12, 0.5); }
  .sign::before { content: ""; position: absolute; inset: 13px; border: 3px solid rgba(246, 232, 201, 0.8); border-radius: 10px; pointer-events: none; }
  .sign.tight { padding-top: 22px; padding-bottom: 18px; }
  .sign.tight .title { margin: 6px 0 8px; }
  .kick { font: 400 28px "Rammetto One", serif; letter-spacing: 0.07em; line-height: 1.2; color: #F2C462; text-transform: uppercase; white-space: nowrap; }
  .kick i { display: inline-block; width: 12px; height: 12px; background: #F2C462; transform: rotate(45deg); margin: 0 18px; vertical-align: 0.16em; }
  .title { font-family: "Rammetto One", serif; font-weight: 400; line-height: 1.12; letter-spacing: -0.01em; margin: 12px 0 14px; color: #F6E8C9; text-wrap: balance;
           text-shadow: 1px 1px 0 #4B1410, 2px 2px 0 #4B1410, 3px 3px 0 #4B1410, 4px 4px 0 #4B1410, 5px 5px 0 #4B1410; }
  .title .hl { color: #F2AB24; }
  .date { font: 400 26px "Rammetto One", serif; letter-spacing: 0.06em; line-height: 1.2; color: #F2C462; text-transform: uppercase; white-space: nowrap; }

  /* ---------- sticker labels on the bottles ---------- */
  .lab { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: #2A1F18; border-radius: 12px; padding: 11px 22px 12px;
         background: linear-gradient(to bottom, #ECE6D8 0%, #FFFDF6 24%, #FFFDF6 70%, #E9E2D2 100%); }
  .lab::before { content: ""; position: absolute; inset: 6px; border: 2.5px solid #3A64AE; border-radius: 8px; pointer-events: none; }
  .lab .lb { font: 400 35px "Caveat Brush", cursive; line-height: 1.14; }
  .lab .vl { position: relative; display: inline-block; font: 400 46px "Caveat Brush", cursive; line-height: 1.1; white-space: nowrap; margin-top: 2px; }
  .lab.hl .vl { color: #A3302A; }
  .ring { position: absolute; pointer-events: none; overflow: visible; }

  /* ---------- torn exercise-book sheet with the caption ---------- */
  .sheetw { position: absolute; left: 78px; width: 924px; filter: drop-shadow(10px 14px 9px rgba(96, 68, 38, 0.30)); transform: rotate(-0.7deg); }
  .sheet { position: relative; padding: 20px 34px 8px 100px; color: #1F2B57;
           background:
             linear-gradient(to right, transparent 70px, #DE7F78 70px 72.5px, transparent 72.5px 77px, #DE7F78 77px 79.5px, transparent 79.5px),
             linear-gradient(to bottom, transparent 0 45px, #AFC3E4 45px 47.5px, transparent 47.5px) 0 20px / 100% 52px repeat-y,
             #FCFAF3;
           clip-path: polygon(0 9px, 2.5% 4px, 5% 10px, 7.5% 5px, 10% 11px, 13% 4px, 16% 9px, 19% 3px, 22% 10px, 25% 5px, 28% 9px, 31% 3px, 34% 10px, 37% 6px, 40% 11px, 43% 4px, 46% 9px, 49% 3px, 52% 10px, 55% 5px, 58% 11px, 61% 4px, 64% 9px, 67% 3px, 70% 10px, 73% 5px, 76% 9px, 79% 3px, 82% 10px, 85% 5px, 88% 11px, 91% 4px, 94% 9px, 97% 3px, 100% 8px, 100% 100%, 0 100%); }
  .cap { position: relative; font: 400 46px "Patrick Hand", cursive; line-height: 52px; letter-spacing: 0.005em; text-wrap: balance; }
  .cap .w { color: #56638C; }
  .cap .w.done { color: #1F2B57; }
  .cap .w.on { position: relative; color: #1F2B57; }
  .src { font: 400 27px "Patrick Hand", cursive; line-height: 36px; color: #4A4F66; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
</style>
</head>
<body>
<svg id="scene" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg>
<div class="sign" id="sign"><div class="kick" id="kick"></div><div class="title" id="title"></div><div class="date" id="date"></div></div>
<div id="labs"></div>
<div class="sheetw" id="sheetw"><div class="sheet" id="sheet"><div class="cap" id="cap" data-slot="caption"></div><div class="src" id="src"></div></div></div>
<script>
  // Fallback sample so the file also opens standalone in a browser.
  const D = window.D || { series: "Cara kerja AI", ep: "#01", kicker: "Cara kerja AI · #01",
    title: "AI nggak baca kata. Dia baca token.", hl: "token",
    sub: "Makanya AI kadang salah hitung huruf di kata \"strawberry\".",
    items: [{ label: "Ken·apa", value: "2 token" }, { label: "AI", value: "1 token" }, { label: "bisa", value: "1 token" }, { label: "ng·arang", value: "2 token" }],
    source: "ilustrasi — jumlah token beda tiap model", date: "per 14 Okt 2026" };

  Promise.all(['400 90px "Rammetto One"', '400 46px "Caveat Brush"', '400 46px "Patrick Hand"'].map(f => document.fonts.load(f)))
    .catch(() => {}).then(() => document.fonts.ready).then(render);

  function render() {
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const f1 = v => Math.round(v * 10) / 10;
  const rad = a => a * Math.PI / 180;
  const TURM = "#E8A11C", SECANG = "#A23128", BLUE = "#2F5DA8", INK = "#2A1F18";
  // hand-drawn marker loop (viewBox 0 0 100 40), shared by the hl label value and the active caption word
  const LOOP = "M10 25 C4 12 30 3 56 4 C80 5 98 11 96 22 C94 34 68 39 44 38 C20 37 3 31 5 19 C7 10 24 6 38 6";
  const ringSvg = (x, y, w, h, sw) => `<svg class="ring" style="left:${f1(x)}px;top:${f1(y)}px;width:${f1(w)}px;height:${f1(h)}px" viewBox="0 0 100 40" preserveAspectRatio="none"><path d="${LOOP}" fill="none" stroke="${TURM}" stroke-width="${sw}" stroke-linecap="round" vector-effect="non-scaling-stroke" opacity="0.92"/></svg>`;

  // ---------- sign: kicker + date (the title is fitted after the bottles know their room) ----------
  const ep = String(D.ep || "").trim();
  const ser = String(D.series || D.kicker || "").trim();
  $("kick").innerHTML = "<i></i>" + esc(ser) + (ep && !ser.includes(ep) ? " · " + esc(ep) : "") + "<i></i>";
  $("date").textContent = D.date || "";
  const t = String(D.title || ""), hl = String(D.hl || "").trim();
  const at = hl ? t.toLowerCase().indexOf(hl.toLowerCase()) : -1;
  const titleEl = $("title");
  titleEl.innerHTML = at < 0 ? esc(t) : esc(t.slice(0, at)) + '<span class="hl"' + (hl.length <= 18 ? ' style="white-space:nowrap"' : '') + '>' + esc(t.slice(at, at + hl.length)) + "</span>" + esc(t.slice(at + hl.length));

  // ---------- items: which bottle pours the most ----------
  const items = (D.items && D.items.length ? D.items : [{ label: "model A", value: "50%" }, { label: "model B", value: "30%" }, { label: "model C", value: "20%" }]).slice(0, 5);
  const n = items.length;
  const num = v => { const m = String(v || "").replace(/\./g, "").replace(",", ".").match(/-?\d+(\.\d+)?/); return m ? parseFloat(m[0]) : NaN; };
  const unit = v => String(v || "").replace(/[±~≈\d.,\s%-]+/, "").trim().toLowerCase();
  const nums = items.map(it => num(it.value));
  // hl: among the items that mention D.hl, the one with the biggest value (ties: first); else the biggest value; else the first
  const pick = idx => { let b = -1, bv = -Infinity; idx.forEach(i => { const v = isNaN(nums[i]) ? -1e9 : nums[i]; if (v > bv) { bv = v; b = i; } }); return b; };
  let hi = -1;
  if (hl) { const m = items.map((it, i) => i).filter(i => (String(items[i].label) + " " + String(items[i].value)).toLowerCase().includes(hl.toLowerCase())); if (m.length) hi = pick(m); }
  if (hi < 0 && nums.some(v => !isNaN(v))) hi = pick(items.map((it, i) => i));
  if (hi < 0) hi = 0;
  // stream width: the hl stream is the only thick one; the rest scale a little with the share when they share a unit
  const sameUnit = n > 1 && nums.every(v => !isNaN(v) && v > 0) && items.every(it => unit(it.value) === unit(items[0].value));
  const maxV = Math.max(...nums.filter(v => !isNaN(v)), 1);
  const width = items.map((it, i) => i === hi ? 32 : sameUnit ? 7 + 5 * nums[i] / maxV : 9);
  // brews: hl = turmeric (kunyit asam); the rest secang, beras kencur, cabe puyang, temulawak
  const OTHERS = [[SECANG, "#6E1C16"], ["#E9D8AA", "#A88C5A"], ["#7D4B25", "#4A2A12"], ["#D57F2A", "#8E4E14"]];
  let oi = 0;
  const brew = items.map((it, i) => i === hi ? [TURM, "#A86A08"] : OTHERS[oi++ % OTHERS.length]);
  // rows alternate sides, top to bottom: L, R, L, R, L (the left gets the extra row: the right is fenced by the action buttons)
  const side = items.map((it, i) => i % 2 === 0 ? "L" : "R");

  // ---------- sticker labels: measured first, they size the bottles ----------
  const labsEl = $("labs");
  labsEl.innerHTML = items.map((it, i) => '<div class="lab' + (i === hi ? " hl" : "") + '" id="lab' + i + '"><div class="lb">' + esc(it.label) + '</div><div class="vl" id="vl' + i + '">' + esc(it.value) + "</div></div>").join("");
  const MAXW = { L: 330, R: 286 }, MINW = 176;
  const FS = n <= 3 ? [37, 50] : n === 4 ? [35, 46] : [33, 42];
  let labW = {}, labH = 0;
  function measureLabels(lbFs, vlFs) {
    const nat = { L: MINW, R: MINW };
    items.forEach((it, i) => {
      const el = $("lab" + i);
      el.style.width = "auto"; el.style.height = "auto"; el.style.maxWidth = MAXW[side[i]] + "px";
      el.querySelector(".lb").style.fontSize = lbFs + "px";
      const vl = $("vl" + i);
      for (let fs = vlFs; fs >= 38; fs -= 2) { vl.style.fontSize = fs + "px"; if (vl.offsetWidth <= MAXW[side[i]] - 44) break; }
      nat[side[i]] = Math.max(nat[side[i]], Math.ceil(el.getBoundingClientRect().width));
    });
    labW = { L: Math.min(MAXW.L, nat.L), R: Math.min(MAXW.R, nat.R) };
    labH = 0;
    items.forEach((it, i) => { const el = $("lab" + i); el.style.width = labW[side[i]] + "px"; labH = Math.max(labH, el.offsetHeight); });
    items.forEach((it, i) => { $("lab" + i).style.height = labH + "px"; });
  }

  // ---------- bottle geometry ----------
  // local frame: base at (0,0), mouth at (0,-L); a bottle is placed by its mouth (mx,my) and tilt a (deg, clockwise from upright)
  function bottle(lw, lh) {
    const w = lh / 2 + 12, bodyLen = lw + 54, shL = w * 0.9, neckW = Math.max(15, w * 0.29), neckLen = 46, lipW = neckW + 5, lipH = 12, r = 12;
    const L = bodyLen + shL + neckLen + lipH;
    const d = `M${f1(-w + r)} 0 Q${f1(-w)} 0 ${f1(-w)} ${-r} L${f1(-w)} ${f1(-bodyLen)} C${f1(-w)} ${f1(-bodyLen - shL * 0.62)} ${f1(-neckW)} ${f1(-bodyLen - shL * 0.5)} ${f1(-neckW)} ${f1(-bodyLen - shL)}` +
      ` L${f1(-neckW)} ${f1(-(L - lipH))} L${f1(-lipW)} ${f1(-(L - lipH))} L${f1(-lipW)} ${f1(-L + 3)} Q${f1(-lipW)} ${f1(-L)} ${f1(-lipW + 3)} ${f1(-L)}` +
      ` L${f1(lipW - 3)} ${f1(-L)} Q${f1(lipW)} ${f1(-L)} ${f1(lipW)} ${f1(-L + 3)} L${f1(lipW)} ${f1(-(L - lipH))} L${f1(neckW)} ${f1(-(L - lipH))}` +
      ` L${f1(neckW)} ${f1(-bodyLen - shL)} C${f1(neckW)} ${f1(-bodyLen - shL * 0.5)} ${f1(w)} ${f1(-bodyLen - shL * 0.62)} ${f1(w)} ${f1(-bodyLen)} L${f1(w)} ${-r} Q${f1(w)} 0 ${f1(w - r)} 0 Z`;
    const outline = [[-w, 0], [w, 0], [-w, -bodyLen], [w, -bodyLen], [-neckW, -bodyLen - shL], [neckW, -bodyLen - shL], [-lipW, -L], [lipW, -L]];
    return { L, w, bodyLen, shL, neckW, lipW, lipH, d, outline };
  }
  const toW = (B, mx, my, a, px, py) => { const c = Math.cos(rad(a)), s = Math.sin(rad(a)), x = px, y = py + B.L; return [mx + x * c - y * s, my + x * s + y * c]; };
  const TILT = { L: 97, R: -97 };
  const setTilt = d => { TILT.L = d; TILT.R = -d; };
  const tiltOf = i => TILT[side[i]] + (i === hi ? (side[i] === "L" ? 6 : -6) : 0);
  const rotOf = i => side[i] === "L" ? tiltOf(i) - 90 : tiltOf(i) + 90; // label text runs along the bottle and reads left to right
  // boxes relative to the mouth at (0,0)
  function boxes(i, B) {
    const a = tiltOf(i);
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    B.outline.forEach(p => { const q = toW(B, 0, 0, a, p[0], p[1]); x0 = Math.min(x0, q[0]); x1 = Math.max(x1, q[0]); y0 = Math.min(y0, q[1]); y1 = Math.max(y1, q[1]); });
    const c = toW(B, 0, 0, a, 0, -B.bodyLen / 2), r = rad(rotOf(i)), lw = labW[side[i]];
    const hx = lw / 2 * Math.abs(Math.cos(r)) + labH / 2 * Math.abs(Math.sin(r)), hy = lw / 2 * Math.abs(Math.sin(r)) + labH / 2 * Math.abs(Math.cos(r));
    return { b: [x0, x1, y0, y1], l: [c[0] - hx, c[0] + hx, c[1] - hy, c[1] + hy], c };
  }

  // ---------- glass, basket, bench (fixed) ----------
  const GT = 1162, GB = 1442, GTR = 142, GBR = 110, GRY = 21, GBRY = 15;
  const BENCH_Y = 1372, BX = 540, RIM_Y = 1250, BRX = 404, BRY = 44, BASE_Y = 1420, BBX = 348, BBY = 30;
  const MOUTH_MAX = GT - 62, LAB_MAX = GT - 14;

  // ---------- vertical solver ----------
  // same-side bottles stack without touching; rows step down in item order; the lowest mouth stays above
  // the glass so every stream shows; no label may come down to the rim (the glass is a no-go zone).
  let B = {}, BX_ = [], mx = [], GX = 540;
  function layout(lbFs, vlFs, GAP, STEP, tilt) {
    setTilt(tilt);
    measureLabels(lbFs, vlFs);
    B = { L: bottle(labW.L, labH), R: bottle(labW.R, labH) };
    BX_ = items.map((it, i) => boxes(i, B[side[i]]));
    // mouths: labels pinned inside x 92..898 (the right side is fenced by the action buttons)
    mx = items.map((it, i) => side[i] === "L" ? 92 - BX_[i].l[0] : 898 - BX_[i].l[1]);
    const mL = items.map((it, i) => i).filter(i => side[i] === "L").map(i => mx[i]);
    const mR = items.map((it, i) => i).filter(i => side[i] === "R").map(i => mx[i]);
    GX = Math.max(492, Math.min(588, ((mL.length ? Math.min(...mL) : 540) + (mR.length ? Math.max(...mR) : 540)) / 2));
    // keep the mouths over the glass opening
    mx = mx.map((x, i) => side[i] === "L" ? Math.min(x, GX + 86) : Math.max(x, GX - 86));
    // relative rows (objTop = 0)
    const top = BX_.map(b => Math.min(b.b[2], b.l[2])), bot = BX_.map(b => Math.max(b.b[3], b.l[3]));
    const Y = [];
    for (let i = 0; i < n; i++) {
      let y = i === 0 ? -top[0] : Y[i - 1] + STEP;
      for (let j = i - 1; j >= 0; j--) if (side[j] === side[i]) { y = Math.max(y, Y[j] + bot[j] + GAP - top[i]); break; }
      Y.push(y);
    }
    const need = Math.max(...Y.map((y, i) => Math.max(y - MOUTH_MAX, y + BX_[i].l[3] - LAB_MAX)));
    return { Y, need, top, bot };
  }
  // the sign at its smallest decides how tight the bottles must pack (long titles need a third line)
  const signEl = $("sign");
  const TW = 828, TITLE_MIN = 56;
  const signAt = fs => { titleEl.style.fontSize = fs + "px"; return 300 + signEl.offsetHeight + 9; };
  let signMin = signAt(TITLE_MIN);
  if (signMin > 640) { signEl.classList.add("tight"); signMin = signAt(TITLE_MIN); }
  const tries = [[FS[0], FS[1], 16, 56, 97], [FS[0], FS[1], 8, 46, 97], [32, 40, 8, 46, 96], [31, 38, 6, 42, 95], [30, 36, 3, 38, 94]];
  let L;
  for (const tr of tries) { L = layout(...tr); if (-L.need - 24 >= signMin || tr === tries[tries.length - 1]) break; }
  const signBottomMax = Math.min(-L.need - 24, n <= 3 ? 700 : 680);

  // ---------- fit the title on the sign ----------
  for (let fs = 104; fs >= TITLE_MIN; fs -= 2) {
    titleEl.style.fontSize = fs + "px";
    if (300 + signEl.offsetHeight + 9 <= signBottomMax && titleEl.scrollWidth <= TW) break;
  }
  const signBottom = 300 + signEl.offsetHeight + 9;

  // ---------- place the rows, spreading spare room ----------
  const objTop = signBottom + 24;
  let Y = L.Y.map(y => y + objTop);
  const spare = -L.need - objTop; // >= 0 when everything fits
  if (spare > 0 && n > 1) {
    const s = Math.min(spare, 300);
    Y = Y.map((y, i) => y + s * 0.3 + s * 0.7 * i / (n - 1));
  }

  // ---------- caption on the exercise-book sheet ----------
  const capEl = $("cap");
  const cap = String(D.caption || D.sub || "").trim();
  let words = cap.split(/\s+/).filter(Boolean);
  const norm = w => w.toLowerCase().replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu, "");
  let s0 = -1, s1 = -1;
  if (hl) {
    const hw = hl.split(/\s+/).map(norm).filter(Boolean);
    for (let i = 0; i + hw.length <= words.length && s0 < 0; i++) {
      if (hw.every((h, k) => norm(words[i + k]) === h || (hw.length === 1 && norm(words[i]).includes(h)))) { s0 = i; s1 = i + hw.length - 1; }
    }
  }
  if (s0 < 0) { s0 = 0; s1 = 0; }
  function capHtml(ws, cut) {
    const parts = [];
    for (let i = 0; i < ws.length; i++) {
      const last = cut && i === ws.length - 1 ? "…" : "";
      if (i === s0) { parts.push('<span class="w on" id="won">' + esc(ws.slice(s0, Math.min(s1, ws.length - 1) + 1).join(" ")) + last + "</span>"); i = s1; continue; }
      parts.push('<span class="w' + (i < s0 ? " done" : "") + '">' + esc(ws[i]) + last + "</span>");
    }
    return parts.join(" ");
  }
  capEl.innerHTML = capHtml(words, false);
  let capFs = 46;
  for (; capFs >= 40; capFs -= 2) { capEl.style.fontSize = capFs + "px"; if (capEl.offsetHeight <= 52 * 2 + 2) break; }
  capFs = Math.max(capFs, 40); capEl.style.fontSize = capFs + "px";
  // still more than 2 lines at 40 px: trim words and end with an ellipsis (never drop the active word)
  let ws = words.slice();
  while (capEl.offsetHeight > 52 * 2 + 2 && ws.length > s1 + 2) { ws.pop(); capEl.innerHTML = capHtml(ws, true); }
  $("src").textContent = D.source ? "sumber: " + D.source : "";
  const sheetw = $("sheetw");
  const SHEET_B = 1628;
  const sheetTop = Math.max(GB + 14, SHEET_B - sheetw.offsetHeight);
  sheetw.style.top = sheetTop + "px";
  // turmeric marker loop around the active word
  const won = $("won");
  if (won) {
    const x = won.offsetLeft, y = won.offsetTop, w = won.offsetWidth, h = won.offsetHeight;
    capEl.insertAdjacentHTML("beforeend", ringSvg(x - 18, y - 2, w + 36, h + 8, 5));
  }

  // ---------- SVG scene ----------
  let S = `<defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EEE7D8"/><stop offset="0.5" stop-color="#F3EDE1"/><stop offset="1" stop-color="#E9E0CE"/></linearGradient>
    <linearGradient id="bench" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9C7547"/><stop offset="0.1" stop-color="#B98E5C"/><stop offset="0.55" stop-color="#CFA874"/><stop offset="1" stop-color="#D9B786"/></linearGradient>

  S += `<path d="M${GX - GBR + 2} ${GB - 22} A${GBR - 2} ${GBRY} 0 0 0 ${GX + GBR - 2} ${GB - 22} L${GX + GBR} ${GB} A${GBR} ${GBRY} 0 0 1 ${GX - GBR} ${GB} Z" fill="#FFFFFF" opacity="0.35"/>`;
  S += `<path d="M${GX - GBR + 2} ${GB - 22} A${GBR - 2} ${GBRY} 0 0 0 ${GX + GBR - 2} ${GB - 22}" fill="none" stroke="#5E4F3E" stroke-width="2" opacity="0.4"/>`;
  S += `<path d="M${GX - GTR} ${GT} A${GTR} ${GRY} 0 0 0 ${GX + GTR} ${GT}" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.9"/>`;
  S += `<path d="M${GX - GTR} ${GT} A${GTR} ${GRY} 0 0 1 ${GX + GTR} ${GT}" fill="none" stroke="#5E4F3E" stroke-width="2" opacity="0.45"/>`;

  // ---------- bench props below the safe zone: rhizomes + a blue-rim enamel ceret ----------
  S += `<g><path d="M120 1732 C118 1714 160 1706 196 1712 C208 1696 234 1692 244 1706 C252 1718 240 1726 230 1729 C250 1730 276 1724 290 1734 C302 1746 288 1760 268 1758 C240 1762 212 1756 194 1754 C160 1762 122 1754 120 1732 Z" fill="#B97C2E"/>
    <path d="M156 1714 C162 1728 162 1744 156 1758 M190 1712 C196 1726 196 1742 192 1754 M236 1732 C242 1740 242 1750 238 1758" stroke="#7A5226" stroke-width="2.4" fill="none" opacity="0.7"/>
    <ellipse cx="122" cy="1734" rx="9" ry="19" fill="${TURM}"/><ellipse cx="122" cy="1734" rx="5" ry="12" fill="#C98A14"/>
    <g transform="translate(330 1780) rotate(-12)"><ellipse rx="34" ry="13" fill="#9A6A26"/><ellipse cy="-4" rx="30" ry="10" fill="${TURM}"/><ellipse cy="-4" rx="17" ry="5" fill="#F3C153"/></g>
    <g transform="translate(408 1752) rotate(8)"><ellipse rx="26" ry="10" fill="#A27A4E"/><ellipse cy="-3" rx="22" ry="8" fill="#F1E6CC"/></g></g>`;
  // blue-rim enamel ceret (kettle), sun from the upper left
  S += `<g filter="url(#b12)"><ellipse cx="${940 + 40}" cy="1886" rx="140" ry="16" fill="#4E361E" opacity="0.38"/></g>`;
  S += `<defs><linearGradient id="enamel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.35" stop-color="#F6F3EC"/><stop offset="0.75" stop-color="#DCD6CA"/><stop offset="1" stop-color="#BDB6A8"/></linearGradient></defs>`;
  S += `<g transform="translate(940 1884) scale(0.9)">
    <path d="M-60 -150 C-56 -246 56 -246 60 -150" fill="none" stroke="#3B3A38" stroke-width="7" stroke-linecap="round"/>
    <path d="M-92 -44 C-124 -64 -146 -112 -176 -152 L-162 -162 C-132 -130 -112 -104 -84 -92 Z" fill="url(#enamel)" stroke="#9A9284" stroke-width="1.5"/>
    <path d="M-176 -152 L-162 -162 L-158 -156 L-172 -146 Z" fill="${BLUE}"/>
    <path d="M-92 0 C-108 -44 -104 -112 -72 -146 L72 -146 C104 -112 108 -44 92 0 Z" fill="url(#enamel)"/>
    <path d="M-92 0 C-96 -6 -98 -12 -99 -18 L99 -18 C98 -12 96 -6 92 0 Z" fill="${BLUE}"/>
    <path d="M-74 -144 L74 -144 L72 -134 L-72 -134 Z" fill="${BLUE}"/>
    <path d="M-64 -144 C-58 -178 58 -178 64 -144 Z" fill="url(#enamel)" stroke="${BLUE}" stroke-width="5"/>
    <circle cx="0" cy="-176" r="10" fill="${BLUE}"/>
    <path d="M-92 0 C-108 -44 -104 -112 -72 -146" fill="none" stroke="#9A9284" stroke-width="1.5"/>
    <ellipse cx="-58" cy="-84" rx="9" ry="34" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="66" cy="-140" r="4" fill="#2A2A2A" opacity="0.7"/><circle cx="-80" cy="-14" r="3" fill="#2A2A2A" opacity="0.6"/></g>`;

  $("scene").innerHTML = S;

  // ---------- labels onto the bottles ----------
  items.forEach((it, i) => {
    const el = $("lab" + i), bx = BX_[i], lw = labW[side[i]];
    const cx = mx[i] + bx.c[0], cy = Y[i] + bx.c[1];
    el.style.left = f1(cx - lw / 2) + "px"; el.style.top = f1(cy - labH / 2) + "px";
    el.style.transform = "rotate(" + rotOf(i) + "deg)";
    if (i === hi) {
      const vl = $("vl" + i);
      // turmeric marker swash under the value (double stroke, like a seller marking the big one)
      const ux = vl.offsetLeft - 8, uy = vl.offsetTop + vl.offsetHeight - 10, uw = vl.offsetWidth + 16;
      el.insertAdjacentHTML("beforeend", `<svg class="ring" style="left:${f1(ux)}px;top:${f1(uy)}px;width:${f1(uw)}px;height:16px" viewBox="0 0 100 16" preserveAspectRatio="none"><path d="M2 7 C24 3 56 4 98 5 M8 13 C36 9 66 10 94 11" fill="none" stroke="${TURM}" stroke-width="5" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`);
    }
  });
  }

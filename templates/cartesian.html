<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Cartesian — hook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<!--DATA-->
<style>
  :root {
    --bg: #EDE8E0; --bg-2: #E2DBD1; --ink: #1A1A1A; --gray: #5A5A5A;
    --accent: #8A8178; --line: #B8B0A4; --overlay: rgba(255,255,255,0.3);
    /* taupe darkened just enough to clear 4.5:1 for 26–30px labels on stone */
    --label: #6B635B;
    --serif: "Playfair Display", Georgia, serif;
    --sans: "Inter", Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); color: var(--ink); }
  body { position: relative; font-family: var(--sans); }

  /* compass-drafted geometry: one ring pair + construction lines, drafting guide */
  .vline { position: absolute; left: 52px; top: 0; bottom: 0; width: 1px; background: var(--line); opacity: .45; }
  .geo { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; pointer-events: none; }

  .page { position: absolute; left: 90px; right: 90px; top: 150px; bottom: 300px; display: flex; flex-direction: column; }
  .label { font: 500 28px/1.2 var(--sans); letter-spacing: 3px; text-transform: uppercase; color: var(--label); }
  .head { display: flex; justify-content: space-between; align-items: baseline; }

  .title { margin-top: 96px; font-family: var(--serif); font-weight: 400; line-height: 1.08; letter-spacing: -.005em; max-width: 880px; }
  /* hl = Playfair italic + the system's single ink horizontal-accent beneath it */
  .title .hl { font-style: italic; white-space: nowrap; text-decoration: underline; text-decoration-color: var(--ink);
    text-decoration-thickness: 3px; text-underline-offset: .16em; }
  .sub { margin-top: 30px; margin-bottom: 56px; font: 400 40px/1.5 var(--sans); color: var(--gray); max-width: 820px; }

  /* the object: catalogue plate of specimen cards */
  .plate { margin-top: auto; margin-bottom: auto; width: 810px; }
  .plate-head { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 16px; border-bottom: 1px solid var(--line); margin-bottom: 22px; }
  .spec { display: grid; grid-template-columns: 96px 1fr auto; align-items: center; column-gap: 30px;
    background: var(--overlay); border: 1px solid var(--line); padding: 16px 30px 16px 18px; margin-bottom: 14px; }
  .ring { width: 96px; height: 96px; border-radius: 50%; border: 1px solid var(--line); position: relative;
    display: flex; align-items: center; justify-content: center; font: 400 44px/1 var(--serif); color: var(--label); }
  .ring::before { content: ""; position: absolute; inset: 13%; border-radius: 50%; border: 1px dashed var(--line); }
  .spec .cap { font: 500 26px/1 var(--sans); letter-spacing: 3px; text-transform: uppercase; color: var(--label); margin-bottom: 10px; }
  .spec .name { font: 400 56px/1.05 var(--serif); overflow-wrap: anywhere; }
  .spec .val { font: italic 400 50px/1 var(--serif); white-space: nowrap; text-align: right; padding-left: 26px; border-left: 1px solid var(--line); align-self: stretch; display: flex; align-items: center; }
  .few .spec { padding-top: 32px; padding-bottom: 32px; margin-bottom: 22px; grid-template-columns: 108px 1fr auto; }
  .few .ring { width: 108px; height: 108px; }
  .long .spec .name { font-size: 50px; } .long .spec .val { font-size: 46px; }

  /* stats-cluster style meta strip */
  .meta { flex-shrink: 0; display: grid; grid-template-columns: 2fr 1fr; gap: 36px; border-top: 1px solid var(--line); padding-top: 18px; }
  .meta .v { font: 400 29px/1.3 var(--serif); margin-top: 8px; }
</style>
</head>
<body>
<div class="vline"></div>
<svg class="geo" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <g fill="none" stroke="#B8B0A4" stroke-width="1.2">
    <circle cx="930" cy="560" r="430" opacity=".55"/>
    <circle cx="930" cy="560" r="330" opacity=".55" stroke-dasharray="6 8"/>
    <line x1="930" y1="80" x2="930" y2="1040" opacity=".45"/>
    <line x1="460" y1="560" x2="1080" y2="560" opacity=".45"/>
    <line x1="930" y1="560" x2="626" y2="256" opacity=".55"/>
    <path d="M 860 560 A 70 70 0 0 0 880.5 510.5" opacity=".7"/>
  </g>
  <circle cx="930" cy="560" r="5" fill="#8A8178"/>
</svg>
<div class="page">
  <div class="head"><span class="label" id="kicker"></span><span class="label" id="ep"></span></div>
  <h1 class="title" id="title"></h1>
  <p class="sub" id="sub"></p>
  <div class="plate" id="plate">
    <div class="plate-head"><span class="label" id="platename"></span><span class="label" id="n"></span></div>
    <div id="specs"></div>
  </div>
  <div class="meta">
    <div><div class="label">Sumber</div><div class="v" id="source"></div></div>
    <div><div class="label">Tanggal</div><div class="v" id="date"></div></div>
  </div>
</div>
<script>
  // Fallback sample so the file renders when opened directly.
  const FALLBACK = {
    series: "Cara kerja AI", ep: "#01", kicker: "Cara kerja AI · #01",
    title: "AI nggak baca kata. Dia baca token.", hl: "token",
    sub: "Makanya AI kadang salah hitung huruf di kata \"strawberry\".",
    items: [{ label: "Ken·apa", value: "2 token" }, { label: "AI", value: "1 token" },
            { label: "bisa", value: "1 token" }, { label: "ng·arang", value: "2 token" }],
    source: "ilustrasi — jumlah token beda tiap model", date: "per 14 Okt 2026"
  };
  const D = window.D && window.D.title ? window.D : FALLBACK;
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const $ = (id) => document.getElementById(id);
  function markTitle(t, hl) {
    const i = hl ? t.toLowerCase().indexOf(String(hl).toLowerCase()) : -1;
    if (i < 0) return esc(t);
    return esc(t.slice(0, i)) + '<span class="hl">' + esc(t.slice(i, i + hl.length)) + "</span>" + esc(t.slice(i + hl.length));
  }
  const ROMAN = ["I", "II", "III", "IV", "V"];

  const items = (D.items || []).slice(0, 5);
  $("kicker").textContent = D.series || D.kicker || "";
  $("ep").textContent = D.ep ? "No. " + String(D.ep).replace("#", "") : "";
  $("title").innerHTML = markTitle(D.title || "", D.hl);
  $("sub").textContent = D.sub || "";
  $("platename").textContent = "Plat " + (ROMAN[(parseInt(String(D.ep).replace(/\D/g, "")) || 1) - 1] || "I") + " · Spesimen";
  $("n").textContent = "n = " + items.length;
  $("specs").innerHTML = items.map((it, i) =>
    '<div class="spec"><div class="ring">' + ROMAN[i] + '</div><div><div class="name">' + esc(it.label) +
    '</div></div><div class="val">' + esc(it.value) + "</div></div>").join("");
  if (items.length <= 3) $("plate").classList.add("few");
  if (Math.max(...items.map((it) => String(it.label).length)) > 12) $("plate").classList.add("long");
  $("source").textContent = D.source || "";
  $("date").textContent = D.date || "";

  function fit() {
    const el = $("title");
    const len = (D.title || "").length;
    let size = len <= 24 ? 132 : len <= 36 ? 116 : len <= 48 ? 102 : 92;
    const maxH = items.length >= 5 ? 380 : items.length === 4 ? 440 : 500;
    el.style.fontSize = size + "px";
    while (el.offsetHeight > maxH && size > 76) { size -= 4; el.style.fontSize = size + "px"; }
  }
  fit();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
</script>
</body>
</html>

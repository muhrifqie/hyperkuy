<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>Split Diopter</title>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Red+Hat+Mono:wght@500;600&family=Atkinson+Hyperlegible:wght@400;700&display=block" rel="stylesheet" />
<!--DATA-->
<style>
  /*
    Split Diopter: we are looking at the director's field monitor. The whole frame is the
    picture: a long typed document stands in a row on a studio floor, receding from the lens.
    A half-moon split diopter holds page 1 (close, bottom) sharp, the bare half holds the last
    page (far, top) sharp, and the pages in between fall into the soft seam. Metaphor: "lost in
    the middle" in long contexts. The title is typed as the heading of page 1; items are typed on
    the receding pages. Focus peaking (monitor overlay) outlines only the sharp pages; the AC's
    tape "?" on the bezel marks the middle. Caption = burnt-in subtitle.
    Deterministic: every irregular shape is hard-coded.
  */
  :root { --ink: #1E1C19; --paper: #F3EDE2; --ribbon: #B42318; --peak: #FFC83A; --set: #0B0C0E; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0B0C0E; }
  body { position: relative; font-family: "Special Elite", monospace; color: var(--ink); }

  .deco { position: absolute; left: 0; top: 0; display: block; pointer-events: none; }
  #pic { position: absolute; left: 54px; top: 176px; width: 972px; height: 1744px; overflow: hidden;
    background: linear-gradient(180deg, #0A0B0D 0%, #0C0D0F 16%, #15130F 30%, #2E241A 40%, #5A4430 49%, #8A6A47 58%, #A88257 70%, #B98F60 100%); }
  #pic > * { position: absolute; }

  .pg { position: absolute; }
  .pg .body { position: absolute; left: 0; top: 0; right: 0; bottom: 0; }
  .pg .txt { position: absolute; left: 0; top: 0; right: 0; bottom: 0; }
  .pg .row { position: absolute; display: flex; justify-content: space-between; align-items: baseline; gap: 24px; white-space: nowrap; }
  .pg .no.alt { position: absolute; }
  .pg .lb { line-height: 1.08; color: #2B2823; }
  .pg .no { font-size: 30px; line-height: 1.08; color: #57524A; }
  .pg .vl { position: absolute; line-height: 1.04; white-space: nowrap; color: var(--ink); }
  .pg svg { position: absolute; overflow: visible; }
  /* focus peaking: the monitor paints the edges of whatever is in focus */
  .pk { text-shadow: 2px 0 0 var(--peak), -2px 0 0 var(--peak), 0 2px 0 var(--peak), 0 -2px 0 var(--peak),
    1.5px 1.5px 0 var(--peak), -1.5px 1.5px 0 var(--peak), 1.5px -1.5px 0 var(--peak), -1.5px -1.5px 0 var(--peak); }
  .pk-s { text-shadow: 1.5px 0 0 var(--peak), -1.5px 0 0 var(--peak), 0 1.5px 0 var(--peak), 0 -1.5px 0 var(--peak); }

  .near .hdr { position: absolute; display: flex; justify-content: space-between; gap: 30px; font-size: 28px; line-height: 1.14; color: #57524A; white-space: nowrap; }
  .near .ttl { position: absolute; line-height: 1.02; letter-spacing: -0.01em; color: var(--ink); }
  .near .ttl .hl { white-space: nowrap; color: var(--ribbon); text-decoration: underline; text-decoration-thickness: 0.05em; text-underline-offset: 0.12em; }
  .near .src { position: absolute; font-size: 28px; line-height: 1.14; color: #57524A; }

  .osd { left: 0; top: 116px; width: 972px; height: 58px; background: rgba(0,0,0,0.58); display: flex; align-items: center; justify-content: space-between;
    padding: 0 36px; font: 600 28px "Red Hat Mono", monospace; letter-spacing: 0.04em; color: #F4F4F2; white-space: nowrap; text-transform: uppercase; }
  .osd .l { display: flex; align-items: center; gap: 22px; }
  .osd .cam { background: #F4F4F2; color: #0B0C0E; padding: 1px 10px 0; border-radius: 3px; }
  .osd .dist { display: flex; align-items: center; gap: 10px; text-transform: none; }
  .osd svg { position: static; width: 28px; height: 28px; display: block; }

  .cap { position: absolute; left: 120px; width: 840px; text-align: center; font-family: "Atkinson Hyperlegible", sans-serif; font-weight: 700;
    font-size: 44px; line-height: 1.3; text-wrap: balance; }
  .cap .bar { background: rgba(0,0,0,0.68); padding: 0.06em 0.3em 0.1em; box-decoration-break: clone; -webkit-box-decoration-break: clone; color: #C9CDD2; }
  .cap .w { white-space: nowrap; }
  .cap .w.done { color: #FFFFFF; }
  .cap .w.on { color: var(--peak); }
</style>
</head>
<body>
<svg class="deco" id="frame" width="1080" height="1920" viewBox="0 0 1080 1920" data-layout-allow-overlap data-layout-allow-overflow aria-hidden="true"></svg>
<div id="pic"></div>
<svg class="deco" id="marks" width="1080" height="1920" viewBox="0 0 1080 1920" style="z-index:30" data-layout-allow-overlap data-layout-allow-overflow aria-hidden="true"></svg>
<div class="cap" id="cap" data-slot="caption" style="z-index:40"></div>
<script>
  // Fallback sample so the file also opens on its own in a browser.
  const D = window.D || { series: "Cara kerja AI", ep: "#01", kicker: "Cara kerja AI · #01",
    title: "AI nggak baca kata. Dia baca token.", hl: "token",
    sub: "Makanya AI kadang salah hitung huruf di kata \"strawberry\".",
    items: [{ label: "Ken·apa", value: "2 token" }, { label: "AI", value: "1 token" }, { label: "bisa", value: "1 token" }, { label: "ng·arang", value: "2 token" }],
    source: "ilustrasi — jumlah token beda tiap model", date: "per 14 Okt 2026" };

  const FONTS = ['400 100px "Special Elite"', '600 28px "Red Hat Mono"', '700 44px "Atkinson Hyperlegible"'];
  Promise.all(FONTS.map(f => document.fonts.load(f))).catch(() => {}).then(() => document.fonts.ready).then(render);

  function render() {
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const lerp = (a, b, t) => a + (b - a) * t;
  const NS = "http://www.w3.org/2000/svg";
  const PX = 54, PY = 176, PW = 972, PH = 1744;           // the monitor picture, global coords
  const FAR_TOP = 372;                                      // top of the far page (global)
  const CAP_BOTTOM = 1614;                                  // subtitle sits on the lower edge of the safe picture
  const pic = document.getElementById("pic");
  const items = (D.items || []).slice(0, 5);
  const n = items.length;

  // ---- caption: burnt-in film subtitle, karaoke ----------------------------------
  // Active unit = D.hl when it appears in the caption (one span), else the first word.
  const hl = String(D.hl || "");
  const capText = String(D.caption || D.sub || "");
  const cap = document.getElementById("cap");
  const ci = hl ? capText.toLowerCase().indexOf(hl.toLowerCase()) : -1;
  const parts = [];
  if (ci >= 0) {
    const pre = capText.slice(0, ci), mid = capText.slice(ci, ci + hl.length), post = capText.slice(ci + hl.length);
    const preW = pre.split(/\s+/).filter(Boolean), postW = post.split(/\s+/).filter(Boolean);
    const glueL = /\S$/.test(pre) && preW.length ? preW.pop() : "", glueR = /^\S/.test(post) && postW.length ? postW.shift() : "";
    preW.forEach(w => parts.push([w, "done"])); parts.push([glueL + mid + glueR, "on"]); postW.forEach(w => parts.push([w, ""]));
  } else {
    capText.split(/\s+/).filter(Boolean).forEach((w, k) => parts.push([w, k === 0 ? "on" : ""]));
  }
  cap.innerHTML = '<span class="bar">' + parts.map(([w, c]) => '<span class="w' + (c ? " " + c : "") + '">' + esc(w) + '</span>').join(" ") + '</span>';
  // 1-2 lines: try the centred 840 px slot, then the full 900 px safe width (still below y 1500), else 3 lines kept left of x 900
  const twoLines = () => cap.offsetHeight <= Math.round(parseFloat(cap.style.fontSize) * 1.3 * 2) + 2;
  let capOk = false;
  for (const [cx, cw] of [[120, 840], [90, 900]]) {
    cap.style.left = cx + "px"; cap.style.width = cw + "px";
    for (let fs = 44; fs >= 40; fs--) { cap.style.fontSize = fs + "px"; if (twoLines()) { capOk = true; break; } }
    if (capOk) break;
  }
  if (!capOk) { cap.style.left = "90px"; cap.style.width = "810px"; cap.style.fontSize = "40px"; }
  const capTop = CAP_BOTTOM - cap.offsetHeight;
  cap.style.top = capTop + "px";

  // ---- page 1 (near, sharp): the title is typed as its heading ------------------------
  const NL = 82, NR = 998;                 // near page edges (global)
  const TX = 110, TW = 790;                 // typed text column: x 110-900 (clear of the action buttons)
  const near = document.createElement("div");
  near.className = "pg near";
  near.style.cssText = "left:" + (NL - PX) + "px;width:" + (NR - NL) + "px;height:1400px;z-index:20";
  near.innerHTML = '<div class="body"></div><div class="txt">' +
    '<div class="hdr"><span>HLM 1</span><span>' + esc(D.date || "") + '</span></div>' +
    '<div class="ttl pk"></div>' +
    '<div class="src">' + (D.source ? "Sumber: " + esc(D.source) : "") + '</div></div>';
  pic.appendChild(near);
  const hdr = near.querySelector(".hdr"), ttl = near.querySelector(".ttl"), src = near.querySelector(".src");
  const colL = TX - NL;
  hdr.style.left = colL + "px"; hdr.style.width = TW + "px";
  ttl.style.left = colL + "px"; ttl.style.width = TW + "px";
  src.style.left = colL + "px"; src.style.width = TW + "px";

  const t = String(D.title || "");
  const at = hl ? t.toLowerCase().indexOf(hl.toLowerCase()) : -1;
  ttl.innerHTML = at < 0 ? esc(t) : esc(t.slice(0, at)) + '<span class="hl">' + esc(t.slice(at, at + hl.length)) + "</span>" + esc(t.slice(at + hl.length));

  const STRIP_MIN = 96;                                       // smallest readable page strip
  const minT = FAR_TOP + Math.max(1, n) * STRIP_MIN;
  const srcH = src.offsetHeight, hdrH = hdr.offsetHeight;
  const layoutT = th => capTop - 24 - (srcH ? srcH + 14 : 0) - th - 12 - hdrH - 20;
  let T = 0;
  const maxFs = t.length <= 24 ? 136 : 116;        // short hooks get a bigger heading
  for (let fs = maxFs; fs >= 84; fs -= 2) {        // >= 96 px for every in-contract title; 84-94 only as a last resort
    ttl.style.fontSize = fs + "px";
    T = layoutT(ttl.offsetHeight);
    if (ttl.scrollWidth <= TW + 1 && (T >= minT || fs <= 84)) break;
  }
  T = Math.round(Math.min(T, 1010));
  near.style.top = (T - PY) + "px";
  near.style.height = (1920 - T) + "px";              // cropped exactly by the frame bottom
  hdr.style.top = "20px";
  ttl.style.top = (20 + hdrH + 12) + "px";
  src.style.top = (20 + hdrH + 12 + ttl.offsetHeight + 14) + "px";
  const nearTextBottom = T + 20 + hdrH + 12 + ttl.offsetHeight + 14 + srcH;

  // ---- the receding pages (items) --------------------------------------------------
  // item i stands at depth t = (i+1)/n; the last item is the far page (sharp again).
  // strips shrink with distance (perspective) when there is room; never under STRIP_MIN
  const avail = T - FAR_TOP;
  const comp = n ? Math.max(0, Math.min(1, (avail / n - STRIP_MIN) / 60)) : 0;
  const wts = items.map((_, i) => lerp(1, lerp(1.24, 0.8, (i + 1) / n), comp));
  const wsum = wts.reduce((a, b) => a + b, 0) || 1;
  const strips = wts.map(w => avail * w / wsum);
  const hero = n >= 2 ? Math.floor((n - 1) / 2) : -1;
  let acc = 0;
  const pages = items.map((it, i) => {
    const tt = (i + 1) / n;
    const left = Math.round(lerp(NL, NL + 220, tt)), right = Math.round(lerp(NR, NR - 220, tt));
    acc += strips[i];
    const top = Math.round(T - acc), stripH = strips[i];
    const blur = i === n - 1 ? 0 : +(3.7 * Math.pow(Math.sin(Math.PI * tt), 1.4)).toFixed(2);
    const no = Math.round(100 * tt);
    return { it, i, tt, left, right, top, blur, no, stripH, sharp: i === n - 1 };
  });

  const RAG = [0.94, 0.88, 0.97, 0.62, 0.91, 0.95, 0.84, 0.99, 0.48, 0.93, 0.86, 0.97, 0.71, 0.9, 0.96, 0.8, 0.55, 0.92];
  // A typed line = a run of word-shaped bars (hard-coded word widths, in characters).
  const WORDS = [5, 3, 7, 4, 2, 6, 5, 8, 3, 4, 6, 2, 5, 7, 4, 3, 6, 5, 2, 8, 4, 5, 3, 6];
  const typedLines = (w, h, x0, y0, gap, ch, lh, color, seed) => {
    let s = "";
    for (let r = 0, y = y0; y < h - 10 && r < 60; r++, y += gap) {
      const lim = w * RAG[(r + seed) % RAG.length];
      let x = x0, k = (r * 7 + seed * 3) % WORDS.length;
      while (true) { const ww = WORDS[k % WORDS.length] * ch; if (x + ww > x0 + lim) break; s += '<rect x="' + x.toFixed(1) + '" y="' + y + '" width="' + ww.toFixed(1) + '" height="' + lh + '" rx="' + (lh / 2) + '" fill="' + color + '"/>'; x += ww + ch; k++; }
    }
    return s;
  };
  // Irregular dash pattern so peaking reads as edge shimmer, not as a selection box.
  const PEAK_DASH = "70 5 22 4 104 7 34 5 52 6 16 4 88 5";
  const peakEdge = (w, h) => '<path d="M1,' + h + ' L1,1 L' + (w - 1) + ',1 L' + (w - 1) + ',' + h + '" fill="none" stroke="#FFC83A" stroke-width="3" stroke-dasharray="' + PEAK_DASH + '" stroke-linejoin="round"/>';

  // Far pages first so nearer pages paint over them.
  [...pages].reverse().forEach(p => {
    const w = p.right - p.left, h = Math.min(Math.round(w * 1.3), 1920 - p.top);
    const el = document.createElement("div");
    el.className = "pg";
    el.style.cssText = "left:" + (p.left - PX) + "px;top:" + (p.top - PY) + "px;width:" + w + "px;height:" + h + "px;z-index:" + (10 + n - p.i);
    // paper falls off into shadow in the middle of the row; near and far pages sit in light
    const lit = 1 - Math.pow(Math.sin(Math.PI * p.tt), 1.2) * 0.75;
    const paperTop = "rgb(" + Math.round(lerp(214, 245, lit)) + "," + Math.round(lerp(206, 239, lit)) + "," + Math.round(lerp(192, 228, lit)) + ")";
    const pad = Math.round(lerp(40, 26, p.tt));
    const room = p.stripH - 12 - 10;
    let L = Math.round(lerp(40, 32, p.tt)), V = Math.round(lerp(74, 50, p.tt));
    if (1.08 * L + 1.04 * V > room) { const k = room / (1.08 * L + 1.04 * V); L = Math.max(30, Math.round(L * k)); V = Math.max(42, Math.floor((room - 1.08 * L) / 1.04)); }
    const textRight = Math.min(p.right - pad, 900);       // never put text in the action-button lane
    const tw = textRight - p.left - pad;
    el.innerHTML =
      '<div class="body" style="background:linear-gradient(180deg,' + paperTop + ' 0%,' + paperTop + ' 40%, #CFC6B6 100%);box-shadow:0 -8px 22px rgba(0,0,0,0.42), 0 0 0 1px rgba(0,0,0,0.12);' +
        (p.blur ? 'filter:blur(' + p.blur + 'px);' : '') + '"></div>' +
      '<div class="txt" style="' + (p.blur ? 'filter:blur(' + Math.min(1.8, p.blur) + 'px);' : '') + '">' +
        '<div class="row" style="left:' + pad + 'px;width:' + tw + 'px;top:12px"><span class="lb' + (p.sharp ? ' pk-s' : '') + '" style="font-size:' + L + 'px">' + esc(p.it.label) + '</span><span class="no">HLM ' + p.no + '</span></div>' +
        '<div class="vl' + (p.sharp ? ' pk' : '') + '" style="left:' + pad + 'px;top:' + (12 + Math.round(L * 1.08)) + 'px;font-size:' + V + 'px">' + esc(p.it.value) + '</div></div>';
    pic.appendChild(el);
    const body = el.querySelector(".body"), row = el.querySelector(".row"), lb = el.querySelector(".lb"), no = el.querySelector(".no"), vl = el.querySelector(".vl");
    for (let s = L; lb.offsetWidth > tw && s > 30; s--) lb.style.fontSize = s + "px";
    for (let s = V; vl.offsetWidth > tw && s > 42; s--) vl.style.fontSize = s + "px";
    if (lb.offsetWidth + no.offsetWidth + 24 > tw) {
      // too tight beside the label: the page number moves to the value line, or goes if that is full too
      if (vl.offsetWidth + no.offsetWidth + 24 <= tw) {
        no.remove(); no.className = "no alt";
        no.style.left = (pad + tw - no.offsetWidth) + "px";
        el.querySelector(".txt").appendChild(no);
        no.style.left = (pad + tw - no.offsetWidth) + "px";
        no.style.top = (parseFloat(vl.style.top) + vl.offsetHeight - no.offsetHeight - 4) + "px";
      } else no.remove();
    }
    // typed body copy under the strip (mostly hidden by the nearer page)
    const top0 = 12 + Math.round(L * 1.08) + vl.offsetHeight + 18;
    const bl = document.createElementNS(NS, "svg");
    bl.setAttribute("width", w); bl.setAttribute("height", h); bl.style.left = "0px"; bl.style.top = "0px";
    bl.innerHTML = typedLines(w - 2 * pad, h, pad, top0, Math.max(20, Math.round(w * 0.04)), Math.max(9, w * 0.016), Math.max(6, Math.round(w * 0.011)), "#BDB4A5", p.i * 5);
    body.appendChild(bl);
    if (p.sharp) {
      const pe = document.createElementNS(NS, "svg");
      pe.setAttribute("width", w); pe.setAttribute("height", h); pe.style.left = "0px"; pe.style.top = "0px";
      pe.innerHTML = peakEdge(w, h);
      el.appendChild(pe);
    }
    p.textH = 12 + Math.round(1.08 * parseFloat(lb.style.fontSize)) + vl.offsetHeight;
    p.textMid = p.top + Math.round((12 + p.textH) / 2);
  });

  // near page: paper, typed body copy below the text block, peaking on its edges
  {
    const w = NR - NL, h = 1920 - T;
    const body = near.querySelector(".body");
    body.style.cssText = "background:linear-gradient(180deg,#F6F1E7 0%,#F1EADD 55%,#E6DCCB 100%);box-shadow:0 -10px 30px rgba(0,0,0,0.45), 0 0 0 1px rgba(0,0,0,0.12)";
    const bl = document.createElementNS(NS, "svg");
    bl.setAttribute("width", w); bl.setAttribute("height", h); bl.style.left = "0px"; bl.style.top = "0px";
    bl.innerHTML = typedLines(TW, h, colL, nearTextBottom - T + 34, 46, 17, 9, "#CFC6B6", 2);
    body.appendChild(bl);
    const pe = document.createElementNS(NS, "svg");
    pe.setAttribute("width", w); pe.setAttribute("height", h); pe.style.left = "0px"; pe.style.top = "0px";
    pe.innerHTML = '<defs><linearGradient id="pkfade" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="560"><stop offset="0" stop-color="#FFC83A"/><stop offset="1" stop-color="#FFC83A" stop-opacity="0"/></linearGradient></defs>' +
      '<path d="M1,1 L' + (w - 1) + ',1" fill="none" stroke="#FFC83A" stroke-width="3" stroke-dasharray="' + PEAK_DASH + '"/>' +
      '<path d="M1,' + Math.min(560, h) + ' L1,1 M' + (w - 1) + ',1 L' + (w - 1) + ',' + Math.min(560, h) + '" fill="none" stroke="url(#pkfade)" stroke-width="3" stroke-dasharray="' + PEAK_DASH + '"/>';
    near.appendChild(pe);
  }

  // ---- the set: back wall + floor seams converging on the vanishing point ----------------
  {
    const VP = { x: 540 - PX, y: 250 - PY };
    let s = '<defs><radialGradient id="spot" cx="0.5" cy="0.2" r="0.42"><stop offset="0" stop-color="#F3EDE2" stop-opacity="0.16"/><stop offset="1" stop-color="#F3EDE2" stop-opacity="0"/></radialGradient>' +
      '<radialGradient id="pool" cx="0.5" cy="0.62" r="0.6"><stop offset="0" stop-color="#FFE2B0" stop-opacity="0.22"/><stop offset="1" stop-color="#FFE2B0" stop-opacity="0"/></radialGradient></defs>';
    s += '<rect width="' + PW + '" height="' + PH + '" fill="url(#spot)"/><rect width="' + PW + '" height="' + PH + '" fill="url(#pool)"/>';
    const fy = FAR_TOP + 120 - PY;  // where the floor starts to show
    for (let k = -12; k <= 12; k++) {
      const bx = VP.x + k * 190;
      s += '<line x1="' + VP.x + '" y1="' + VP.y + '" x2="' + bx + '" y2="' + PH + '" stroke="#000" stroke-opacity="0.22" stroke-width="2"/>';
    }
    [0.08, 0.17, 0.28, 0.42, 0.6, 0.82].forEach(f => { const y = Math.round(fy + (PH - fy) * f * f * 1.6); if (y < PH) s += '<line x1="0" y1="' + y + '" x2="' + PW + '" y2="' + y + '" stroke="#000" stroke-opacity="0.16" stroke-width="2"/>'; });
    s = s.replace('</defs>', '<clipPath id="flr"><rect x="0" y="' + fy + '" width="' + PW + '" height="' + (PH - fy) + '"/></clipPath></defs>');
    s = s.replace(/(<line [^>]*stroke-opacity="0.2[2]"[^>]*\/>)/g, '<g clip-path="url(#flr)">$1</g>');
    const fl = document.createElementNS(NS, "svg");
    fl.setAttribute("width", PW); fl.setAttribute("height", PH); fl.setAttribute("viewBox", "0 0 " + PW + " " + PH);
    fl.style.left = "0px"; fl.style.top = "0px"; fl.style.zIndex = 1;
    fl.setAttribute("data-layout-allow-overlap", ""); fl.setAttribute("data-layout-allow-overflow", "");
    fl.innerHTML = s; pic.insertBefore(fl, pic.firstChild);
  }

  // ---- the split-glass edge (seam) across the middle of the row -------------------------
  const hp = hero >= 0 ? pages[hero] : null;
  const seamY = hp ? hp.top + Math.round(Math.min(hp.stripH - 10, hp.textH + (hp.stripH - hp.textH) / 2)) : Math.round((FAR_TOP + T) / 2);
  const TILT = 14;
  {
    const yL = seamY + TILT - PY, yR = seamY - TILT - PY;
    const sv = document.createElementNS(NS, "svg");
    sv.setAttribute("width", PW); sv.setAttribute("height", PH); sv.setAttribute("viewBox", "0 0 " + PW + " " + PH);
    sv.style.cssText = "left:0;top:0;z-index:25;mix-blend-mode:screen";
    sv.setAttribute("data-layout-allow-overlap", ""); sv.setAttribute("data-layout-allow-overflow", "");
    sv.innerHTML = '<line x1="0" y1="' + yL + '" x2="' + PW + '" y2="' + yR + '" stroke="#FFF6E4" stroke-opacity="0.5" stroke-width="2"/>' +
      '<line x1="0" y1="' + (yL + 4) + '" x2="' + PW + '" y2="' + (yR + 4) + '" stroke="#FFC83A" stroke-opacity="0.28" stroke-width="2"/>';
    pic.appendChild(sv);
  }

  // ---- monitor status line (the kicker) ------------------------------------------------
  {
    const osd = document.createElement("div");
    osd.className = "osd"; osd.style.zIndex = 35;
    const DIOPTER = '<svg viewBox="0 0 28 28"><circle cx="14" cy="14" r="11" fill="none" stroke="#F4F4F2" stroke-width="2.4"/><path d="M3 14a11 11 0 0 0 22 0z" fill="#FFC83A"/></svg>';
    const right = [D.series || D.kicker || "", D.ep || ""].filter(Boolean).join(" ");
    osd.innerHTML = '<div class="l"><span class="cam">A-CAM</span><span>T2.8</span><span class="dist">' + DIOPTER + '<span>0,6 m · ∞</span></span></div><span>' + esc(right) + '</span>';
    osd.style.top = (292 - PY) + "px";
    pic.appendChild(osd);
  }

  // ---- monitor body: hood, bezels; AC tape "?" + seam index notches on the bezel --------
  {
    let f = '<defs><linearGradient id="hood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#08090A"/><stop offset="1" stop-color="#1A1C20"/></linearGradient>' +
      '<linearGradient id="bez" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#101114"/><stop offset="1" stop-color="#1D2024"/></linearGradient>' +
      '<linearGradient id="bez2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1D2024"/><stop offset="1" stop-color="#101114"/></linearGradient></defs>';
    f += '<rect width="1080" height="1920" fill="#0B0C0E"/>';
    f += '<path d="M0 0 H1080 V' + PY + ' H0 Z" fill="url(#hood)"/>';
    f += '<path d="M0 40 L1080 40 L1026 ' + (PY - 14) + ' L54 ' + (PY - 14) + ' Z" fill="#14161A"/>';
    f += '<rect x="0" y="' + (PY - 14) + '" width="1080" height="14" fill="#202328"/>';
    f += '<rect x="0" y="' + PY + '" width="' + PX + '" height="' + (1920 - PY) + '" fill="url(#bez)"/><rect x="' + (PX + PW) + '" y="' + PY + '" width="' + (1080 - PX - PW) + '" height="' + (1920 - PY) + '" fill="url(#bez2)"/>';
    f += '<rect x="' + (PX - 3) + '" y="' + (PY - 3) + '" width="' + (PW + 6) + '" height="' + (1920 - PY + 6) + '" fill="none" stroke="#2C3036" stroke-width="3"/>';
    // screws on the hood
    [[120, 110], [960, 110]].forEach(([x, y]) => { f += '<circle cx="' + x + '" cy="' + y + '" r="13" fill="#1A1D21" stroke="#30343A" stroke-width="2.5"/><path d="M' + (x - 7) + ' ' + y + ' h14" stroke="#08090A" stroke-width="3"/>'; });
    document.getElementById("frame").innerHTML = f;

    let m = "";
    // seam index notches where the glass edge leaves the picture
    const notch = (x, y, dir) => '<path d="M' + x + ' ' + (y - 11) + ' L' + (x + dir * 15) + ' ' + y + ' L' + x + ' ' + (y + 11) + ' Z" fill="#FFC83A"/>';
    m += notch(36, seamY + TILT, 1) + notch(1044, seamY - TILT, -1);
    // AC camera tape on the bezel at the height of the middle page: a "?" in marker
    if (hp) {
      const ty = hp.textMid;
      m += '<g transform="translate(46 ' + ty + ') rotate(-4)">' +
        '<path d="M-40 -31 L-34 -33 L36 -32 L41 -26 L38 -16 L41 -6 L38 4 L41 14 L38 24 L40 31 L-36 33 L-41 27 L-38 17 L-41 7 L-38 -3 L-41 -13 L-38 -23 Z" fill="#FFC83A"/>' +
        '<path d="M-9 -12 C-9 -22 1 -26 7 -23 C14 -20 14 -11 8 -6 C3 -2 1 1 1 7" fill="none" stroke="#141414" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>' +
        '<circle cx="1" cy="18" r="3.6" fill="#141414"/></g>';
    }
    document.getElementById("marks").innerHTML = m;
  }
  }
</script>

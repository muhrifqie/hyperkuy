<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;800&family=IBM+Plex+Mono:wght@400;500&display=block" rel="stylesheet" />
<!--DATA-->
<style>
  /*
    Peta Jalur (fable-peta-jalur): a transit map in the Harry Beck tradition.
    The AI concept is one cobalt line; every item is a station on it. Lines use
    only 0/45/90 degree angles with rounded joins; stations are white circles
    with a thick ink stroke; the interchange (station matching `hl`, else the
    first) is a double ring. Two light grey lines cross the frame as other
    routes, purely for map context.

    Signature move (video, not animated here): the cobalt line draws itself
    from the left edge (stroke-dashoffset), pausing at each station while the
    circle scales up from 0; a small cobalt dot (the train) travels along the
    line and each label appears the moment the train passes its station.
    Scene change = the camera pans along the line to the next station.
  */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #F6F6F2; }
  body { position: relative; color: #1C1D22; font-family: "Hanken Grotesk", sans-serif; }

  .top { position: absolute; left: 90px; right: 90px; top: 300px; display: flex; justify-content: space-between; font: 500 28px "IBM Plex Mono", monospace; color: #6B6E78; letter-spacing: 0.04em; text-transform: uppercase; }
  .top b { font-weight: 500; color: #1D4ED8; }
  .title { position: absolute; left: 90px; width: 900px; top: 364px; font-size: 100px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.0; }
  .title .hl { color: #1D4ED8; }
  svg { position: absolute; left: 0; top: 640px; width: 1080px; height: 780px; display: block; }
  .sub { position: absolute; left: 90px; width: 810px; top: 1436px; font-size: 40px; font-weight: 500; line-height: 1.3; }
  .foot { position: absolute; left: 90px; right: 90px; top: 1566px; display: flex; justify-content: space-between; gap: 40px; font: 400 26px "IBM Plex Mono", monospace; color: #6B6E78; line-height: 1.4; }
  .foot span:last-child { white-space: nowrap; }
</style>
</head>
<body>
<div class="top"><span id="kick"></span><span id="ep"></span></div>
<div class="title" id="title"></div>
<svg id="map" viewBox="0 0 1080 780" xmlns="http://www.w3.org/2000/svg"></svg>
<div class="sub" id="sub"></div>
<div class="foot"><span id="src"></span><span id="date"></span></div>
<script>
  // Fallback sample so the file also opens standalone in a browser.
  const D = window.D || { series: "Cara kerja AI", ep: "#01", kicker: "Cara kerja AI · #01",
    title: "AI nggak baca kata. Dia baca token.", hl: "token",
    sub: "Makanya AI kadang salah hitung huruf di kata \"strawberry\".",
    items: [{ label: "Ken·apa", value: "2 token" }, { label: "AI", value: "1 token" }, { label: "bisa", value: "1 token" }, { label: "ng·arang", value: "2 token" }],
    source: "ilustrasi, jumlah token beda tiap model", date: "per 14 Okt 2026" };
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const hlWrap = (t, h) => { const i = h ? t.toLowerCase().indexOf(h.toLowerCase()) : -1;
    return i < 0 ? esc(t) : esc(t.slice(0, i)) + `<span class="hl">${esc(t.slice(i, i + h.length))}</span>` + esc(t.slice(i + h.length)); };
  const items = (D.items || []).slice(0, 5);
  const INK = "#1C1D22", LINE = "#1D4ED8", GREY = "#D5D7DD", PAPER = "#F6F6F2";

  document.getElementById("kick").textContent = D.series || D.kicker || "";   // ep goes top-right, so the left shows the series only
  document.getElementById("ep").textContent = D.ep || "";
  document.getElementById("title").innerHTML = hlWrap(D.title || "", D.hl);
  document.getElementById("sub").textContent = D.sub || "";
  document.getElementById("src").textContent = D.source ? `sumber: ${D.source}` : "";
  document.getElementById("date").textContent = D.date || "";

  /* ---------- MAP geometry (SVG units = px, band y 640..1420 on the frame) ----------
     Cobalt line: enters at the left edge (0, HY), horizontal to (DX0, HY), 45 degree
     diagonal down-right to (VX, VY0), vertical down and off the bottom edge.          */
  const H = 780, HY = 150, DX0 = 460, VX = 600, VY0 = HY + (VX - DX0);
  const nH = Math.min(2, Math.max(1, items.length - 1)), nV = items.length - nH;   // 2 on the horizontal, rest on the vertical
  const stations = [];
  for (let i = 0; i < nH; i++) stations.push({ x: nH === 1 ? 200 : 110 + i * 190, y: HY, seg: "h", side: i % 2 ? "above" : "below" });
  const vTop = VY0 + 60, vBot = H - 160;                                             // keep the bottom-left corner for the legend
  for (let i = 0; i < nV; i++) stations.push({ x: VX, y: nV === 1 ? (vTop + vBot) / 2 : vTop + i * (vBot - vTop) / (nV - 1), seg: "v", side: i % 2 ? "right" : "left" });
  const hl = String(D.hl || "").toLowerCase();
  let inter = hl ? items.findIndex((it) => String(it.label).toLowerCase().includes(hl) || hl.includes(String(it.label).toLowerCase())) : -1;
  if (inter < 0) inter = 0;

  const circle = (s, i) => i === inter
    ? `<circle cx="${s.x}" cy="${s.y}" r="27" fill="#fff" stroke="${INK}" stroke-width="6"/><circle cx="${s.x}" cy="${s.y}" r="13" fill="#fff" stroke="${INK}" stroke-width="6"/>`
    : `<circle cx="${s.x}" cy="${s.y}" r="16" fill="#fff" stroke="${INK}" stroke-width="6"/>`;
  const label = (s, it) => {
    const name = esc(it.label), val = esc(it.value);
    const L = `font-family="Hanken Grotesk" font-weight="600" font-size="38" fill="${INK}"`;
    const V = `font-family="Hanken Grotesk" font-weight="800" font-size="44" fill="${LINE}"`;
    if (s.seg === "h") {
      const x = s.x - 16, up = s.side === "above";
      const y1 = up ? s.y - 92 : s.y + 68, y2 = up ? s.y - 44 : s.y + 116;        // label line then value line
      return `<text x="${x}" y="${y1}" ${L}>${name}</text><text x="${x}" y="${y2}" ${V}>${val}</text>`;
    }
    const right = s.side === "right", x = right ? s.x + 48 : s.x - 48, a = right ? "start" : "end";
    return `<text class="lb" x="${x}" y="${s.y - 10}" text-anchor="${a}" ${L}>${name}</text><text x="${x}" y="${s.y + 40}" text-anchor="${a}" ${V}>${val}</text>`;
  };
  const route = `M 0 ${HY} H ${DX0} L ${VX} ${VY0} V ${H + 20}`;
  const n = items.length;
  const legendW = 60 + 18 * Math.max(String(D.series || "").length, `${n} stasiun`.length) + 36;
  document.getElementById("map").innerHTML = `
    <g fill="none" stroke="${GREY}" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 820 -20 V 230 L 950 360 V ${H + 20}"/>
      <path d="M -20 ${H - 40} H 1100"/>
    </g>
    <g fill="#fff" stroke="${GREY}" stroke-width="5">
      <circle cx="820" cy="100" r="10"/><circle cx="950" cy="520" r="10"/><circle cx="950" cy="690" r="10"/>
      <circle cx="760" cy="${H - 40}" r="10"/>
    </g>
    <line x1="0" y1="${H - 1}" x2="1080" y2="${H - 1}" stroke="${GREY}" stroke-width="2"/>
    <path d="${route}" fill="none" stroke="${LINE}" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    ${stations.map((s, i) => circle(s, i)).join("")}
    ${stations.map((s, i) => label(s, items[i])).join("")}
    <g transform="translate(90 ${H - 118})">
      <rect x="0" y="0" width="${legendW}" height="98" fill="${PAPER}" stroke="${INK}" stroke-width="2"/>
      <line x1="18" y1="32" x2="60" y2="32" stroke="${LINE}" stroke-width="10" stroke-linecap="round"/>
      <circle cx="39" cy="32" r="8" fill="#fff" stroke="${INK}" stroke-width="4"/>
      <text x="76" y="41" font-family="IBM Plex Mono" font-size="26" fill="${INK}">${esc(D.series || "")}</text>
      <text x="76" y="78" font-family="IBM Plex Mono" font-size="26" fill="#6B6E78">${n} stasiun</text>
    </g>`;

  // Title: shrink until it fits 3 lines and stays above the map band (y 620 on the frame).
  const fit = () => {
    const t = document.getElementById("title"); let fs = 104; t.style.fontSize = fs + "px";
    while ((t.offsetHeight > fs * 3.1 || 364 + t.offsetHeight > 620) && fs > 80) { fs -= 2; t.style.fontSize = fs + "px"; }
    // Right-side station labels must not cross x 900 (TikTok buttons): shrink that label if needed.
    document.querySelectorAll("#map text.lb").forEach((el) => { let f = 38;
      while (el.getBBox().x + el.getBBox().width > 896 && f > 30) { f -= 1; el.setAttribute("font-size", f); } });
  };
  fit(); (document.fonts ? document.fonts.ready : Promise.resolve()).then(fit);
</script>
</body>
</html>

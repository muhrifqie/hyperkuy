<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Fakta Nutrisi, hook</title>
<!--
  Style: "Fakta Nutrisi". The FDA/BPOM Nutrition Facts label with absolute
  typographic fidelity, printed on a deep-blue product package. The only
  identity device is the hierarchy of rule weights: 10px / 5px / 1px / 8px.
  Signature move (for the video version, NOT animated here): the thick black
  rules draw left-to-right, then each row's value counts/types in; the whole
  card slides up as if it is being pulled out of the package.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<!--DATA-->
<style>
  :root {
    --pack: #0F2F8F; --white: #FFFFFF; --ink: #111111;
    --sans: "Archivo", Arial, sans-serif;
    --mono: "IBM Plex Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body { position: relative; background: var(--pack); color: var(--white); font-family: var(--sans); }

  /* 2% paper noise on the package, deterministic (fixed seed) */
  .noise { position: absolute; inset: 0; opacity: .02; pointer-events: none; }

  .strip { position: absolute; left: 90px; right: 90px; top: 300px; display: flex; justify-content: space-between;
    font: 400 28px/1 var(--mono); letter-spacing: .04em; opacity: .7; text-transform: uppercase; }

  .title { position: absolute; left: 90px; top: 364px; width: 900px; font-weight: 900; line-height: 1.06;
    letter-spacing: -.02em; color: var(--white); }
  /* hl = thick white underline bar, echoing the label's 12px rule */
  .title .hl { text-decoration: underline; text-decoration-thickness: 12px; text-underline-offset: 10px;
    text-decoration-skip-ink: none; white-space: nowrap; }

  /* the object: the Nutrition Facts label */
  .card { position: absolute; left: 90px; top: 760px; width: 810px; background: var(--white); color: var(--ink);
    border: 3px solid var(--ink); border-radius: 6px; padding: 22px 26px 24px; }
  .card h2 { font: 900 72px/1 var(--sans); letter-spacing: -.02em; }
  .serving { margin-top: 0; font: 400 34px/1.25 var(--sans); }
  .serving b { font-weight: 700; }
  .serving .per { display: flex; justify-content: space-between; }
  .bar10 { height: 10px; background: var(--ink); margin: 12px 0 8px; }
  .bar5 { height: 5px; background: var(--ink); margin: 8px 0 2px; }
  .bar8 { height: 8px; background: var(--ink); margin: 0 0 10px; }
  .amount { font: 700 30px/1.3 var(--sans); padding: 4px 0 6px; border-bottom: 1px solid var(--ink); }
  .row { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 24px;
    border-bottom: 1px solid var(--ink); padding: 11px 0 10px; }
  .row:last-child { border-bottom: 0; }
  .row .lab { font: 700 40px/1.1 var(--sans); overflow-wrap: anywhere; }
  .row .lab.key { font-weight: 900; }
  .row .val { font: 900 40px/1.1 var(--sans); text-align: right; white-space: nowrap; }
  .few .row { padding: 22px 0 21px; }
  .four .row { padding: 15px 0 14px; }
  .foot { font: 400 28px/1.3 var(--sans); }

  .sub { position: absolute; left: 90px; width: 810px; font: 500 36px/1.25 var(--sans); color: var(--white); }
</style>
</head>
<body>
<svg class="noise" width="1080" height="1920" xmlns="http://www.w3.org/2000/svg">
  <filter id="paper"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/></filter>
  <rect width="1080" height="1920" filter="url(#paper)"/>
</svg>
<div class="strip"><span id="kicker"></span><span id="date"></span></div>
<h1 class="title" id="title"></h1>
<div class="card" id="card">
  <h2>Fakta Nutrisi</h2>
  <div class="bar10"></div>
  <div class="serving">
    <div>Takaran saji <b>1 prompt</b></div>
    <div class="per"><span>Sajian per video</span><b id="n"></b></div>
  </div>
  <div class="bar5"></div>
  <div class="amount">Jumlah per sajian</div>
  <div id="rows"></div>
  <div class="bar8"></div>
  <div class="foot" id="foot"></div>
</div>
<p class="sub" id="sub"></p>
<script>
  // Fallback sample so the file renders when opened directly.
  const FALLBACK = {
    series: "Cara kerja AI", ep: "#01", kicker: "Cara kerja AI · #01",
    title: "AI nggak baca kata. Dia baca token.", hl: "token",
    sub: "Makanya AI kadang salah hitung huruf di kata \"strawberry\".",
    items: [{ label: "Ken·apa", value: "2 token" }, { label: "AI", value: "1 token" },
            { label: "bisa", value: "1 token" }, { label: "ng·arang", value: "2 token" }],
    source: "ilustrasi, jumlah token beda tiap model", date: "per 14 Okt 2026"
  };
  const D = window.D && window.D.title ? window.D : FALLBACK;
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const $ = (id) => document.getElementById(id);
  function markTitle(t, hl) {
    const i = hl ? t.toLowerCase().indexOf(String(hl).toLowerCase()) : -1;
    if (i < 0) return esc(t);
    return esc(t.slice(0, i)) + '<span class="hl">' + esc(t.slice(i, i + hl.length)) + "</span>" + esc(t.slice(i + hl.length));
  }

  const items = (D.items || []).slice(0, 5);
  const hl = String(D.hl || "").toLowerCase();
  $("kicker").textContent = D.kicker || ((D.series || "") + " " + (D.ep || ""));
  $("date").textContent = D.date || "";
  $("title").innerHTML = markTitle(D.title || "", D.hl);
  $("n").textContent = items.length;
  $("rows").innerHTML = items.map((it) => {
    const key = hl && String(it.label).toLowerCase().includes(hl) ? " key" : "";
    return '<div class="row"><span class="lab' + key + '">' + esc(it.label) + '</span><span class="val">' + esc(it.value) + "</span></div>";
  }).join("");
  if (items.length <= 3) $("card").classList.add("few");
  else if (items.length === 4) $("card").classList.add("four");
  $("foot").textContent = "* Sumber: " + (D.source || "") + ". Jumlah bisa berbeda tergantung model dan konteks.";
  $("sub").textContent = D.sub || "";

  // Title: 100px down to 72px (spec floor 88 holds for titles up to ~50 chars; 72 = contract floor for 3:1 contrast), max 3 lines (box 364 to 740)
  function fit() {
    const el = $("title");
    let size = 100; el.style.fontSize = size + "px";
    while (el.offsetHeight > size * 3.25 && size > 72) { size -= 2; el.style.fontSize = size + "px"; }
    // sub sits under the card, card is content-sized
    const card = $("card");
    $("sub").style.top = Math.min(1540, card.offsetTop + card.offsetHeight + 40) + "px";
  }
  fit();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
</script>
</body>
</html>
